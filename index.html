<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moksha Patam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&display=swap">
<!-- Hind draws Devanagari digits in Western shapes, so the ten digits come from Noto instead -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700&text=%E0%A5%A6%E0%A5%A7%E0%A5%A8%E0%A5%A9%E0%A5%AA%E0%A5%AB%E0%A5%AC%E0%A5%AD%E0%A5%AE%E0%A5%AF&display=swap">
<style>
/* Layout: board as the hero on the left, a narrow control column (turn, die, players, log) on the right; stacks on phones. */
:root {
  color-scheme: light;
  --ground: #E4E7F0;
  --surface: #F6F7FB;
  --ink: #1A1D35;
  --muted: #5B6080;
  --line: #CBD0E0;
  --accent: #2B3A8F;
  --on-accent: #FFFFFF;
  --f-display: "Noto Sans Devanagari", "Rozha One", "Iowan Old Style", Georgia, serif;
  --f-body: "Noto Sans Devanagari", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --p0: #C0392B; --p1: #2E5BBA; --p2: #2E8B57; --p3: #D98300;
  --frame-red: #B5261E; --frame-dark: #5A1208; --frame-gold: #F6C443;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #11132A; --surface: #1B1E3A; --ink: #ECEDF7; --muted: #A2A7C6;
    --line: #2E3257; --accent: #A3B2FF; --on-accent: #11132A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #11132A; --surface: #1B1E3A; --ink: #ECEDF7; --muted: #A2A7C6;
  --line: #2E3257; --accent: #A3B2FF; --on-accent: #11132A;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 14px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; grid-column: 1 / -1; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.lang button { padding: 5px 14px; border: 0; border-radius: 0; background: transparent; color: var(--ink); font-size: 14px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 820px) { .game { grid-template-columns: 1fr; } }

/* Board: an ornate red-and-gold printed frame around a 10 x 11 grid (100 earthly squares + a row of heavenly realms). */
.board-col { display: flex; flex-direction: column; gap: 10px; }
.board-frame {
  --fp: clamp(8px, 2.6vw, 18px);
  width: 100%; max-width: 600px;
  padding: var(--fp);
  background: radial-gradient(circle, var(--frame-gold) 0 1.6px, transparent 2.2px) 0 0 / 11px 11px, var(--frame-red);
  border: 3px solid var(--frame-dark); border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--frame-gold), 0 10px 30px rgba(10, 12, 40, 0.3);
}
.board-wrap { position: relative; width: 100%; aspect-ratio: 10 / 11; border: 3px solid var(--frame-dark); outline: 2px solid var(--frame-gold); background: var(--frame-dark); container-type: inline-size; }
.cells, .labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(11, 1fr); }
.cell { position: relative; box-shadow: inset 0 0 0 0.5px rgba(40, 18, 4, 0.45); }
/* The picture on each plain square sits under the snakes and ladders, like the painted boards. */
.cell .pic { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 8%; font-family: var(--f-emoji); font-size: 4.6cqi; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3)); }
.cell.heaven { background: radial-gradient(circle at 50% 40%, #FFF3C4, #F2C14E 62%, #D9922B); box-shadow: inset 0 -3px 0 var(--frame-dark), inset 0 0 0 0.5px rgba(90, 30, 8, 0.5); }
.cell.goal { background: radial-gradient(circle at 50% 42%, #4A5CD0, #1E2A78 75%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cells { filter: brightness(0.9) saturate(0.92); } }
:root[data-theme="dark"] .cells { filter: brightness(0.9) saturate(0.92); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fx { z-index: 1; }

/* The four ashramas, written up the left edge of the frame. */
.ashramas { position: absolute; top: 0; bottom: 0; right: calc(100% + 3px); width: var(--fp); pointer-events: none; }
.ashramas span {
  position: absolute; left: 50%; transform: translate(-50%, -50%) rotate(180deg);
  writing-mode: vertical-rl; white-space: nowrap;
  font-size: calc(var(--fp) * 0.58); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1;
  color: var(--frame-gold); background: var(--frame-red); padding: 4px 0;
}

/* Square labels sit above the snakes and ladders so numbers and symbols stay readable. */
.labels { z-index: 1; }
.lab { position: relative; min-width: 0; overflow: hidden; }
.lab .n { position: absolute; top: 3%; left: 5%; font-size: clamp(7px, 1.75cqi, 12px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #3A2208; text-shadow: 0 0 2px rgba(255, 248, 230, 0.9); }
.lab.li .n, .lab.goal .n { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.lab .ic {
  position: absolute; top: 4%; right: 4%;
  width: 3.9cqi; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
  background: #FFF6DE; border: max(1px, 0.3cqi) solid #C98B3E;
  font-family: var(--f-emoji); font-size: 2.2cqi; line-height: 1;
}
.lab.vice .ic { border-color: #B3261E; }
.lab.virtue .ic { border-color: #2E7D4F; }
.lab .nm {
  position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
  max-width: 96%; padding: 0 0.5cqi; border-radius: 1cqi;
  background: rgba(28, 16, 6, 0.78); color: #FFF3D6;
  font-size: clamp(6px, 1.3cqi, 10px); font-weight: 600; line-height: 1.4;
  white-space: nowrap; overflow: hidden;
}
.lab.vice .nm { background: rgba(120, 20, 12, 0.88); }
.lab.virtue .nm { background: rgba(22, 80, 44, 0.9); }
.lab.heaven .ic { top: 43%; left: 50%; right: auto; transform: translate(-50%, -50%); width: auto; background: none; border: none; font-size: 4.2cqi; filter: drop-shadow(0 1px 1px rgba(90, 40, 0, 0.45)); }
.lab .dv { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-family: var(--f-display); font-size: clamp(7px, 1.75cqi, 13px); line-height: 1; color: #5A1E08; white-space: nowrap; }
.lab.goal .om { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 5.6cqi; line-height: 1; color: #FFD86B; text-shadow: 0 0 1.2cqi rgba(255, 210, 90, 0.85); animation: glow 3s ease-in-out infinite; }
.lab.goal .dv { color: #FFE7A0; }
@keyframes glow { 50% { text-shadow: 0 0 2.4cqi rgba(255, 220, 110, 1); } }
@container (max-width: 440px) {
  .lab .nm, .ashramas { display: none; }
  .lab .ic { width: 4.6cqi; font-size: 2.6cqi; }
}

/* Players: pixel-art figures that walk, climb and grow. Feet sit on the square, with a shadow in the player's colour. */
.tokens { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.token {
  position: absolute; width: 7.4%; aspect-ratio: 12 / 16;
  transform: translate(-50%, -92%);
  transition: left 0.14s ease-out, top 0.14s ease-out;
  z-index: 2;
}
.token.free { transition: none; }
.token::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -5%; height: 15%; border-radius: 50%;
  background: var(--pc); box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0, 0, 0, 0.5); z-index: -1;
}
.token .body { width: 100%; height: 100%; }
.token .spr { width: 100%; height: 100%; background-size: 100% 100%; image-rendering: pixelated; filter: drop-shadow(0 0 0.6px #fff) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45)); }
.token.left .spr { transform: scaleX(-1); }
.token.divine .spr { filter: drop-shadow(0 0 3px #FFD54A) drop-shadow(0 0 1px #fff); }
.token.active { z-index: 3; }
.token.active .body { animation: bob 1.1s ease-in-out infinite; }
.token.hop .body { animation: hop 0.18s ease-out; }
.token.gulp .body { transform-origin: 50% 30%; animation: gulp 0.34s ease-in forwards; }
.token.dizzy .body { animation: dizzy 0.7s ease-out; }
.token.hide { opacity: 0; }
.token.poof::before {
  content: ""; position: absolute; inset: -45%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 236, 150, 0.95) 0 18%, rgba(255, 200, 80, 0.55) 40%, transparent 66%);
  animation: poof 0.65s ease-out forwards;
}
@keyframes bob { 50% { transform: translateY(-7%); } }
@keyframes hop { 50% { transform: translateY(-24%); } }
@keyframes gulp { to { transform: translateY(-30%) scale(0); } }
@keyframes dizzy { 0% { transform: scale(0.2) rotate(0); } 60% { transform: scale(1.15) rotate(540deg); } 100% { transform: scale(1) rotate(720deg); } }
@keyframes poof { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.tray .token { position: relative; left: auto !important; top: auto !important; transform: none; width: 24px; }
.tray .token .body { animation: none; }

.tray { display: flex; align-items: center; gap: 10px; min-height: 40px; color: var(--muted); font-size: 13px; }
.tray .label { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; font-size: 11px; }
.tray .slots { display: flex; gap: 8px; }

/* Stage-change banner */
.toast {
  position: absolute; left: 50%; top: 11%; z-index: 4; pointer-events: none;
  background: rgba(28, 16, 6, 0.9); color: #FFF3D6; border: 1px solid var(--frame-gold);
  padding: 0.6cqi 2.4cqi; border-radius: 99px; white-space: nowrap;
  font-size: max(12px, 2.3cqi); font-weight: 600;
  animation: toast 2.4s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

/* Landing card: the square's symbol zooms out of its cell. Fixed parchment colours so it reads the same in both themes. */
.sqcard { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; cursor: pointer; }
.sq {
  position: relative; overflow: hidden; width: min(68%, 380px);
  display: flex; flex-direction: column; align-items: center; gap: 0.9cqi;
  padding: 4cqi 4cqi 3.4cqi; border-radius: 2cqi; text-align: center;
  background: #FFF8E6; color: #2A1A08; border: 3px solid #C98B3E;
  box-shadow: 0 1.6cqi 5cqi rgba(0, 0, 0, 0.5);
}
.sq > * { position: relative; z-index: 1; }
.sq .eb { font-size: max(10px, 1.9cqi); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A5A1E; }
.sq .big { font-family: var(--f-emoji); font-size: 13cqi; line-height: 1.1; }
.sq .nm { font-family: var(--f-display); font-size: 5.4cqi; line-height: 1.05; }
.sq .dv { font-family: var(--f-display); font-size: 3.4cqi; line-height: 1.1; color: #7A4A12; }
.sq .tc { margin: 0.6cqi 0 0; font-size: max(12px, 2.4cqi); line-height: 1.4; max-width: 34ch; text-wrap: pretty; }
.sq .tc2 { margin: 0; font-size: max(11px, 2.05cqi); line-height: 1.4; max-width: 36ch; color: #6B5A44; text-wrap: pretty; }
.sq .src { font-size: max(10px, 1.8cqi); font-style: italic; color: #8A5A1E; }
.sq.story { width: min(58%, 330px); padding: 3cqi 3.4cqi 2.6cqi; gap: 0.6cqi; animation: pop 0.5s ease-out; }
.sq.story .big { font-size: 10cqi; }
.sq.story .nm { font-size: 4.4cqi; }
.sq.goal .tc2, .sq.goal .src { color: #E8DDB8; }
.sq .ft { font-size: max(11px, 2cqi); font-weight: 600; color: #8A5A1E; }
.sq .rays, .sq .sp, .sq .pt { position: absolute; z-index: 0; pointer-events: none; }
.sq .rays {
  left: 50%; top: 32%; width: 80cqi; aspect-ratio: 1; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(rgba(255, 190, 50, 0.38) 0 9deg, transparent 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 12%, transparent 62%); mask: radial-gradient(circle, #000 12%, transparent 62%);
  animation: spin 14s linear infinite;
}
.sq .sp { bottom: -6%; color: #E0A400; font-size: 2.6cqi; animation: rise 1.8s ease-out infinite; }
.sq .pt { top: -8%; font-family: var(--f-emoji); font-size: 2.6cqi; animation: fall 2.6s linear infinite; }
.sq.virtue { border-color: #2E7D4F; box-shadow: 0 0 0 0.6cqi rgba(80, 200, 120, 0.35), 0 0 6cqi rgba(255, 210, 90, 0.7), 0 1.6cqi 5cqi rgba(0, 0, 0, 0.45); }
.sq.virtue .eb, .sq.virtue .ft { color: #2E7D4F; }
.sq.vice { border-color: #B3261E; background: radial-gradient(circle at 50% 28%, #FFF1EA, #F3C9BE 62%, #C47E70); animation: shake 0.5s ease-in-out; }
.sq.vice .eb, .sq.vice .ft { color: #9E2A1C; }
.sq.vice .big { animation: throb 0.9s ease-in-out infinite; }
.sq.vice::after { content: ""; position: absolute; inset: 0; z-index: 0; background: radial-gradient(circle at 50% 110%, rgba(40, 10, 6, 0.45), transparent 60%); animation: smoke 2.4s ease-in-out infinite alternate; }
.sq.heaven { border-color: #D9A21E; background: radial-gradient(circle at 50% 28%, #FFFDF0, #FCE7A6 58%, #F2C14E); }
.sq.goal { border-color: #FFD86B; background: radial-gradient(circle at 50% 30%, #4A5CD0, #1E2A78 70%); color: #FFF3D6; }
.sq.goal .eb, .sq.goal .dv, .sq.goal .ft { color: #FFD86B; }
.sq.goal .big { font-family: var(--f-display); font-size: 16cqi; color: #FFD86B; text-shadow: 0 0 2cqi rgba(255, 215, 100, 0.9); animation: bloom 1.6s ease-out; }
.sq.decor { animation: pop 0.5s ease-out; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-34cqi); opacity: 0; } }
@keyframes fall { from { transform: translateY(0) rotate(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(44cqi) rotate(200deg); opacity: 0; } }
@keyframes shake { 15%, 55% { transform: translateX(-2.2%); } 35%, 75% { transform: translateX(2.2%); } }
@keyframes throb { 50% { transform: scale(1.12); filter: drop-shadow(0 0 1.4cqi rgba(200, 20, 10, 0.85)); } }
@keyframes smoke { to { opacity: 0.4; } }
@keyframes bloom { from { transform: scale(0.4); text-shadow: 0 0 8cqi rgba(255, 230, 140, 1); } }
@keyframes pop { 50% { transform: scale(1.04); } }

.win { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(17, 19, 42, 0.62); z-index: 5; }
.win > div { background: var(--surface); color: var(--ink); padding: 24px 28px; border-radius: 6px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 80%; }
.win h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); margin: 0; line-height: 1.1; text-wrap: balance; }
.win p { margin: 0; color: var(--muted); }

/* Side panel */
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--muted); }

.turn { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
.roll-row { display: flex; align-items: center; gap: 14px; }
.die {
  width: 72px; height: 72px; flex: none; border-radius: 12px;
  background: #FBF7EE; border: 2px solid #3B2812;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 9px; gap: 2px;
  box-shadow: 0 4px 0 #3B2812;
}
.die span { border-radius: 50%; background: transparent; margin: 3px; }
.die span.on { background: #7A1F12; }
.die.rolling { animation: tumble 0.56s ease-in-out; }
@keyframes tumble { 0% { transform: rotate(0); } 40% { transform: rotate(-25deg) translateY(-6px); } 70% { transform: rotate(15deg); } 100% { transform: rotate(0); } }
.roll-info { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); }

button {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 6px; padding: 10px 16px; border: 1px solid transparent;
  background: var(--accent); color: var(--on-accent);
}
button:disabled { opacity: 0.45; cursor: default; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.players li { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; }
.players li.current .pname { font-weight: 700; }
.players .pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.players .kind { font-size: 11px; color: var(--muted); margin-left: 4px; }
.players .stage { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; font-size: 13.5px; }
.log li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; }
.log li .dot { width: 9px; height: 9px; border-width: 1px; }
.log li.snake { color: #B03A26; }
.log li.ladder { color: #2E7D4F; }
.log li.heaven { color: #A0620A; }
:root[data-theme="dark"] .log li.snake { color: #FF8C75; }
:root[data-theme="dark"] .log li.ladder { color: #7FD9A3; }
:root[data-theme="dark"] .log li.heaven { color: #F2C55C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .log li.snake { color: #FF8C75; }
  :root:not([data-theme="light"]) .log li.ladder { color: #7FD9A3; }
  :root:not([data-theme="light"]) .log li.heaven { color: #F2C55C; }
}

details.card summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.card summary::after { content: "+"; color: var(--muted); }
details[open].card summary::after { content: "−"; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 6px 0; }
.seg button[aria-pressed="false"] { background: transparent; color: var(--ink); border-color: var(--line); }
.prow { display: grid; grid-template-columns: 14px 1fr 112px; gap: 8px; align-items: center; }
input[type="text"], select { font: inherit; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); width: 100%; min-width: 0; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
label.check input { margin-top: 4px; accent-color: var(--accent); }
label.pick { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; font-size: 14px; }
.setup-body { display: flex; flex-direction: column; gap: 12px; }

@media (prefers-reduced-motion: reduce) {
  .token, .token.slide { transition: none; }
  .token .body, .die.rolling, .lab.goal .om, .sq, .sq *, .sq::after, .toast { animation: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 data-t="title">Moksha Patam</h1>
    <div class="lang" role="group" aria-label="Language / भाषा">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
    </div>
    <p data-t="intro"></p>
  </header>

  <div class="game">
    <div class="board-col">
      <div class="board-frame">
        <div class="board-wrap" id="board">
          <div class="ashramas" id="ashramas" aria-hidden="true"></div>
          <div class="cells" id="cells"></div>

      "37": ["🙌", "Blessing", "आशीर्वाद", "Pleased with Aruni, his teacher blessed him: all the Vedas shone in his mind.", "आरुणि से प्रसन्न होकर गुरु ने आशीर्वाद दिया: सारे वेद उसके मन में प्रकाशित हो उठे।", "Mahabharata, Adi Parva"],
      "38": ["🎓", "Graduation", "समावर्तन", "Samavartana: the student's ritual bath and return home.", "समावर्तन: विद्यार्थी का स्नान और घर वापसी।", ""],
      "40": ["🕯️", "Parting words", "दीक्षांत उपदेश", "'Never neglect study and teaching,' the teacher tells the departing student.", "'स्वाध्याय और प्रवचन में कभी प्रमाद न करना,' गुरु जाते हुए शिष्य से कहते हैं।", "Taittiriya Upanishad 1.11"],
      "41": ["💍", "Marriage", "विवाह", "Seven steps around the fire: companions for life on the path of dharma.", "अग्नि के चारों ओर सात फेरे: धर्म के मार्ग पर जीवन भर के साथी।", ""],
      "42": ["🏡", "Home", "गृह", "The householder's home feeds and supports all the other ashramas.", "गृहस्थ का घर बाकी सभी आश्रमों का पालन करता है।", "Manusmriti 3.77–78"],
      "43": ["🏹", "The bowstring", "धनुष की डोरी", "To save the meat for later, the jackal gnawed the bowstring first. The bow sprang and killed him.", "मांस बचाने के लिए सियार ने पहले धनुष की डोरी चबाई। धनुष उछला और वह मर गया।", "Panchatantra"],
      "45": ["🐄", "A thousand cows", "हज़ार गायें", "Satyakama returned with a thousand cows, his face shining like one who knows Brahman.", "सत्यकाम हज़ार गायें लेकर लौटा, उसका मुख ब्रह्मज्ञानी की तरह चमक रहा था।", "Chandogya Upanishad 4.9"],
      "46": ["⚔️", "Kurukshetra", "कुरुक्षेत्र", "A father's blind love ended in a war that destroyed the family.", "पिता के अंधे मोह का अंत उस युद्ध में हुआ जिसने कुल का नाश कर दिया।", "Mahabharata"],
      "48": ["🍛", "Food is sacred", "अन्नं ब्रह्म", "Do not despise food; make food plentiful. Food is Brahman.", "अन्न का निरादर न करो; अन्न बढ़ाओ। अन्न ब्रह्म है।", "Taittiriya Upanishad 3.7–9"],
      "49": ["🌾", "Five offerings", "पंच महायज्ञ", "Each day the householder honours the gods, the sages, the ancestors, guests and all creatures.", "गृहस्थ प्रतिदिन देवताओं, ऋषियों, पितरों, अतिथियों और सभी प्राणियों का ऋण चुकाता है।", "Manusmriti 3.70"],
      "50": ["💔", "Too late", "पछतावा", "Then she found the dead cobra: the mongoose had saved her child. Anger acts first and weeps later.", "फिर उसने मरा हुआ साँप देखा: नेवले ने बच्चे को बचाया था। क्रोध पहले करता है, बाद में पछताता है।", "Panchatantra"],
      "52": ["🎲", "The dice game", "द्यूत क्रीड़ा", "Envy led Duryodhana to the rigged game of dice, and from there to ruin.", "ईर्ष्या दुर्योधन को कपट के जुए तक ले गई, और वहाँ से विनाश तक।", "Mahabharata, Sabha Parva"],
      "53": ["🔆", "Yama teaches", "यम का उपदेश", "Moved by his resolve, Yama taught Nachiketa the secret of the deathless Self.", "उसके दृढ़ निश्चय से प्रसन्न होकर यम ने नचिकेता को अमर आत्मा का रहस्य बताया।", "Katha Upanishad 1.2"],
      "54": ["🛞", "Raikva", "रैक्व", "Raikva, the humble man sitting under his cart, knew more than the king.", "अपनी गाड़ी के नीचे बैठे साधारण रैक्व राजा से अधिक जानते थे।", "Chandogya Upanishad 4.1"],
      "56": ["🍽️", "The guest", "अतिथि", "Atithi devo bhava: honour the guest as a god.", "अतिथि देवो भव: अतिथि को देवता मानो।", "Taittiriya Upanishad 1.11"],
      "58": ["🌿", "A blade of grass", "तिनका", "Agni could not burn a blade of grass, nor Vayu blow it away. All power is Brahman's.", "अग्नि एक तिनका न जला सके, न वायु उसे उड़ा सके। सारी शक्ति ब्रह्म की है।", "Kena Upanishad 3"],
      "60": ["🧓", "Grey hair", "श्वेत केश", "When the householder sees grey hair and grandchildren, it is time for the forest.", "जब गृहस्थ के केश सफ़ेद हों और पोते-पोतियाँ दिखें, तब वन जाने का समय है।", "Manusmriti 6.2"],
      "61": ["🔁", "Begin again", "फिर से आरंभ", "Indra was not satisfied with that answer. He came back to learn, again and again, for 101 years.", "इंद्र उस उत्तर से संतुष्ट न हुए। वे बार-बार सीखने लौटे, कुल १०१ वर्ष।", "Chandogya Upanishad 8.11"],
      "63": ["🎁", "Enjoy by letting go", "त्यागपूर्वक भोग", "All this is pervaded by the Lord: enjoy it by letting go, and covet no one's wealth.", "यह सब ईश्वर से व्याप्त है: त्यागपूर्वक भोगो, किसी के धन का लोभ न करो।", "Isha Upanishad 1"],
      "64": ["🐾", "Born a deer", "हिरण का जन्म", "Thinking of the fawn at the moment of death, Bharata was reborn as a deer.", "मृत्यु के समय शावक का ध्यान करते रहने से भरत हिरण बनकर जन्मे।", "Bhagavata Purana 5.8"],
      "66": ["🌲", "To the forest", "वन की ओर", "Handing the home to the next generation, the householder turns toward the forest.", "घर अगली पीढ़ी को सौंपकर गृहस्थ वन की ओर चल पड़ता है।", ""],
      "67": ["🫂", "No hatred", "द्वेष नहीं", "One who sees all beings in the Self, and the Self in all beings, hates no one.", "जो सब प्राणियों को आत्मा में और आत्मा को सब में देखता है, वह किसी से घृणा नहीं करता।", "Isha Upanishad 6"],
      "68": ["📚", "Only words", "केवल शब्द", "Narada had mastered every scripture, yet came grieving: 'I know only words, not the Self.'", "नारद सब शास्त्र जानते थे, फिर भी दुखी होकर बोले: 'मैं केवल शब्द जानता हूँ, आत्मा नहीं।'", "Chandogya Upanishad 7.1"],
      "70": ["🪆", "Five sheaths", "पंचकोश", "The Self is wrapped in five sheaths: food, breath, mind, intellect and bliss.", "आत्मा पाँच कोशों में ढकी है: अन्न, प्राण, मन, विज्ञान और आनंद।", "Taittiriya Upanishad 2"],
      "71": ["🐈", "Unmasked", "ढोंग उजागर", "The cat's prayers were only a trap. True austerity needs no audience.", "बिल्ली की प्रार्थना केवल एक जाल थी। सच्चे तप को दर्शकों की ज़रूरत नहीं।", "Panchatantra"],
      "73": ["🌬️", "Breath", "प्राण", "The senses argued over which was greatest; when breath began to leave, all of them failed.", "इंद्रियों में श्रेष्ठता का विवाद हुआ; जब प्राण जाने लगे तो सब शिथिल हो गईं।", "Chandogya Upanishad 5.1"],
      "74": ["🛕", "Temple of the heart", "हृदय मंदिर", "In the city of the body is a small lotus-house; within it is a space as vast as the universe.", "शरीर रूपी नगर में एक छोटा कमल-गृह है; उसके भीतर ब्रह्मांड जितना विशाल आकाश है।", "Chandogya Upanishad 8.1"],
      "75": ["👑", "Nothing of mine burns", "मेरा कुछ नहीं जलता", "When Mithila was on fire, Janaka said: nothing that is truly mine is burning.", "मिथिला जल रही थी, तब जनक बोले: जो सचमुच मेरा है, उसमें से कुछ नहीं जल रहा।", "Mahabharata, Shanti Parva"],
      "76": ["🌅", "Sandhya", "संध्या", "Dawn, noon and dusk: the forest-dweller's day turns around prayer.", "प्रातः, मध्याह्न और संध्या: वानप्रस्थी का दिन उपासना के चारों ओर घूमता है।", ""],
      "78": ["💞", "For the Self", "आत्मा के लिए", "'It is not for the husband's sake that a husband is dear, but for the sake of the Self.'", "'पति, पति के लिए प्रिय नहीं होता, आत्मा के लिए प्रिय होता है।'", "Brihadaranyaka Upanishad 2.4.5"],
      "79": ["🎯", "Bow and arrow", "धनुष-बाण", "Om is the bow, the self is the arrow, and Brahman is the target.", "प्रणव धनुष है, आत्मा बाण है और ब्रह्म लक्ष्य है।", "Mundaka Upanishad 2.2.4"],
      "80": ["🧡", "Saffron robe", "भगवा वस्त्र", "Taking sannyasa: the last fire, the saffron robe, a new name.", "संन्यास दीक्षा: अंतिम अग्नि, भगवा वस्त्र, नया नाम।", ""],
      "81": ["🍃", "Neti neti", "नेति नेति", "Not this, not this: the Self is beyond every description.", "यह नहीं, यह नहीं: आत्मा हर वर्णन से परे है।", "Brihadaranyaka Upanishad 2.3.6"],
      "82": ["🌙", "Four states", "चार अवस्थाएँ", "Waking, dreaming, deep sleep, and the fourth, Turiya, beyond them all.", "जाग्रत, स्वप्न, सुषुप्ति, और इन सबसे परे चौथी, तुरीय।", "Mandukya Upanishad 3–7"],
      "83": ["🌌", "Immortality", "अमृतत्व", "Yajnavalkya taught Maitreyi the way to immortality, then left for the forest.", "याज्ञवल्क्य ने मैत्रेयी को अमृतत्व का मार्ग बताया और वन चले गए।", "Brihadaranyaka Upanishad 4.5"],
      "84": ["🥣", "Alms", "भिक्षा", "The renunciate asks only for today's food and keeps nothing more.", "संन्यासी केवल आज का भोजन माँगता है, और कुछ नहीं रखता।", ""],
      "86": ["❔", "By whom?", "केन?", "By whom is the mind sent forth? By whom does the eye see?", "किसके द्वारा मन प्रेरित होता है? किससे आँख देखती है?", "Kena Upanishad 1.1"],
      "87": ["🌞", "The golden lid", "स्वर्ण पात्र", "The face of truth is covered by a golden disc. Uncover it, O Pushan, so I may see.", "सत्य का मुख सोने के पात्र से ढका है। हे पूषन्, उसे हटाओ ताकि मैं देख सकूँ।", "Isha Upanishad 15"],
      "89": ["🌕", "Bliss", "आनंद", "At last Bhrigu knew: Brahman is bliss. From bliss all beings are born.", "अंत में भृगु ने जाना: ब्रह्म आनंद है। आनंद से ही सब प्राणी जन्मते हैं।", "Taittiriya Upanishad 3.6"],
      "90": ["🪔", "Lead me to light", "तमसो मा ज्योतिर्गमय", "Lead me from the unreal to the real, from darkness to light, from death to immortality.", "असत् से सत् की ओर, तम से ज्योति की ओर, मृत्यु से अमृत की ओर ले चलो।", "Brihadaranyaka Upanishad 1.3.28"],
      "91": ["🧠", "Prajnanam Brahma", "प्रज्ञानं ब्रह्म", "Consciousness is Brahman.", "चेतना ही ब्रह्म है।", "Aitareya Upanishad 3.3"],
      "92": ["💫", "Aham Brahmasmi", "अहं ब्रह्मास्मि", "I am Brahman.", "मैं ब्रह्म हूँ।", "Brihadaranyaka Upanishad 1.4.10"],
      "94": ["🐦", "The watching bird", "साक्षी पक्षी", "When the bird that eats sees the other, the witness, as its own glory, its grief ends.", "जब फल खाने वाला पक्षी दूसरे, साक्षी पक्षी को अपनी ही महिमा जानता है, तो उसका शोक मिट जाता है।", "Mundaka Upanishad 3.1.2"],
      "95": ["🌀", "Ayam Atma Brahma", "अयमात्मा ब्रह्म", "This Self is Brahman.", "यह आत्मा ब्रह्म है।", "Mandukya Upanishad 2"],
      "96": ["🌍", "All is Brahman", "सर्वं खल्विदं ब्रह्म", "All this, truly, is Brahman.", "यह सब कुछ निश्चय ही ब्रह्म है।", "Chandogya Upanishad 3.14.1"],
      "97": ["⭕", "Wholeness", "पूर्णता", "That is whole, this is whole. Take the whole from the whole, and the whole remains.", "वह पूर्ण है, यह पूर्ण है। पूर्ण से पूर्ण निकालने पर भी पूर्ण ही शेष रहता है।", "Isha Upanishad, invocation"],
      "98": ["🕊️", "Shanti", "शांति", "Om shanti, shanti, shanti: peace within, peace around, peace above.", "ॐ शांति, शांति, शांति: भीतर शांति, आसपास शांति, ऊपर शांति।", ""],
      "100": ["🌄", "The threshold", "देहरी", "At the edge of the world. The realms of the gods begin above.", "संसार की सीमा पर। ऊपर देवलोक आरंभ होते हैं।", ""]
    },
    HEAVEN: {
      "101": { en: "Indra", hi: "इन्द्र", ic: "⚡", story: ["Svarga, Indra's heaven: the reward of good deeds, yet not the final goal.", "स्वर्ग, इंद्र का लोक: पुण्य का फल, पर अंतिम लक्ष्य नहीं।"] },
      "102": { en: "Agni", hi: "अग्नि", ic: "🔥", story: ["Agni carries every offering to the gods.", "अग्नि हर आहुति देवताओं तक पहुँचाते हैं।"] },
      "103": { en: "Surya", hi: "सूर्य", ic: "☀️", story: ["Surya, the visible god, witness of all actions.", "सूर्य, प्रत्यक्ष देवता, सब कर्मों के साक्षी।"] },
      "104": { en: "Ganesha", hi: "गणेश", ic: "🐘", story: ["Ganesha removes the last obstacles.", "गणेश अंतिम विघ्न दूर करते हैं।"] },
      "105": { en: "Lakshmi", hi: "लक्ष्मी", ic: "🪷", story: ["Grace that blooms like the lotus, untouched by the mud.", "कमल की तरह खिलती कृपा, कीचड़ से अछूती।"] },
      "106": { en: "Saraswati", hi: "सरस्वती", ic: "🦢", story: ["Her swan is said to separate milk from water: true knowledge from false.", "कहते हैं उनका हंस दूध और पानी को अलग कर देता है: सच्चे ज्ञान को झूठे से।"] },
      "107": { en: "Brahma", hi: "ब्रह्मा", ic: "📜", story: ["Brahma, the creator, from whom the Vedas flow.", "सृष्टिकर्ता ब्रह्मा, जिनसे वेद प्रकट हुए।"] },
      "108": { en: "Vishnu", hi: "विष्णु", ic: "🐚", story: ["Vishnu, the preserver, who upholds dharma in every age.", "पालनकर्ता विष्णु, जो हर युग में धर्म की रक्षा करते हैं।"] },
      "109": { en: "Shiva", hi: "शिव", ic: "🔱", story: ["Shiva, the auspicious one, who dissolves all that binds.", "कल्याणकारी शिव, जो हर बंधन को मिटाते हैं।"] }
    }
  };

    if (S) fxClear();
    G.busy = false;
    G.state = newState(nextSeed ?? freshSeed());
    nextSeed = null;
    buildTokens();
    render();
    queueCpu();
  }
  $("newGame").addEventListener("click", () => {
    readSetup();
    startGame();
  });
  $("again").addEventListener("click", startGame);
  $("roll").addEventListener("click", takeTurn);
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.target.closest("input, select, button, textarea, summary")) return;
    e.preventDefault();
    if (G.cardClose) return G.cardClose();
    if (cur().type === "human") takeTurn();
  });
  new ResizeObserver(draw).observe($("cells"));
  if (new URLSearchParams(location.search).has("debug")) {
    window.mp = {
      jump(n) {
        cur().pos = n;
        render();
      },
      roll(v) {
        G.forcedRoll = v;
        return takeTurn();
      },
      seed(n) {
        if (n == null) return G.state.rng.seed;
        nextSeed = n >>> 0;
        startGame();
        return G.state.rng.seed;
      },
      get state() {
        return G.state;
      },
      sprite: spriteURL,
      data: { LADDERS, SNAKES, SQ, HEAVEN, STR },
      setLang
    };
  }
  function start(data) {
    G.setup = data?.setup || defaultSetup();
    if (data?.setup?.lang && !urlLang) setLangValue(data.setup.lang);
    applyStatic();
    buildCells();
    renderSetup();
    if (data?.state) {
      G.state = data.state;
      G.state.rng ||= makeRng(freshSeed());
      G.busy = false;
      buildTokens();
      render();
      queueCpu();
    } else startGame();
    draw();
  }
  window.claude?.hot?.snapshot?.(() => ({ setup: { ...G.setup, lang }, state: G.state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
