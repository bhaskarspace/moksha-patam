      "6": { to: 15, ic: "🤝", en: "Friendship", hi: "मित्रता", skt: "Maitri", age: 3, moment: { en: "{name} is {age} and has found a friend. They share a biscuit by breaking it badly, and both halves get eaten anyway.", hi: "{name} {age} बरस {का|की} है। {एक दोस्त मिल गया|एक {friend:दोस्त मिल गया|सहेली मिल गई}} है। दोनों एक बिस्कुट टेढ़ा-मेढ़ा तोड़कर बाँटते हैं, और दोनों टुकड़े खा लिए जाते हैं।", mirror: { en: "A crow, a mouse, a tortoise and a deer once managed the same thing, and became true friends.", hi: "कौआ, चूहा, कछुआ और हिरण भी ऐसे ही सच्चे मित्र बने थे।" }, cast: "friend", recall: { en: "who once broke a biscuit badly with {name}", hi: "जिसके साथ {name} ने कभी एक बिस्कुट टेढ़ा-मेढ़ा तोड़कर बाँटा था" } }, mirror: { en: "A crow, a mouse, a tortoise and a deer became true friends.", hi: "कौआ, चूहा, कछुआ और हिरण सच्चे मित्र बने।" }, src: "Panchatantra", guna: "s", aims: { dharma: 5, kama: 5 } },
      "12": { to: 24, ic: "🐇", en: "Wit", hi: "बुद्धि", skt: "Buddhi", age: 7, moment: { en: "{name} is {age}, cornered by a bigger child who wants the lunch, and says a teacher is coming. No teacher is coming. It works.", hi: "{name} {age} बरस {का|की} है। एक बड़ा बच्चा टिफ़िन छीनने को घेरे खड़ा है, और {name} ने कह दिया कि मास्टरजी आ रहे हैं। कोई नहीं आ रहा। फिर भी काम बन गया।", mirror: { en: "A hare sent to be a lion's dinner tried the same move, and arrived late on purpose.", hi: "शेर का भोजन बनने भेजे गए खरगोश ने भी यही चाल चली, और जान-बूझकर देर से पहुँचा।" } }, mirror: { en: "A little hare, sent to be the lion's meal, arrived late with a plan.", hi: "शेर का भोजन बनने भेजा गया छोटा खरगोश एक योजना लेकर देर से पहुँचा।" }, src: "Panchatantra", guna: "s", aims: { artha: 5 } },
      "23": { to: 37, ic: "🌾", en: "Devotion", hi: "गुरु-भक्ति", skt: "Guru-bhakti", age: 13, moment: { en: "{name} is {age}. {teacher=The teacher} said to keep the rain off the books, and an hour later {name} is still bent over them, arms out, soaked. {teacher=The teacher} had forgotten asking.", hi: "{name} {age} बरस {का|की} है। {teacher=गुरुजी} ने कहा था कि किताबों को बारिश से बचाना, और घंटे भर बाद भी {name} उन पर बाँहें फैलाए {झुका है, पूरा भीगा हुआ|झुकी है, पूरी भीगी हुई}। {teacher=गुरुजी} कहकर {teacher:भूल चुके थे|भूल चुकी थीं}।", mirror: { en: "Aruni did it with his whole body. Told to stop water breaking through a field, he lay down in the breach himself.", hi: "आरुणि ने यही अपने पूरे शरीर से किया था। खेत की मेड़ से बहता पानी रोकने को कहा गया, तो वे स्वयं मेड़ में लेट गए।" }, cast: "teacher", recall: { en: "who once had {name} keep the rain off the books for an hour", hi: "जिनके कहने पर {name} ने घंटे भर किताबों को बारिश से बचाया था" } }, mirror: { en: "Told to stop water breaking through the field, Aruni lay down in the breach himself.", hi: "खेत की मेड़ से बहता पानी रोकने के लिए आरुणि स्वयं मेड़ में लेट गए।" }, src: "Mahabharata, Adi Parva", guna: "s", aims: { dharma: 10 } },
      "28": { to: 45, ic: "🗣️", en: "Truth", hi: "सत्य", skt: "Satya", age: 16, moment: { en: "{name} is {age} and is asked, in front of everyone, whether the homework was done. It was not. {name} says so.", hi: "{name} {age} बरस {का|की} है। सबके सामने पूछा जाता है कि गृहकार्य हुआ या नहीं। नहीं हुआ था। {name} ने वही कह दिया।", mirror: { en: "Satyakama had a harder question to answer the same way. Asked his lineage, he said he did not know who his father was.", hi: "सत्यकाम को इससे कठिन प्रश्न का उत्तर ऐसे ही देना पड़ा था। गोत्र पूछा गया, तो उसने कहा कि उसे नहीं पता उसके पिता कौन हैं।" } }, mirror: { en: "Asked his lineage, Satyakama told the plain truth: he did not know who his father was.", hi: "गोत्र पूछे जाने पर सत्यकाम ने सीधा सच कहा: उसे नहीं पता उसके पिता कौन हैं।" }, src: "Chandogya Upanishad 4.4", guna: "s", aims: { dharma: 10 } },
      "34": { to: 53, ic: "🚪", en: "Resolve", hi: "श्रद्धा", skt: "Shraddha", age: 19, moment: { en: "{name} is {age} and waits three days outside an office for an answer, and on the third day is let in.", hi: "{name} {age} बरस {का|की} है। एक जवाब के लिए तीन दिन एक दफ़्तर के बाहर बैठे रहना पड़ता है, और तीसरे दिन भीतर बुलाया जाता है।", mirror: { en: "Nachiketa was about the same age, and waited three days at Death's door without food or water.", hi: "नचिकेता की उम्र भी लगभग यही थी, जब वह तीन दिन बिना अन्न-जल के यमराज के द्वार पर प्रतीक्षा करता रहा।" } }, mirror: { en: "Nachiketa waited three days at Death's door without food or water.", hi: "नचिकेता तीन दिन बिना अन्न-जल के यमराज के द्वार पर प्रतीक्षा करता रहा।" }, src: "Katha Upanishad 1.1", guna: "s", aims: { dharma: 5, artha: 5 } },
      "44": { to: 63, ic: "🤲", en: "Giving", hi: "दान", skt: "Dana", age: 29, moment: { en: "{name} is {age}, has two blankets for the winter, and gives the better one away.", hi: "{name} {age} बरस {का|की} है। सर्दियों के लिए दो कंबल हैं, और {name} ने अच्छा वाला दे दिया।" }, mirror: { en: "Prajāpati answered his three kinds of children with one syllable, 'da'. The humans heard datta: give.", hi: "प्रजापति ने अपनी तीन प्रकार की संतानों को एक ही अक्षर से उत्तर दिया, 'द'। मनुष्यों ने सुना दत्त: दान करो।" }, src: "Brihadaranyaka Upanishad 5.2", guna: "s", aims: { dharma: 10, artha: -10 } },
      "51": { to: 67, ic: "💗", en: "Compassion", hi: "दया", skt: "Daya", age: 37, moment: { en: "{name} is {age} and sits up all night with a neighbour's sick child, so that the neighbour can sleep.", hi: "{name} {age} बरस {का|की} है। पड़ोसी सो सके, इसलिए {name} रात भर उसके बीमार बच्चे के पास {जागता रहा|जागती रही}।" }, mirror: { en: "The asuras heard Prajāpati's same 'da' and understood dayadhvam: be compassionate. The cruel heard the one thing they lacked.", hi: "असुरों ने प्रजापति का वही 'द' सुना और समझा दयध्वम्: दया करो। क्रूरों ने वही सुना जो उनमें नहीं था।" }, src: "Brihadaranyaka Upanishad 5.2", guna: "s", aims: { dharma: 10 } },
      "57": { to: 75, ic: "⚖️", en: "Duty", hi: "धर्म", skt: "Dharma", age: 45, moment: { en: "{name} is {age} and settles a quarrel between two cousins, and rules against the one {name} likes better.", hi: "{name} {age} बरस {का|की} है। दो चचेरे भाइयों के झगड़े में फ़ैसला करना पड़ा, और {name} ने उसी के ख़िलाफ़ फ़ैसला दिया जो ज़्यादा प्यारा है।", mirror: { en: "Janaka had a whole kingdom to judge like that, and was counted among the sages for it.", hi: "जनक को पूरे राज्य का न्याय ऐसे ही करना था, और इसी से उनकी गिनती ऋषियों में हुई।" } }, mirror: { en: "King Janaka ruled justly and was counted among the wisest of sages.", hi: "राजा जनक न्याय से राज करते थे और श्रेष्ठ ज्ञानियों में गिने जाते थे।" }, src: "Brihadaranyaka Upanishad 4", guna: "s", aims: { dharma: 10 } },
      "65": { to: 83, ic: "🍂", en: "Detachment", hi: "वैराग्य", skt: "Vairagya", age: 54, moment: { en: "{name} is {age}. {spouse=The one {name} married} talks of dividing up everything they have, and {name} asks what any of it is for.", hi: "{name} {age} बरस {का|की} है। {spouse=जीवनसाथी} जो कुछ है उसके बँटवारे की बात {spouse:करता|करती} है, और {name} ने पूछा कि आख़िर यह सब किसलिए है।", mirror: { en: "Maitreyi asked the same, when she was offered half her husband's wealth: 'Will it make me immortal?'", hi: "मैत्रेयी ने भी यही पूछा था, जब उसे पति की आधी संपत्ति दी जा रही थी: 'क्या इससे मैं अमर हो जाऊँगी?'" }, cast: "spouse", recall: { en: "who once talked of dividing up everything they had", hi: "जिसने कभी सब कुछ बाँट लेने की बात की थी" } }, mirror: { en: "Offered half her husband's wealth, Maitreyi asked: 'Will it make me immortal?'", hi: "पति की आधी संपत्ति मिलने पर मैत्रेयी ने पूछा: 'क्या इससे मैं अमर हो जाऊँगी?'" }, src: "Brihadaranyaka Upanishad 2.4", guna: "s", aims: { artha: -10, kama: -10 } },
      "72": { to: 89, ic: "🧘", en: "Austerity", hi: "तप", skt: "Tapas", age: 60, moment: { en: "{name} is {age} and gives up sugar, then talking after dark, then the second meal, one at a time, to see what is left.", hi: "{name} {age} बरस {का|की} है। पहले चीनी छोड़ी, फिर साँझ के बाद बोलना, फिर दूसरा भोजन, एक-एक करके, यह देखने को कि पीछे क्या बचता है।", mirror: { en: "Bhrigu was sent off the same way. He asked his father Varuna what Brahman is, and was told: find out by tapas.", hi: "भृगु को भी ऐसे ही भेजा गया था। उसने अपने पिता वरुण से पूछा कि ब्रह्म क्या है, और उत्तर मिला: तप से जानो।" } }, mirror: { en: "Bhrigu asked his father Varuna, 'What is Brahman?' and was told: seek it through tapas.", hi: "भृगु ने पिता वरुण से पूछा, 'ब्रह्म क्या है?' उत्तर मिला: तप से जानो।" }, src: "Taittiriya Upanishad 3.1", guna: "s", aims: { dharma: 5, kama: -10 } },
      "85": { to: 94, ic: "🌳", en: "Discernment", hi: "विवेक", skt: "Viveka", age: 73, moment: { en: "{name} is {age} and sits on the step watching {his|her|their} own hands peel an orange, as if they belonged to someone else.", hi: "{name} {age} बरस {का|की} है। {name} ने सीढ़ी पर बैठकर अपने ही हाथों को संतरा छीलते देखा, जैसे वे किसी और के हों।" }, mirror: { en: "The Muṇḍaka's two birds sit on one tree: one eats the fruit, the other only watches. Sāṃkhya, Advaita and Madhva all claim the verse, and each counts the birds differently.", hi: "मुंडक के दो पक्षी एक ही वृक्ष पर बैठे हैं: एक फल खाता है, दूसरा केवल देखता है। सांख्य, अद्वैत और मध्व तीनों इस मंत्र पर दावा करते हैं, और हर एक पक्षियों को अलग गिनता है।" }, src: "Mundaka Upanishad 3.1.1", guna: "s", aims: { dharma: 5 } }
    },
    SNAKES: {
      "14": { to: 8, ic: "🐢", en: "Chatter", hi: "बकबक", skt: "Vachalata", age: 8, moment: { en: "{name} is {age} and has been told a secret, and holds it all through lunch, and tells it in the afternoon.", hi: "{name} {age} बरस {का|की} है। किसी ने एक राज़ बताया था। दोपहर के खाने तक उसे सँभाले रखा, और शाम होते-होते बता दिया।", mirror: { en: "The tortoise had a stick in its mouth and the whole sky beneath it, and still opened its mouth to talk.", hi: "कछुए के मुँह में डंडी थी और नीचे पूरा आकाश, फिर भी उसने बोलने को मुँह खोल दिया।" } }, mirror: { en: "Geese flew the tortoise across the sky on a stick. It opened its mouth to talk.", hi: "हंस कछुए को डंडी पर आकाश में ले उड़े। उसने बोलने के लिए मुँह खोला।" }, src: "Panchatantra", guna: "r", aims: { dharma: -5 }, holding: { en: "still telling what was told in confidence", hi: "अब भी वह कहते हुए जो भरोसे में कहा गया था" }, letgo: { en: "what was told in confidence", hi: "भरोसे में कही बात कह देने की आदत" }, forgot: { en: "a secret makes {name}'s mouth go dry", hi: "कोई राज़ सुनते ही {name} का मुँह सूख जाता है" } },
      "19": { to: 11, ic: "🐺", en: "Fibbing", hi: "झूठ", skt: "Asatya", age: 10, moment: { en: "{name} is {age} and tells the class about a holiday by the sea that never happened, and adds a boat.", hi: "{name} {age} बरस {का|की} है। {name} ने पूरी कक्षा को समुद्र किनारे की एक छुट्टी का क़िस्सा सुनाया जो कभी हुई ही नहीं, और उसमें एक नाव भी जोड़ दी।", mirror: { en: "A jackal who fell into a vat of blue dye told the whole forest he was its king.", hi: "रंग की हौदी में गिरकर नीले हुए एक सियार ने पूरे जंगल से कह दिया कि वही उनका राजा है।" } }, mirror: { en: "A jackal fell into a vat of dye, turned blue and claimed to be king of the forest.", hi: "रंग की हौदी में गिरकर नीला हुआ सियार खुद को जंगल का राजा बताने लगा।" }, src: "Panchatantra", guna: "r", aims: { dharma: -10 }, holding: { en: "still adding a boat to the story", hi: "अब भी कहानी में एक नाव जोड़ते हुए" }, letgo: { en: "the boat added to the story", hi: "कहानी में जोड़ी गई नाव" }, forgot: { en: "{name} cannot hear a holiday story without checking it", hi: "छुट्टियों का कोई किस्सा सुनते ही {name} मन ही मन उसकी जाँच करने {लगता|लगती} है" } },
      "29": { to: 17, ic: "💤", en: "Laziness", hi: "आलस्य", skt: "Alasya", age: 17, moment: { en: "{name} is {age}, the exam is in a week, and the books have not moved from where they were put down in March.", hi: "{name} {age} बरस {का|की} है। परीक्षा एक हफ़्ते में है, और किताबें मार्च में जहाँ रखी थीं वहीं पड़ी हैं।" }, mirror: { en: "'Idleness is the great enemy living in your own body,' runs the verse every schoolboy copies out. Patañjali files it fifth among nine obstacles, right after doubt, as if it were a symptom rather than a sin.", hi: "'आलस्य शरीर में रहने वाला सबसे बड़ा शत्रु है,' वह श्लोक कहता है जिसे हर विद्यार्थी उतारता है। पतंजलि इसे नौ विघ्नों में पाँचवाँ गिनते हैं, संशय के ठीक बाद, मानो यह पाप नहीं, एक लक्षण हो।" }, src: "Subhashita", guna: "t", aims: { artha: -5 }, holding: { en: "still meaning to start tomorrow", hi: "अब भी कल से शुरू करने की सोचते हुए" }, letgo: { en: "tomorrow", hi: "कल से शुरू करने की सोच" }, forgot: { en: "the word tomorrow makes {name} uneasy", hi: "'कल' शब्द से {name} बेचैन हो {जाता|जाती} है" } },
      "39": { to: 22, ic: "🦴", en: "Pride of learning", hi: "विद्या-मद", skt: "Vidya-mada", age: 24, moment: { en: "{name} is {age}, has read more than anyone at the table, and explains the bridge to the person who built it.", hi: "{name} {age} बरस {का|की} है। मेज़ पर किसी ने उतना नहीं पढ़ा जितना {name} ने, और {name} ने पुल बनाने वाले को ही पुल समझा दिया।" }, mirror: { en: "Three learned brothers rebuilt a lion from its bones. The fourth, who had only common sense, climbed a tree.", hi: "तीन विद्वान भाइयों ने हड्डियों से शेर बना दिया। चौथा, जिसमें बस समझ थी, पेड़ पर चढ़ गया।" }, src: "Panchatantra", guna: "r", aims: { dharma: -5 }, holding: { en: "still explaining the bridge to the one who built it", hi: "अब भी पुल बनाने वाले को पुल समझाते हुए" }, letgo: { en: "explaining the bridge to the one who built it", hi: "पुल बनाने वाले को पुल समझाने की आदत" }, forgot: { en: "{name} goes quiet near bridges", hi: "पुलों के पास {name} चुप हो {जाता|जाती} है" } },
      "47": { to: 31, ic: "💘", en: "Craving", hi: "काम", skt: "Kama", age: 32, moment: { en: "{name} is {age} and buys the thing at last, and within a week is looking at the better one.", hi: "{name} {age} बरस {का|की} है। {name} ने आख़िर वह चीज़ ख़रीद ली, और हफ़्ते भर में नज़र उससे बेहतर वाली पर है।", mirror: { en: "Yayati borrowed his son's youth for a thousand years for the same reason, and at the end of it wanted more.", hi: "ययाति ने इसी कारण अपने बेटे की जवानी हज़ार बरस के लिए उधार ली थी, और अंत में भी और चाहते रहे।" } }, mirror: { en: "Yayati borrowed his son's youth for a thousand years and found his desire still unquenched.", hi: "ययाति ने पुत्र का यौवन लेकर हज़ार वर्ष भोग किया, फिर भी इच्छा नहीं बुझी।" }, src: "Mahabharata, Adi Parva", guna: "r", aims: { kama: 10, artha: -5 }, holding: { en: "still looking at the better one", hi: "अब भी उससे अच्छी चीज़ की ओर देखते हुए" }, letgo: { en: "the better one", hi: "उससे अच्छी चीज़ की चाह" }, forgot: { en: "{name} never looks twice into a shop window", hi: "{name} किसी दुकान की खिड़की में दोबारा नहीं {झाँकता|झाँकती}" } },
      "55": { to: 43, ic: "💰", en: "Greed", hi: "लोभ", skt: "Lobha", age: 42, moment: { en: "{name} is {age}. The shopkeeper gives back too much change by mistake. {name} pockets it quietly, and all the way home works out where else this might happen.", hi: "{name} {age} बरस {का|की} है। दुकानदार ने ग़लती से ज़्यादा पैसे लौटा दिए। {name} ने चुपचाप रख लिए, और रास्ते भर हिसाब लगाया कि ऐसा और कहाँ हो सकता है।", mirror: { en: "The jackal who found a hunter and a boar both dead made the same kind of plan: make it last for days.", hi: "शिकारी और सूअर दोनों को मरा पाकर सियार ने भी ऐसी ही योजना बनाई: दावत कई दिन चले।" } }, mirror: { en: "Finding a hunter and a boar both dead, the jackal planned to make the feast last for days.", hi: "शिकारी और सूअर को मरा देख सियार ने सोचा कि दावत कई दिन चलेगी।" }, src: "Panchatantra", guna: "r", aims: { artha: 10, dharma: -10 }, holding: { en: "still counting the change", hi: "अब भी छुट्टे गिनते हुए" }, letgo: { en: "counting the change", hi: "छुट्टे गिनने की आदत" }, forgot: { en: "loose coins make {name} uneasy", hi: "खुले सिक्के देखकर {name} बेचैन हो {जाता|जाती} है" } },
      "59": { to: 50, ic: "🌋", en: "Anger", hi: "क्रोध", skt: "Krodha", age: 48, moment: { en: "{name} is {age}. {child={name}'s daughter} breaks something precious and {name} hits her before knowing the hand has moved. She does not cry, which is worse.", hi: "{name} {age} बरस {का|की} है। {child=बेटी} ने {name} की कोई प्यारी चीज़ तोड़ दी, और हाथ कब उठा, यह जानने से पहले ही {name} ने उसे मार दिया। वह रोई नहीं। यह और बुरा है।", mirror: { en: "The brahmin's wife saw blood on the mongoose's mouth and struck once, before looking in the cradle.", hi: "ब्राह्मणी ने नेवले के मुँह पर खून देखा और पालने में झाँकने से पहले ही एक वार कर दिया।" }, cast: "daughter", recall: { en: "whom {name} once struck before knowing the hand had moved", hi: "जिस पर कभी {name} का हाथ, जाने बिना, उठ गया था" } }, mirror: { en: "Seeing blood on the mongoose's mouth, the brahmin's wife struck it dead in a rage.", hi: "नेवले के मुँह पर खून देख ब्राह्मणी ने क्रोध में उसे मार डाला।" }, src: "Panchatantra", guna: "r", aims: { dharma: -10 }, holding: { en: "still with the hand that moved first", hi: "अब भी उसी हाथ के साथ जो पहले उठ गया था" }, letgo: { en: "the hand that moved first", hi: "पहले उठ जाने वाले हाथ" }, forgot: { en: "{name} keeps both hands still when a child breaks something", hi: "जब कोई बच्चा कुछ तोड़ देता है, {name} अपने दोनों हाथ स्थिर {रखता|रखती} है" } },
      "62": { to: 46, ic: "🙈", en: "Attachment", hi: "मोह", skt: "Moha", age: 52, moment: { en: "{name} is {age} and has never once said no to {child=the son}, and does not say it now, when it matters most.", hi: "{name} {age} बरस {का|की} है। {child=बेटे} को कभी 'ना' नहीं कहा। आज, जब कहना सबसे ज़रूरी है, तब भी {name} से नहीं कहा जाता।", mirror: { en: "Dhritarashtra was blind, and could never say it to Duryodhana either.", hi: "धृतराष्ट्र अंधे थे, और दुर्योधन से वे भी कभी यह नहीं कह पाए।" }, cast: "son", recall: { en: "to whom {name} never once said no", hi: "जिसे {name} ने कभी 'ना' नहीं कहा था" } }, mirror: { en: "Blind King Dhritarashtra could never say no to his son Duryodhana.", hi: "अंधे राजा धृतराष्ट्र अपने पुत्र दुर्योधन को कभी मना नहीं कर सके।" }, src: "Mahabharata", guna: "t", aims: { kama: 5, dharma: -5 }, holding: { en: "still unable to say no to {child=the son}", hi: "अब भी {child=बेटे} को ना न कह पाते हुए" }, letgo: { en: "the yes always owed to {child=the son}", hi: "{child=बेटे} को हर बार हाँ कहने की मजबूरी" }, forgot: { en: "{name} cannot refuse a boy anything", hi: "{name} किसी लड़के को किसी चीज़ के लिए मना नहीं कर {पाता|पाती}" } },
      "69": { to: 52, ic: "👁️", en: "Envy", hi: "मत्सर", skt: "Matsarya", age: 57, moment: { en: "{name} is {age} and is shown round {rival=the rival}'s new house, praises every room, and lies awake that night counting them.", hi: "{name} {age} बरस {का|की} है। {name} ने {rival=प्रतिद्वंद्वी} के नए घर के हर कमरे की तारीफ़ की, और उस रात नींद नहीं आई: कमरे गिनते-गिनते सुबह हो गई।", mirror: { en: "Duryodhana walked round the Pandavas' hall at Indraprastha the same way, and burned.", hi: "दुर्योधन भी इंद्रप्रस्थ में पांडवों की सभा ऐसे ही घूमा था, और भीतर जलता रहा।" }, cast: "rival", recall: { en: "whose new house had {name} up all night counting the rooms", hi: "जिसके नए घर के कमरे {name} ने कभी रात भर गिने थे" } }, mirror: { en: "Seeing the Pandavas' wondrous hall at Indraprastha, Duryodhana burned with envy.", hi: "इंद्रप्रस्थ में पांडवों का अद्भुत सभाभवन देखकर दुर्योधन ईर्ष्या से जल उठा।" }, src: "Mahabharata, Sabha Parva", guna: "r", aims: { artha: 5, dharma: -5 }, holding: { en: "still counting {rival=the rival}'s rooms", hi: "अब भी {rival=प्रतिद्वंद्वी} के कमरे गिनते हुए" }, letgo: { en: "counting {rival=the rival}'s rooms", hi: "{rival=प्रतिद्वंद्वी} के कमरे गिनने की आदत" }, forgot: { en: "{name} counts the windows of every house {name} passes", hi: "{name} हर गुज़रते घर की खिड़कियाँ {गिनता|गिनती} है" } },
      "77": { to: 58, ic: "🦚", en: "Pride", hi: "मद", skt: "Mada", age: 65, moment: { en: "{name} is {age}, and at the wedding tells everyone who will listen that none of this would exist without {name}.", hi: "{name} {age} बरस {का|की} है। {name} ने शादी में हर सुनने वाले को बताया कि {name} के बिना यह सब होता ही नहीं।", mirror: { en: "The gods said the same after a victory: 'This greatness is ours.' Then a Yaksha appeared.", hi: "विजय के बाद देवताओं ने भी यही कहा था: 'यह महिमा हमारी है।' तभी एक यक्ष प्रकट हुआ।" } }, mirror: { en: "After a victory the gods boasted, 'This greatness is ours.' Then a mysterious Yaksha appeared.", hi: "विजय के बाद देवता बोले, 'यह महिमा हमारी है।' तभी एक रहस्यमय यक्ष प्रकट हुआ।" }, src: "Kena Upanishad 3", guna: "r", aims: { dharma: -5 }, holding: { en: "still sure that none of it would exist without {name}", hi: "अब भी इस यक़ीन के साथ कि {name} के बिना यह सब न होता" }, letgo: { en: "the certainty that none of it would exist without {name}", hi: "{name} के बिना यह सब न होने के यक़ीन" }, forgot: { en: "mirrors make {name} uneasy", hi: "आईने {name} को बेचैन कर देते हैं" } },
      "88": { to: 71, ic: "🎭", en: "Hypocrisy", hi: "दंभ", skt: "Dambha", age: 76, moment: { en: "{name} is {age} and prays loudly, where the neighbours can hear, and on the way out is short with the man at the gate.", hi: "{name} {age} बरस {का|की} है। इतनी ज़ोर से प्रार्थना होती है कि पड़ोसी सुन सकें, और बाहर निकलते हुए दरवाज़े पर खड़े आदमी को झिड़क दिया जाता है।", mirror: { en: "A cat once posed as a holy ascetic too. When a hare and a partridge came to it for judgment, it ate them both.", hi: "एक बिल्ली ने भी तपस्वी का ढोंग रचा था। जब खरगोश और तीतर उससे न्याय माँगने आए, तो उसने दोनों को खा लिया।" } }, mirror: { en: "A cat posed as a holy ascetic. When a hare and a partridge came for judgment, it ate them both.", hi: "बिल्ली तपस्वी होने का ढोंग करती रही। न्याय माँगने आए खरगोश और तीतर को खा गई।" }, src: "Panchatantra", guna: "r", aims: { dharma: -10 }, holding: { en: "still praying where the neighbours can hear", hi: "अब भी वहाँ प्रार्थना करते हुए जहाँ पड़ोसी सुन सकें" }, letgo: { en: "the prayers said for the neighbours", hi: "पड़ोसियों को सुनाकर की गई प्रार्थनाओं" }, forgot: { en: "{name} prays only with the door shut", hi: "{name} केवल दरवाज़ा बंद करके प्रार्थना {करता|करती} है" } },
      "93": { to: 64, ic: "🦌", en: "Clinging", hi: "आसक्ति", skt: "Asakti", age: 81, moment: { en: "{name} is {age} and has given almost everything away, but cannot stop asking whether {child=the son} has eaten.", hi: "{name} {age} बरस {का|की} है। लगभग सब कुछ दे दिया है, पर यह पूछना नहीं छूटता कि {child=बेटे} ने खाना खाया या नहीं।", mirror: { en: "Bharata had given up a kingdom, and then could not stop looking after an orphaned fawn.", hi: "भरत ने पूरा राज्य छोड़ दिया था, और फिर एक अनाथ हिरण-शावक की देखभाल नहीं छोड़ पाए।" }, cast: "son", recall: { en: "whose eating {name} could never stop asking about", hi: "जिसके खाने की फ़िक्र {name} से कभी छूटी नहीं थी" } }, mirror: { en: "The sage Bharata had given up a kingdom, yet grew attached to an orphaned fawn.", hi: "राजपाट त्याग चुके भरत मुनि एक अनाथ हिरण-शावक के मोह में बँध गए।" }, src: "Bhagavata Purana 5.8", guna: "t", aims: { kama: 5 }, holding: { en: "still asking whether {child=the son} has eaten", hi: "अब भी यह पूछते हुए कि {child=बेटे} ने खाना खाया या नहीं" }, callsBack: 62, echo: { en: "Long after the no that was never said, ", hi: "उस 'ना' के बरसों बाद जो कभी कही नहीं गई, " }, letgo: { en: "asking whether {child=the son} has eaten", hi: "{child=बेटे} ने खाना खाया या नहीं, यह पूछने की आदत" }, forgot: { en: "{name} asks everyone whether they have eaten", hi: "{name} हर किसी से {पूछता|पूछती} है कि उसने खाया या नहीं" } },
      "99": { to: 61, ic: "🪞", en: "Ego", hi: "अहंकार", skt: "Ahankara", age: 89, moment: { en: "{name} is {age} and looks in the mirror and is satisfied: the body is still there, and that seems to settle it.", hi: "{name} {age} बरस {का|की} है। आईने में देखकर तसल्ली हो जाती है: शरीर अब भी वही है, और इससे जैसे बात तय हो जाती है।", mirror: { en: "Virochana was shown his reflection too, took the body for the Self, and went home content.", hi: "विरोचन को भी उसका प्रतिबिंब दिखाया गया था। उसने शरीर को ही आत्मा मान लिया और संतुष्ट होकर घर लौट गया।" } }, mirror: { en: "Shown his reflection, Virochana took the body for the Self and went home content.", hi: "अपना प्रतिबिंब देखकर विरोचन ने शरीर को ही आत्मा मान लिया और संतुष्ट लौट गया।" }, src: "Chandogya Upanishad 8.8", guna: "t", aims: { artha: 5, dharma: -5 }, holding: { en: "still sure the body settles it", hi: "अब भी इस यक़ीन के साथ कि शरीर से ही बात तय हो जाती है" }, letgo: { en: "the body that seemed to settle it", hi: "शरीर से ही बात तय हो जाने के यक़ीन" }, forgot: { en: "an empty chair makes {name} catch {his|her|their} breath", hi: "ख़ाली कुर्सी देखकर {name} की साँस अटक जाती है" } }
