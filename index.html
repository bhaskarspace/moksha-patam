      "11": { ic: "🌧️", en: "Found out", hi: "पोल खुली", age: 7, moment: { en: "{name} is {age} and says it was not {him|her|them}. It was, and everyone in the room knows it.", hi: "{name} {age} बरस {का|की} है। {name} ने कहा कि यह उसने नहीं किया। किया उसी ने था, और कमरे में सब यह जानते हैं।", mirror: { en: "A jackal who fell in a dye-vat tried the same thing and held out longer, until he howled with the others.", hi: "रंग की हौदी में गिरे एक सियार ने भी यही किया था, और ज़्यादा देर टिका रहा, जब तक बाक़ी सियारों के साथ हुआँ-हुआँ नहीं करने लगा।" } }, mirror: { en: "The blue jackal howled along with the other jackals and was found out. A lie never lasts.", hi: "नीला सियार दूसरे सियारों के साथ हुआँ-हुआँ करने लगा और पकड़ा गया। झूठ टिकता नहीं।" }, src: "Panchatantra", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age}, begins to say it was someone else, stops, and says, “It was me.” Nobody shouts.", hi: "{name} {age} बरस {का|की} है। कहने ही {वाला था|वाली थी} कि किसी और ने किया, फिर रुककर {name} ने कहा, “मैंने किया था।” कोई नहीं चिल्लाया।", mirror: { en: "The blue jackal never got to say it. The howl said it for him.", hi: "नीले सियार को यह कहने का मौक़ा ही नहीं मिला। हुआँ-हुआँ ने ही सब कह दिया।" } } } },
      "13": { ic: "🐊", en: "Monkey and crocodile", hi: "बंदर और मगरमच्छ", age: 8, moment: { en: "{name} is {age}. An older child demands the pocket money, and {name} says it was left at home. It is in {name}'s shoe.", hi: "{name} {age} बरस {का|की} है। एक बड़े बच्चे ने जेबख़र्च माँगा, और {name} ने कह दिया कि घर पर छूट गया। वह जूते में है।", mirror: { en: "The monkey said the same to the crocodile: 'My heart? I left it up in the tree.'", hi: "बंदर ने भी मगरमच्छ से यही कहा था: 'मेरा दिल? वह तो पेड़ पर ही छूट गया।'" } }, mirror: { en: "Asked for its heart, the monkey said, 'I left it up in the tree!' and escaped.", hi: "कलेजा माँगे जाने पर बंदर बोला, 'वह तो पेड़ पर छोड़ आया!' और बच निकला।" }, src: "Panchatantra" },
      "15": { ic: "🐭", en: "Set free", hi: "मुक्ति", age: 8, moment: { en: "{name} is {age} and in trouble at school for something the friend did too. The friend owns up, and they take the scolding together.", hi: "{name} {age} बरस {का|की} है। स्कूल में उस बात पर डाँट पड़ रही है जो दोस्त ने भी की थी। दोस्त आगे आकर मान लेता है, और डाँट दोनों मिलकर खाते हैं।", mirror: { en: "When the deer was caught in a net, the mouse did not ask whose fault it was. It started gnawing.", hi: "जब हिरण जाल में फँसा, तो चूहे ने यह नहीं पूछा कि ग़लती किसकी थी। वह जाल कुतरने लगा।" } }, mirror: { en: "When the deer was caught in a net, the mouse gnawed it through. Friends in need.", hi: "हिरण जाल में फँसा तो चूहे ने जाल कुतर दिया। सच्चे मित्र संकट में काम आते हैं।" }, src: "Panchatantra" },
      "16": { ic: "🐦", en: "The crows' plan", hi: "कौओं की युक्ति", age: 9, moment: { en: "{name} is {age} and, with the friend, works out how to get the ball back from the cross neighbour's yard without asking.", hi: "{name} {age} बरस {का|की} है। दोस्त के साथ मिलकर तरकीब निकाली जा रही है कि खड़ूस पड़ोसी के आँगन से गेंद बिना माँगे कैसे वापस आए।", mirror: { en: "The crows had a worse neighbour, a cobra, and a better plan: drop a queen's necklace in its hole and let the guards do the rest.", hi: "कौओं का पड़ोसी इससे बुरा था, एक नाग, और योजना इससे अच्छी: रानी का हार उसके बिल में गिरा दो, बाक़ी काम पहरेदार कर देंगे।" } }, mirror: { en: "The crows dropped a queen's necklace into the cobra's hole; the guards came and killed the snake. Wit beats strength.", hi: "कौओं ने रानी का हार साँप के बिल में डाल दिया; पहरेदारों ने आकर साँप मार दिया। बुद्धि बल से बड़ी है।" }, src: "Panchatantra" },
      "17": { ic: "😴", en: "Missed lesson", hi: "छूटा पाठ", age: 9, moment: { en: "{name} is {age} and cannot get out of bed, and does not know why, and is called lazy for it.", hi: "{name} {age} बरस {का|की} है। बिस्तर से उठा नहीं जाता, क्यों, यह पता नहीं, और इसके लिए आलसी कहा जाता है।", mirror: { en: "Sāṃkhya has a name for the weight: tamas, one of the three strands every mind is wound from. Not a failing, a proportion.", hi: "सांख्य के पास इस बोझ का एक नाम है: तमस, उन तीन धागों में से एक जिनसे हर मन बुना है। यह कोई दोष नहीं, एक अनुपात है।" } }, mirror: { en: "Sāṃkhya has a name for the weight that keeps a boy in bed: tamas, one of the three strands every mind is wound from. Not a failing, a proportion.", hi: "जो भार बालक को बिस्तर में रोके रखता है, सांख्य के पास उसका नाम है: तमस्, उन तीन गुणों में से एक जिनसे हर मन बुना है। यह दोष नहीं, एक अनुपात है।" }, src: "" },
      "18": { ic: "🧒", en: "Prahlada", hi: "प्रह्लाद", age: 10, moment: { en: "{name} is {age} and will not say sorry for something that was not wrong, though {name}'s mother asks three times.", hi: "{name} {age} बरस {का|की} है। जो ग़लत नहीं था, उसके लिए माफ़ी नहीं माँगनी, चाहे माँ तीन बार कहे।", mirror: { en: "Prahlada held out against far worse, whatever his father threatened.", hi: "प्रह्लाद इससे कहीं बड़ी धमकियों के आगे टिके रहे, पिता चाहे जो कहते रहे।" } }, mirror: { en: "The boy Prahlada kept his faith in Vishnu, whatever his father threatened.", hi: "बालक प्रह्लाद ने पिता की हर धमकी के बाद भी विष्णु में आस्था रखी।" }, src: "Bhagavata Purana 7" },
      "20": { ic: "🧵", en: "Sacred thread", hi: "उपनयन", age: 11, moment: { en: "{name} is {age}, is put into clean clothes, taken to meet the teacher properly, and told to be quiet.", hi: "{name} {age} बरस {का|की} है। साफ़ कपड़े पहनाकर गुरुजी से ठीक से मिलवाने ले जाया जाता है, और चुप रहने को कहा जाता है।" }, mirror: { en: "Upanayana means leading near. The Gṛhya Sūtras count the boy born a second time when he is led to a teacher: the first birth was the body's, this one belongs to the Veda.", hi: "उपनयन का अर्थ है पास ले जाना। गृह्यसूत्र कहते हैं कि गुरु के पास ले जाए जाने पर बालक दूसरी बार जन्म लेता है: पहला जन्म शरीर का था, यह वेद का है।" }, src: "Grihya Sutras" },
      "21": { ic: "🛖", en: "Gurukul", hi: "गुरुकुल", age: 12, moment: { en: "{name} is {age}. The house gets smaller on the road behind, and {name} does not turn around.", hi: "{name} {age} बरस {का|की} है। पीछे रास्ते पर घर छोटा होता जाता है, और {name} एक बार भी मुड़कर नहीं {देखता|देखती}।" }, mirror: { en: "You do not pay the teacher. Upamanyu herded his teacher Dhaumya's cows and was forbidden, one by one, every way of feeding himself. The fee was obedience, and the Mahābhārata never says whether it was too high.", hi: "गुरु को शुल्क नहीं दिया जाता। उपमन्यु ने गुरु धौम्य की गायें चराईं, और एक-एक कर उसे पेट भरने का हर रास्ता मना कर दिया गया। शुल्क आज्ञापालन था, और महाभारत कभी नहीं कहता कि वह बहुत ऊँचा था या नहीं।" }, src: "Mahabharata, Adi Parva" },
      "22": { ic: "🦁", en: "The lion wakes", hi: "शेर जागा", age: 13, moment: { en: "{name} is {age} and takes the clock apart to show how it works, and it does not go back together.", hi: "{name} {age} बरस {का|की} है। {name} ने घड़ी खोलकर दिखाया कि वह कैसे चलती है, और वह फिर जुड़ी नहीं।", mirror: { en: "The brothers' lion went back together very well, and then it ate them.", hi: "भाइयों का शेर तो बहुत अच्छे से जुड़ गया, और फिर उसने उन्हें खा लिया।" } }, mirror: { en: "The lion the brothers brought to life ate them. Learning without sense is dangerous.", hi: "भाइयों का जिलाया शेर उन्हीं को खा गया। समझ के बिना विद्या खतरनाक है।" }, remedy: { en: "One square above {name} is the ladder of Guru-bhakti: devotion to a teacher.", hi: "{name} से बस एक खाना ऊपर गुरु-भक्ति की सीढ़ी है।" }, src: "Panchatantra" },
      "24": { ic: "💧", en: "The well", hi: "कुआँ", age: 14, moment: { en: "{name} is {age} and wins an argument without once raising {his|her|their} voice, by letting the other side keep talking.", hi: "{name} {age} बरस {का|की} है। उसने आवाज़ ऊँची किए बिना एक बहस जीत ली: बस सामने वाले को बोलते रहने दिया।", mirror: { en: "The lion lost the same way. Shown 'another lion' in a well, it leapt at its own reflection.", hi: "शेर भी ऐसे ही हारा था। कुएँ में 'दूसरा शेर' दिखाया गया, तो वह अपनी ही परछाईं पर कूद पड़ा।" } }, mirror: { en: "Shown 'another lion' in a well, the lion leapt at its own reflection.", hi: "कुएँ में 'दूसरा शेर' देखकर शेर अपने ही प्रतिबिंब पर कूद पड़ा।" }, src: "Panchatantra" },
      "25": { ic: "📿", en: "Gayatri", hi: "गायत्री", age: 14, moment: { en: "{name} is {age} and is taught a verse to say at sunrise, and says it every morning for a year without knowing what it means.", hi: "{name} {age} बरस {का|की} है। सूर्योदय पर बोलने के लिए एक मंत्र सिखाया गया, और साल भर हर सुबह बोला गया, बिना यह जाने कि उसका अर्थ क्या है।", mirror: { en: "Vishvamitra saw that verse, the Gāyatrī, and had been born a king and fought his way to being a seer: 'may the sun impel our thoughts.'", hi: "वह मंत्र, गायत्री, विश्वामित्र ने देखा था, जो जन्म से राजा थे और संघर्ष करके ऋषि बने: 'वह सविता हमारी बुद्धि को प्रेरित करे।'" } }, mirror: { en: "Viśvāmitra was born a king and fought his way to being a seer, and this is the verse he saw: 'may the sun impel our thoughts.' Every boy given the thread is taught it first.", hi: "विश्वामित्र जन्म से राजा थे और संघर्ष करके ऋषि बने, और यही वह मंत्र है जो उन्होंने देखा: 'वह सविता हमारी बुद्धि को प्रेरित करे।' यज्ञोपवीत पाने वाले हर बालक को सबसे पहले यही सिखाया जाता है।" }, src: "Rig Veda 3.62.10" },
      "26": { ic: "🪵", en: "Firewood", hi: "समिधा", age: 15, moment: { en: "{name} is {age} and turns up at the teacher's door with an armful of sticks for the fire, because that is what one does, and waits.", hi: "{name} {age} बरस {का|की} है। आग के लिए लकड़ियों का गट्ठर लेकर गुरुजी के द्वार पर पहुँचना होता है, क्योंकि यही रीत है, और फिर प्रतीक्षा।" }, mirror: { en: "The seeker arrives holding firewood, which is both the fee and the signal. Muṇḍaka 1.2.12 adds the condition: he must already have found that nothing built by action lasts.", hi: "जिज्ञासु हाथ में समिधा लेकर आता है, जो शुल्क भी है और संकेत भी। मुंडक १.२.१२ शर्त जोड़ता है: उसे पहले ही जान लेना चाहिए कि कर्म से बनी कोई चीज़ टिकती नहीं।" }, src: "Mundaka Upanishad 1.2.12" },
      "27": { ic: "❓", en: "Six seekers", hi: "छह जिज्ञासु", age: 16, moment: { en: "{name} is {age} and asks the big question, and is told to come back in a year.", hi: "{name} {age} बरस {का|की} है। {name} ने बड़ा प्रश्न पूछा, और उत्तर मिला: एक साल बाद आना।", mirror: { en: "Pippalada said the same to six seekers: live a year in discipline first, then ask.", hi: "पिप्पलाद ने छह जिज्ञासुओं से भी यही कहा था: पहले एक साल संयम से रहो, फिर पूछो।" } }, mirror: { en: "Six seekers came to sage Pippalada. He told them to live a year in discipline before asking.", hi: "छह जिज्ञासु ऋषि पिप्पलाद के पास आए। उन्होंने कहा, पहले एक वर्ष संयम से रहो, फिर पूछो।" }, src: "Prashna Upanishad 1.2" },
      "30": { ic: "📖", en: "Speak the truth", hi: "सत्यं वद", age: 17, moment: { en: "{name} is {age} and copies out 'speak the truth' a hundred times, as the punishment for a lie.", hi: "{name} {age} बरस {का|की} है। एक झूठ की सज़ा में 'सत्य बोलो' सौ बार लिखना पड़ा।", mirror: { en: "Mīmāṃsā would have noticed the grammar. Satyaṃ vada is a command, and dharma, it said, is what the Veda commands, never what anyone feels to be right.", hi: "मीमांसा व्याकरण पर ध्यान देती। सत्यं वद एक आज्ञा है, और उसके अनुसार धर्म वही है जिसका वेद विधान करे, वह नहीं जो किसी को सही लगे।" } }, mirror: { en: "Satyaṃ vada, dharmaṃ cara: both are commands, and Mīmāṃsā built a philosophy on that grammar. Dharma is what the Veda enjoins, never what anyone feels to be right.", hi: "सत्यं वद, धर्मं चर: दोनों आदेश हैं, और मीमांसा ने इसी व्याकरण पर पूरा दर्शन खड़ा किया। धर्म वह है जिसका वेद विधान करता है, वह नहीं जो किसी को सही लगे।" }, src: "Taittiriya Upanishad 1.11", callsBack: 19, echo: { en: "After the boat that never was, ", hi: "उस नाव के बाद जो कभी थी ही नहीं, " } },
      "31": { ic: "🔥", en: "Yayati's fire", hi: "ययाति की अग्नि", age: 18, moment: { en: "{name} is {age} and eats a whole box of sweets meant for guests, one at a time, each one to stop thinking about the next.", hi: "{name} {age} बरस {का|की} है। मेहमानों के लिए रखा मिठाई का पूरा डिब्बा एक-एक करके खा लिया, हर एक इसलिए कि अगले का ख़याल छूटे।" }, mirror: { en: "Yayāti, after a thousand years in his son's borrowed youth, said it himself: desire is never quenched by enjoying it; it grows like a fire fed with ghee.", hi: "पुत्र के उधार यौवन में हज़ार वर्ष बिताकर ययाति ने स्वयं कहा: भोग से इच्छा कभी शांत नहीं होती; घी डालने से अग्नि की तरह बढ़ती है।" }, src: "Mahabharata, Adi Parva", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and alone with a box of sweets meant for guests, eats one slowly, closes the lid, and is surprised to find it stays closed.", hi: "{name} {age} बरस {का|की} है। मेहमानों के लिए रखा मिठाई का डिब्बा सामने है। {name} ने धीरे-धीरे एक मिठाई खाई, ढक्कन बंद किया, और उसे हैरानी हुई कि ढक्कन बंद ही रहा।", mirror: { en: "Yayāti borrowed his son's youth for a thousand years to learn what one sweet can teach.", hi: "ययाति ने यही सीखने के लिए हज़ार वर्ष पुत्र का यौवन उधार लिया था।" } } } },
      "32": { ic: "🧂", en: "Salt in water", hi: "जल में नमक", age: 18, moment: { en: "{name} is {age} and stirs sugar into tea, and cannot see it any more, and tastes it in every sip.", hi: "{name} {age} बरस {का|की} है। चाय में चीनी घोली, फिर दिखी नहीं, पर हर घूँट में थी।", mirror: { en: "Shvetaketu was shown the same thing with salt in water, and told: so is the Self.", hi: "श्वेतकेतु को यही बात पानी में नमक से दिखाई गई थी, और कहा गया: आत्मा भी ऐसी ही है।" } }, mirror: { en: "Shvetaketu could not see the salt in the water, yet tasted it in every sip. So is the Self.", hi: "श्वेतकेतु को जल में नमक दिखा नहीं, पर हर घूँट में स्वाद था। आत्मा भी ऐसी ही है।" }, src: "Chandogya Upanishad 6.13" },
      "33": { ic: "🌱", en: "Banyan seed", hi: "बरगद का बीज", age: 19, moment: { en: "{name} is {age}, splits a seed open with a thumbnail to see what is inside, and finds nothing.", hi: "{name} {age} बरस {का|की} है। {name} ने नाख़ून से एक बीज चीरकर देखा कि भीतर क्या है, और कुछ नहीं मिला।", mirror: { en: "Shvetaketu found nothing in the banyan seed either, and his father said that from that subtle nothing the great tree grows.", hi: "श्वेतकेतु को भी बरगद के बीज में कुछ नहीं मिला था, और पिता ने कहा कि उसी सूक्ष्म 'कुछ नहीं' से विशाल वृक्ष उगता है।" } }, mirror: { en: "Uddālaka has Śvetaketu break open a banyan seed and asks what he sees. 'Nothing at all.' From that subtle nothing, says his father, the great tree grows.", hi: "उद्दालक श्वेतकेतु से बरगद का बीज तुड़वाकर पूछते हैं कि क्या दिखता है। 'कुछ भी नहीं।' उसी सूक्ष्म 'कुछ नहीं' से, पिता कहते हैं, विशाल वृक्ष उगता है।" }, src: "Chandogya Upanishad 6.12" },
      "35": { ic: "🐎", en: "The chariot", hi: "रथ", age: 20, moment: { en: "{name} is {age} and is learning to drive, and finds the hard part is not the hands or the feet but deciding where to go.", hi: "{name} {age} बरस {का|की} है। गाड़ी चलाना सीखते हुए पता चलता है कि मुश्किल हाथ-पैर नहीं, यह तय करना है कि जाना कहाँ है।" }, mirror: { en: "Yama gives Naciketas a picture: the self rides, the body is the chariot, the senses the horses, the mind the reins, the intellect the driver. Every school after him argued over who really holds the reins.", hi: "यम नचिकेता को एक चित्र देते हैं: आत्मा रथी है, शरीर रथ, इंद्रियाँ घोड़े, मन लगाम और बुद्धि सारथी। उनके बाद हर दर्शन इसी पर लड़ा कि लगाम असल में किसके हाथ में है।" }, src: "Katha Upanishad 1.3.3–4" },
      "36": { ic: "💎", en: "You are That", hi: "तत् त्वम् असि", age: 21, moment: { en: "{name} is {age} and, looking at a stranger across a crowded platform, has the sudden plain thought: that could be me.", hi: "{name} {age} बरस {का|की} है। भीड़ भरे प्लेटफ़ॉर्म पर एक अजनबी को देखते हुए अचानक सीधा-सा ख़याल आता है: {यह मैं भी हो सकता था|यह मैं भी हो सकती थी}।" }, mirror: { en: "'You are That, Shvetaketu,' said his father Uddalaka.", hi: "'तुम वही हो, श्वेतकेतु,' पिता उद्दालक ने कहा।" }, src: "Chandogya Upanishad 6.8.7" },
      "37": { ic: "🙌", en: "Blessing", hi: "आशीर्वाद", age: 22, moment: { en: "{name} is {age}. The teacher hands back the last piece of work without a mark on it and says, 'You don't need me for this any more.'", hi: "{name} {age} बरस {का|की} है। गुरुजी आख़िरी काम बिना किसी निशान के लौटाते हैं और कहते हैं, 'अब इसके लिए तुम्हें मेरी ज़रूरत नहीं।'", mirror: { en: "Aruni's teacher said much the same, and the story says every Veda lit up in Aruni's mind at once.", hi: "आरुणि के गुरु ने भी लगभग यही कहा था, और कथा कहती है कि उसी क्षण सारे वेद आरुणि के मन में चमक उठे।" } }, mirror: { en: "Pleased with Aruni, his teacher blessed him: all the Vedas shone in his mind.", hi: "आरुणि से प्रसन्न होकर गुरु ने आशीर्वाद दिया: सारे वेद उसके मन में प्रकाशित हो उठे।" }, src: "Mahabharata, Adi Parva", callsBack: 26, echo: { en: "Years after the armful of sticks, ", hi: "लकड़ियों के उस गट्ठर के बरसों बाद, " } },
      "38": { ic: "🎓", en: "Graduation", hi: "समावर्तन", age: 23, moment: { en: "{name} is {age} and, on the last day, is given a list of rules by the teacher, and at the end of it one rule for when the rules run out.", hi: "{name} {age} बरस {का|की} है। आख़िरी दिन गुरुजी नियमों की एक सूची देते हैं, और उसके अंत में एक नियम उस समय के लिए जब नियम ख़त्म हो जाएँ।" }, mirror: { en: "On the last day the Taittirīya's teacher says: speak the truth, follow dharma, let your mother, father, teacher and guest be gods to you. Then the sentence that concedes the rules run out: where there is doubt about conduct, behave as the thoughtful do.", hi: "अंतिम दिन तैत्तिरीय के गुरु कहते हैं: सच बोलो, धर्म पर चलो, माता, पिता, आचार्य और अतिथि को देवता मानो। फिर वह वाक्य जो मानता है कि नियम कहीं खत्म हो जाते हैं: जहाँ आचरण में संशय हो, वहाँ विचारशील लोगों जैसा व्यवहार करो।" }, src: "Taittiriya Upanishad 1.11" },
      "40": { ic: "🕯️", en: "Parting words", hi: "दीक्षांत उपदेश", age: 25, moment: { en: "{name} is {age} and asks three teachers what matters most, and gets three answers.", hi: "{name} {age} बरस {का|की} है। {name} ने तीन गुरुओं से पूछा कि सबसे ज़रूरी क्या है, और तीन अलग उत्तर मिले।" }, mirror: { en: "The Taittirīya lists the duties and adds 'and study and teaching' after every one. Then three teachers disagree: Satyavacas says truth matters most, Taponitya austerity, and Nāka Maudgalya says study and teaching alone, for that is austerity.", hi: "तैत्तिरीय कर्तव्य गिनाता है और हर एक के बाद जोड़ता है 'और स्वाध्याय तथा प्रवचन'। फिर तीन आचार्य असहमत होते हैं: सत्यवचा कहते हैं सत्य सबसे बड़ा है, तपोनित्य कहते हैं तप, और नाक मौद्गल्य कहते हैं केवल स्वाध्याय और प्रवचन, क्योंकि वही तप है।" }, src: "Taittiriya Upanishad 1.9", callsBack: 27, echo: { en: "The big question has come back after all, and ", hi: "वह बड़ा प्रश्न आख़िर लौट आया है, और " } },
      "41": { ic: "💍", en: "Marriage", hi: "विवाह", age: 26, moment: { en: "{name} is {age} and takes seven steps around a fire with someone {name} has met four times.", hi: "{name} {age} बरस {का|की} है। {name} ने किसी के साथ अग्नि के सात फेरे लिए, जिससे अब तक बस चार बार मिलना हुआ है।", mirror: { en: "The Gṛhya Sūtras give the words for after the seventh step: be my friend, before anything else is promised.", hi: "गृह्यसूत्र सातवें पग के बाद के शब्द देते हैं: 'मेरे सखा बनो', किसी और वचन से पहले।" } }, mirror: { en: "Seven steps round the fire, and the Gṛhya Sūtras give the words for the seventh: sakhā saptapadā bhava, be my friend. The vow is to friendship before it is to anything else.", hi: "अग्नि के चारों ओर सात कदम, और गृह्यसूत्र सातवें कदम के शब्द देते हैं: सखा सप्तपदा भव, मेरे मित्र बनो। व्रत किसी और चीज़ से पहले मित्रता का है।" }, src: "Grihya Sutras" },
      "42": { ic: "🏡", en: "Home", hi: "गृह", age: 27, moment: { en: "{name} is {age} and cooks for more people than live in the house, because people keep turning up.", hi: "{name} {age} बरस {का|की} है। घर में जितने रहते हैं उससे ज़्यादा लोगों का खाना बनता है, क्योंकि लोग आते ही रहते हैं।" }, mirror: { en: "Manu ranks the householder highest of the four stages, not because he is holiest but because the other three eat his food.", hi: "मनु चारों आश्रमों में गृहस्थ को सबसे ऊँचा रखते हैं, इसलिए नहीं कि वह सबसे पवित्र है, बल्कि इसलिए कि बाकी तीनों उसी का अन्न खाते हैं।" }, src: "Manusmriti 3.77–78" },
      "43": { ic: "🏹", en: "The bowstring", hi: "धनुष की डोरी", age: 28, moment: { en: "{name} is {age} and saves the last mango for tomorrow, and by tomorrow it has gone soft and brown.", hi: "{name} {age} बरस {का|की} है। आख़िरी आम कल के लिए बचाकर रखा, और कल तक वह पिलपिला और भूरा हो चुका था।", mirror: { en: "The jackal saved the meat for later too, and started on the bowstring. The bow sprang and killed him.", hi: "सियार ने भी मांस बाद के लिए बचाया और पहले धनुष की डोरी चबाने लगा। धनुष छिटका और उसे मार गया।" } }, mirror: { en: "To save the meat for later, the jackal gnawed the bowstring first. The bow sprang and killed him.", hi: "मांस बचाने के लिए सियार ने पहले धनुष की डोरी चबाई। धनुष उछला और वह मर गया।" }, remedy: { en: "One square above {name} is the ladder of Dāna: giving.", hi: "{name} से बस एक खाना ऊपर दान की सीढ़ी है।" }, src: "Panchatantra", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and is about to put the last mango away for tomorrow, smells it, and eats it standing at the window instead.", hi: "{name} {age} बरस {का|की} है। आख़िरी आम कल के लिए रखने ही {वाला था|वाली थी} कि उसकी महक आई, और {name} ने उसे वहीं खिड़की पर खड़े-खड़े खा लिया।", mirror: { en: "The jackal had the same meat in front of him, and decided it would keep.", hi: "सियार के सामने भी यही मांस था, और उसने सोचा कि यह बाद तक चल जाएगा।" } } } },
      "45": { ic: "🐄", en: "A thousand cows", hi: "हज़ार गायें", age: 30, moment: { en: "{name} is {age} and comes home after a long time away, and the neighbours say {name} looks different. Nobody can say how.", hi: "{name} {age} बरस {का|की} है। लंबे समय बाद घर लौटने पर पड़ोसी कहते हैं कि चेहरा कुछ बदला-बदला है। कैसे, यह कोई नहीं बता पाता।", mirror: { en: "Satyakama came back from the forest with a thousand cows, and his teacher said his face shone like one who knows Brahman.", hi: "सत्यकाम वन से हज़ार गायें लेकर लौटा, और गुरु ने कहा कि उसका चेहरा ब्रह्म को जानने वाले जैसा चमक रहा है।" } }, mirror: { en: "Satyakama returned with a thousand cows, his face shining like one who knows Brahman.", hi: "सत्यकाम हज़ार गायें लेकर लौटा, उसका मुख ब्रह्मज्ञानी की तरह चमक रहा था।" }, src: "Chandogya Upanishad 4.9" },
      "46": { ic: "⚔️", en: "Kurukshetra", hi: "कुरुक्षेत्र", age: 31, moment: { en: "{name} is {age} and hears from an uncle, after it is all over, how the family quarrel ended: nobody speaks to anybody now.", hi: "{name} {age} बरस {का|की} है। एक चाचा से, सब ख़त्म हो जाने के बाद, पता चलता है कि घर का झगड़ा कैसे निपटा: अब कोई किसी से बात नहीं करता।", mirror: { en: "Dhritarashtra heard a whole war that way, told to him by Sanjaya while he sat in the palace.", hi: "धृतराष्ट्र ने पूरा युद्ध ऐसे ही सुना था, महल में बैठे-बैठे, संजय के मुँह से।" } }, mirror: { en: "Dhṛtarāṣṭra's blind love ended in a war that destroyed the family, and he heard all of it told to him by Sañjaya, sitting in the palace.", hi: "धृतराष्ट्र के अंधे मोह का अंत उस युद्ध में हुआ जिसने कुल का नाश कर दिया, और उन्होंने उसे महल में बैठे-बैठे संजय के मुँह से सुना।" }, src: "Mahabharata", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and hears the family quarrel beginning across the room, and goes and sits between the two of them, and talks about nothing in particular until the food comes.", hi: "{name} {age} बरस {का|की} है। कमरे के उस पार घर का झगड़ा शुरू होता सुनाई देता है। {name} जाकर दोनों के बीच {बैठ जाता है|बैठ जाती है}, और खाना आने तक इधर-उधर की बातें {करता रहता है|करती रहती है}।", mirror: { en: "Dhṛtarāṣṭra heard the quarrel begin too, sitting in the palace, and let it go on.", hi: "धृतराष्ट्र ने भी झगड़ा शुरू होते सुना था, महल में बैठे-बैठे, और उसे चलने दिया।" } } } },
      "48": { ic: "🫘", en: "Leftover beans", hi: "जूठे उड़द", age: 33, moment: { en: "{name} is {age} and it is a bad year. {name} borrows from a friend for food, but not for the rent, which can wait.", hi: "{name} {age} बरस {का|की} है, और साल बुरा है। {name} ने खाने के लिए एक दोस्त से उधार लिया, पर किराए के लिए नहीं: वह रुक सकता है।", mirror: { en: "Ushasti made the same distinction in a famine. He ate an elephant-keeper's leftover beans, then refused his water: the beans he could not live without, the water he could find elsewhere.", hi: "उषस्ति ने अकाल में यही भेद किया था। महावत की बची हुई उड़द खा ली, पर उसका पानी नहीं पिया: उड़द के बिना जी नहीं सकते थे, पानी कहीं और मिल जाता।" } }, mirror: { en: "In a famine Uṣasti Cākrāyaṇa eats an elephant-keeper's leftover beans, then refuses his water. The beans he could not live without; the water he could find elsewhere.", hi: "अकाल में उषस्ति चाक्रायण एक महावत के जूठे उड़द खा लेते हैं, फिर उसका जल लेने से मना कर देते हैं। उड़द के बिना वे जी नहीं सकते थे; जल कहीं और मिल सकता था।" }, src: "Chandogya Upanishad 1.10" },
      "49": { ic: "🌾", en: "Five offerings", hi: "पंच महायज्ञ", age: 34, moment: { en: "{name} is {age} and feeds four people before eating, every day, and has stopped noticing it.", hi: "{name} {age} बरस {का|की} है। हर दिन अपने खाने से पहले चार लोगों को खिलाना होता है, और अब इस पर ध्यान भी नहीं जाता।" }, mirror: { en: "Born owing three debts, to the sages, the gods and the ancestors, the householder pays them daily. Cārvāka's reply: a debt nobody can show you a ledger for is not a debt.", hi: "तीन ऋण लेकर जन्मा गृहस्थ, ऋषियों, देवताओं और पितरों का, उन्हें रोज़ चुकाता है। चार्वाक का उत्तर: जिस ऋण का बहीखाता कोई न दिखा सके, वह ऋण नहीं।" }, src: "Manusmriti 3.70" },
      "50": { ic: "💔", en: "Too late", hi: "पछतावा", age: 35, moment: { en: "For a week {name}'s daughter flinches when {name} comes into a room. {name} keeps explaining, to people who did not ask.", hi: "हफ़्ते भर {name} की बेटी, {name} के कमरे में आते ही सहम जाती है। {name} उन लोगों को भी सफ़ाई {देता फिरता है|देती फिरती है} जिन्होंने कुछ पूछा ही नहीं।", mirror: { en: "Then she found the cobra, dead beside the cradle. The mongoose had saved her child.", hi: "फिर ब्राह्मणी को पालने के पास मरा हुआ साँप मिला। नेवले ने उसके बच्चे को बचाया था।" } }, mirror: { en: "Then she found the dead cobra: the mongoose had saved her child. Anger acts first and weeps later.", hi: "फिर उसने मरा हुआ साँप देखा: नेवले ने बच्चे को बचाया था। क्रोध पहले करता है, बाद में पछताता है।" }, remedy: { en: "One square above {name} is the ladder of Dayā: compassion.", hi: "{name} से बस एक खाना ऊपर दया की सीढ़ी है।" }, callsBack: 59, src: "Panchatantra", echo: { en: "The blow is years old by now, and still ", hi: "वह थप्पड़ बरसों पुराना हो चुका है, फिर भी " }, roll: { valence: "bad", faces: 3, moment: { en: "That evening {name} sits on the floor beside the girl and says sorry, once, and explains nothing. After a while she leans against {name}'s arm.", hi: "उस शाम {name} ने बेटी के पास ज़मीन पर बैठकर एक बार माफ़ी माँगी, और कोई सफ़ाई नहीं दी। थोड़ी देर बाद वह {name} की बाँह से टिक गई।", mirror: { en: "The brahmin's wife had no one left to say it to: the mongoose was already dead.", hi: "ब्राह्मणी के पास यह कहने को कोई नहीं बचा था: नेवला तब तक मर चुका था।" } } } },
      "52": { ic: "🎲", en: "The dice game", hi: "द्यूत क्रीड़ा", age: 38, moment: { en: "{name} is {age} and takes a bet with the rival that cannot be won, because refusing would look like losing.", hi: "{name} {age} बरस {का|की} है। {name} ने प्रतिद्वंद्वी से ऐसी शर्त लगा ली जो जीती ही नहीं जा सकती, क्योंकि मना करना हार जैसा लगता।", mirror: { en: "Envy took Duryodhana to the rigged game of dice the same way, and from there to ruin.", hi: "ईर्ष्या दुर्योधन को भी ऐसे ही कपट के जुए तक ले गई, और वहाँ से विनाश तक।" } }, mirror: { en: "Envy led Duryodhana to the rigged game of dice, and from there to ruin.", hi: "ईर्ष्या दुर्योधन को कपट के जुए तक ले गई, और वहाँ से विनाश तक।" }, src: "Mahabharata, Sabha Parva", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age}. The rival offers a bet that cannot be won. {name} takes long enough answering to see that, and says no, and it looks exactly like losing.", hi: "{name} {age} बरस {का|की} है। प्रतिद्वंद्वी ने ऐसी शर्त सामने रखी जो जीती ही नहीं जा सकती। {name} ने जवाब देने में इतनी देर लगाई कि यह दिख गया, और मना कर दिया। यह ठीक हार जैसा ही लगा।", mirror: { en: "Duryodhana asked Yudhishthira the same way, and Yudhishthira could not say no.", hi: "दुर्योधन ने युधिष्ठिर से भी ऐसे ही पूछा था, और युधिष्ठिर मना नहीं कर पाए।" } } } },
      "53": { ic: "🔆", en: "Yama teaches", hi: "यम का उपदेश", age: 39, moment: { en: "{name} is {age}. {name}'s father is dying, has fresh grass strewn, sits facing {name}, and hands things over one at a time, and last of all the thing he had kept back.", hi: "{name} {age} बरस {का|की} है। पिता मरणासन्न हैं; वे ताज़ी कुशा बिछवाते हैं, {name} की ओर मुँह करके बैठते हैं, और एक-एक करके सब कुछ सौंपते हैं, और सबसे अंत में वह बात जो उन्होंने अब तक छिपा रखी थी।", mirror: { en: "The Kauṣītaki writes down the whole script: 'Let me place my speech in you,' then breath, eye, ear, mind, and last of all, understanding. Yama, too, kept the last thing back until Nachiketa could bear it.", hi: "कौषीतकि पूरी विधि लिख देता है: 'मैं अपनी वाणी तुममें रखता हूँ,' फिर प्राण, आँख, कान, मन, और सबसे अंत में समझ। यम ने भी अंतिम बात तब तक रोके रखी जब तक नचिकेता उसे सह न सके।" } }, mirror: { en: "Moved by his resolve, Yama taught Nachiketa the secret of the deathless Self.", hi: "उसके दृढ़ निश्चय से प्रसन्न होकर यम ने नचिकेता को अमर आत्मा का रहस्य बताया।" }, src: "Kaushitaki Upanishad 2.15", callsBack: 3, echo: { en: "Long after the hour asleep on that chest, ", hi: "उस छाती पर सोए उस घंटे के बरसों बाद, " } },
      "54": { ic: "🛞", en: "Raikva", hi: "रैक्व", age: 40, moment: { en: "{name} is {age}. A problem that has beaten {name} for a month is solved in ten minutes by the man who mends bicycles outside.", hi: "{name} {age} बरस {का|की} है। महीने भर से {name} से जो उलझन नहीं सुलझ रही थी, उसे बाहर साइकिल ठीक करने वाले ने दस मिनट में सुलझा दिया।", mirror: { en: "Raikva was sitting under his cart scratching his sores, and knew more than the king.", hi: "रैक्व अपनी गाड़ी के नीचे बैठे खुजली खुजा रहे थे, और राजा से ज़्यादा जानते थे।" } }, mirror: { en: "Raikva, the humble man sitting under his cart, knew more than the king.", hi: "अपनी गाड़ी के नीचे बैठे साधारण रैक्व राजा से अधिक जानते थे।" }, src: "Chandogya Upanishad 4.1" },
      "56": { ic: "🍽️", en: "The guest", hi: "अतिथि", age: 43, moment: { en: "{name} is {age}. Someone arrives unannounced at dinner time, and {name}'s plate is the one that goes to the guest.", hi: "{name} {age} बरस {का|की} है। खाने के समय कोई बिना बताए आ जाता है, और मेहमान के आगे {name} की ही थाली जाती है।" }, mirror: { en: "The Taittirīya's teacher says honour the guest as a god, and the word says why: a-tithi, the one without a date. You feed him before you eat because he is the one visitor you could not have prepared for.", hi: "तैत्तिरीय के गुरु कहते हैं अतिथि को देवता मानो, और शब्द ही कारण बताता है: अ-तिथि, जिसकी कोई तिथि नहीं। उसे अपने से पहले खिलाते हो क्योंकि वही एक आगंतुक है जिसकी तैयारी तुम नहीं कर सकते थे।" }, src: "Taittiriya Upanishad 1.11" },
      "58": { ic: "🌿", en: "A blade of grass", hi: "तिनका", age: 46, moment: { en: "{name} is {age} and cannot get the lid off a jar, and has to hand it to a child.", hi: "{name} {age} बरस {का|की} है। एक बरनी का ढक्कन नहीं खुलता, और उसे एक बच्चे को थमाना पड़ता है।", mirror: { en: "Agni could not burn a single blade of grass, and Vayu could not move it.", hi: "अग्नि घास का एक तिनका नहीं जला सके, और वायु उसे हिला नहीं सके।" } }, mirror: { en: "Agni could not burn a blade of grass, nor Vayu blow it away. All power is Brahman's.", hi: "अग्नि एक तिनका न जला सके, न वायु उसे उड़ा सके। सारी शक्ति ब्रह्म की है।" }, src: "Kena Upanishad 3", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and cannot get the lid off a jar, holds it out to a child before anyone asks, and laughs when it comes off at once.", hi: "{name} {age} बरस {का|की} है। बरनी का ढक्कन नहीं खुलता, तो {name} ने बिना किसी के कहे उसे एक बच्चे की ओर बढ़ा दिया, और जब ढक्कन झट से खुल गया तो {हँस पड़ा|हँस पड़ी}।", mirror: { en: "Indra did not try the blade of grass at all. He asked who had put it there.", hi: "इंद्र ने तिनके को आज़माया ही नहीं। उन्होंने पूछा कि इसे वहाँ किसने रखा।" } } } },
      "60": { ic: "🧓", en: "Grey hair", hi: "श्वेत केश", age: 50, moment: { en: "{name} is {age}. The hair at the temple has gone white, and {name}'s son has a son.", hi: "{name} {age} बरस {का|की} है। कनपटी के बाल सफ़ेद हो गए हैं, और बेटे के घर बेटा हुआ है।", mirror: { en: "Manu does not fix the moment by an age. He fixes it by three signs, and these are two of them.", hi: "मनु इस क्षण को उम्र से तय नहीं करते। तीन लक्षणों से करते हैं, और ये उनमें से दो हैं।" } }, mirror: { en: "Manu fixes the moment by three signs, not by an age: the skin wrinkles, the hair whitens, and you see your son's son.", hi: "मनु यह क्षण उम्र से नहीं, तीन लक्षणों से तय करते हैं: त्वचा पर झुर्रियाँ, बाल सफ़ेद, और जब तुम अपने बेटे का बेटा देखो।" }, src: "Manusmriti 6.2" },
      "61": { ic: "🔁", en: "Begin again", hi: "फिर से आरंभ", age: 51, moment: { en: "{name} is {age} and starts again from the beginning, with the first lesson, as if none of the rest had happened.", hi: "{name} {age} बरस {का|की} है। सब कुछ फिर शुरू से शुरू होता है, पहले पाठ से, जैसे बाक़ी कुछ हुआ ही न हो।", mirror: { en: "Indra was not satisfied with the answer Virochana took home, and came back to learn, again and again, for 101 years.", hi: "विरोचन जिस उत्तर से संतुष्ट होकर लौटा, उससे इंद्र संतुष्ट नहीं हुए। वे बार-बार सीखने लौटे, एक सौ एक बरस तक।" } }, mirror: { en: "Indra was not satisfied with that answer. He came back to learn, again and again, for 101 years.", hi: "इंद्र उस उत्तर से संतुष्ट न हुए। वे बार-बार सीखने लौटे, कुल १०१ वर्ष।" }, callsBack: 99, src: "Chandogya Upanishad 8.11", echo: { en: "As on the day of the mirror, ", hi: "आईने वाले उस दिन की तरह, " } },
      "63": { ic: "🎁", en: "Enjoy by letting go", hi: "त्यागपूर्वक भोग", age: 53, moment: { en: "{name} is {age} and eats a mango slowly on the step, and does not once think about who it should have been saved for.", hi: "{name} {age} बरस {का|की} है। {name} ने सीढ़ी पर बैठकर धीरे-धीरे एक आम खाया, और एक बार भी नहीं सोचा कि इसे किसके लिए बचाना चाहिए था।" }, mirror: { en: "The Īśa's first verse: all this is pervaded by the Lord; enjoy it by letting go, and covet no one's wealth. It is one sentence, and it can be read as an order to renounce or as permission to enjoy.", hi: "ईश का पहला मंत्र: यह सब ईश्वर से व्याप्त है; त्यागपूर्वक भोगो, किसी के धन का लोभ न करो। वाक्य एक है, और इसे त्याग का आदेश भी पढ़ा जा सकता है और भोग की अनुमति भी।" }, src: "Isha Upanishad 1", callsBack: 43, echo: { en: "Long after the mango that went soft, ", hi: "उस पिलपिले आम के बरसों बाद, " } },
      "64": { ic: "🐾", en: "Born a deer", hi: "हिरण का जन्म", age: 53, moment: { en: "{name} is {age} and dreams the same dream every night: the son small again, and lost in a crowd.", hi: "{name} {age} बरस {का|की} है। हर रात एक ही सपना आता है: बेटा फिर छोटा है, और भीड़ में खो गया है।", mirror: { en: "Bharata was thinking of the fawn when he died, and was born a deer.", hi: "मरते समय भरत हिरण-शावक के बारे में सोच रहे थे, और अगले जन्म में हिरण बने।" } }, mirror: { en: "Thinking of the fawn at the moment of death, Bharata was reborn as a deer.", hi: "मृत्यु के समय शावक का ध्यान करते रहने से भरत हिरण बनकर जन्मे।" }, remedy: { en: "One square above {name} is the ladder of Vairāgya: letting go.", hi: "{name} से बस एक खाना ऊपर वैराग्य की सीढ़ी है।" }, src: "Bhagavata Purana 5.8", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and has the dream again, the son small and lost in a crowd, and this time stops looking and sits down, and the son finds {name}.", hi: "{name} {age} बरस {का|की} है। फिर वही सपना: बेटा छोटा है और भीड़ में खो गया है। इस बार सपने में {name} ढूँढना छोड़कर वहीं {बैठ जाता है|बैठ जाती है}, और बेटा ख़ुद {name} को ढूँढ लेता है।", mirror: { en: "Bharata could not stop looking for the fawn, even dying.", hi: "भरत मरते दम तक हिरण-शावक को ढूँढना नहीं छोड़ पाए।" } } } },
      "66": { ic: "🌲", en: "To the forest", hi: "वन की ओर", age: 54, moment: { en: "{name} is {age} and hands over the keys, the accounts and the house, and is still standing in the doorway.", hi: "{name} {age} बरस {का|की} है। चाबियाँ, हिसाब और घर सौंप दिया, और अब भी दरवाज़े पर ही {खड़ा है|खड़ी है}।", mirror: { en: "Yajnavalkya got as far as the door before Maitreyi asked him a question he could not leave.", hi: "याज्ञवल्क्य दरवाज़े तक ही पहुँचे थे कि मैत्रेयी ने ऐसा प्रश्न पूछा जिसे छोड़कर वे जा नहीं सके।" } }, mirror: { en: "He hands over the house, takes the fires with him and goes. Yājñavalkya did this, and Maitreyī stopped him at the door with a question.", hi: "वह घर सौंपता है, अग्नियाँ साथ लेता है और चल पड़ता है। याज्ञवल्क्य ने यही किया, और मैत्रेयी ने उन्हें द्वार पर एक प्रश्न से रोक लिया।" }, src: "Brihadaranyaka Upanishad 2.4" },
      "67": { ic: "🫂", en: "No hatred", hi: "द्वेष नहीं", age: 55, moment: { en: "{name} is {age} and meets the old rival again at a wedding, and finds there is nothing left to feel about it.", hi: "{name} {age} बरस {का|की} है। एक शादी में पुराने प्रतिद्वंद्वी से फिर मुलाक़ात होती है, और भीतर उसके बारे में कुछ भी बाक़ी नहीं निकलता।" }, mirror: { en: "The Īśa's sixth verse: one who sees all beings in the Self, and the Self in all beings, hates no one. It does not say how you would know you had seen it, except that the hatred stops.", hi: "ईश का छठा मंत्र: जो सब प्राणियों को आत्मा में और आत्मा को सब में देखता है, वह किसी से घृणा नहीं करता। यह नहीं बताता कि देख लेने का पता कैसे चले, सिवाय इसके कि घृणा रुक जाती है।" }, src: "Isha Upanishad 6", callsBack: 52, echo: { en: "Long after the bet that could not be won, ", hi: "उस शर्त के बरसों बाद जो जीती ही नहीं जा सकती थी, " } },
      "68": { ic: "📚", en: "Only words", hi: "केवल शब्द", age: 56, moment: { en: "{name} is {age}, has read every book on the shelf twice, and one evening says out loud that none of it has helped.", hi: "{name} {age} बरस {का|की} है। अलमारी की हर किताब दो बार पढ़ी जा चुकी है, और एक शाम {name} ने ज़ोर से कह दिया कि किसी से कोई मदद नहीं मिली।", mirror: { en: "Narada came to Sanatkumara the same way, every scripture mastered: 'I know only words, not the Self.'", hi: "नारद भी ऐसे ही सनत्कुमार के पास आए थे, सब शास्त्र पढ़कर: 'मैं केवल शब्द जानता हूँ, आत्मा नहीं।'" } }, mirror: { en: "Narada had mastered every scripture, yet came grieving: 'I know only words, not the Self.'", hi: "नारद सब शास्त्र जानते थे, फिर भी दुखी होकर बोले: 'मैं केवल शब्द जानता हूँ, आत्मा नहीं।'" }, src: "Chandogya Upanishad 7.1" },
      "70": { ic: "🪆", en: "Five sheaths", hi: "पंचकोश", age: 58, moment: { en: "{name} is {age} and at the end of the day takes off the watch, then the glasses, then the shawl, and wonders what is left once all of it is off.", hi: "{name} {age} बरस {का|की} है। दिन ढलने पर घड़ी उतारी, फिर चश्मा, फिर शॉल, और सोचा कि सब उतर जाने के बाद क्या बचता है।", mirror: { en: "The Taittirīya peels the self the same way, layer by layer: food, breath, mind, understanding, bliss. Each sheath has another self inside it.", hi: "तैत्तिरीय भी आत्मा को ऐसे ही परत-दर-परत खोलता है: अन्न, प्राण, मन, विज्ञान, आनंद। हर कोश के भीतर एक और आत्मा है।" } }, mirror: { en: "The Taittirīya opens the self layer by layer: food, breath, mind, understanding, bliss. Each sheath is called a self, and each is said to have another self inside it.", hi: "तैत्तिरीय आत्मा को परत-दर-परत खोलता है: अन्न, प्राण, मन, विज्ञान, आनंद। हर कोश को आत्मा कहा गया है, और हर एक के भीतर एक और आत्मा बताई गई है।" }, src: "Taittiriya Upanishad 2" },
      "71": { ic: "🐈", en: "Unmasked", hi: "ढोंग उजागर", age: 59, moment: { en: "{name} is {age} and overhears what the neighbours really say about all that praying.", hi: "{name} {age} बरस {का|की} है। अनजाने में सुनाई पड़ जाता है कि पड़ोसी उस सारी पूजा-पाठ के बारे में असल में क्या कहते हैं।" }, mirror: { en: "The cat's prayers were only a trap. True austerity needs no audience.", hi: "बिल्ली की प्रार्थना केवल एक जाल थी। सच्चे तप को दर्शकों की ज़रूरत नहीं।" }, remedy: { en: "One square above {name} is the ladder of Tapas: austerity.", hi: "{name} से बस एक खाना ऊपर तप की सीढ़ी है।" }, src: "Panchatantra", roll: { valence: "bad", faces: 3, moment: { en: "{name} is {age} and starts praying with the door shut, and finds it goes differently with nobody to hear it.", hi: "{name} {age} बरस {का|की} है। अब {name} दरवाज़ा बंद करके पूजा करने {लगा है|लगी है}, और जब कोई सुनने वाला न हो, तो पूजा कुछ और ही तरह से होती है।", mirror: { en: "The cat prayed in the open, where a hare and a partridge would come to be judged.", hi: "बिल्ली खुले में पूजा करती थी, जहाँ एक खरगोश और एक तीतर उससे न्याय कराने आ सकें।" } } } },
      "73": { ic: "🌬️", en: "Breath", hi: "प्राण", age: 61, moment: { en: "{name} is {age}, has a bad chest all winter, and learns that when the breath runs short everything else goes with it.", hi: "{name} {age} बरस {का|की} है। पूरी सर्दी छाती जकड़ी रही, और समझ आया कि साँस छोटी पड़ते ही बाक़ी सब भी साथ छोड़ने लगता है।", mirror: { en: "The Chāndogya's senses found out the same way. Each left the body for a year to prove it was the greatest, and the body lived through every absence but breath's.", hi: "छांदोग्य की इंद्रियों को भी ऐसे ही पता चला था। हर एक साल भर शरीर छोड़कर गई, यह दिखाने कि वही सबसे बड़ी है, और शरीर हर एक के बिना जी गया, बस प्राण के बिना नहीं।" } }, mirror: { en: "In the Chāndogya the senses quarrel over which is greatest, and each leaves the body for a year to prove it. The body survives every absence but one: when breath begins to go, it drags all the others with it.", hi: "छांदोग्य में इंद्रियाँ झगड़ती हैं कि सबसे बड़ा कौन, और साबित करने के लिए हर एक साल भर शरीर छोड़ देती है। शरीर हर अनुपस्थिति झेल लेता है, एक को छोड़कर: जब प्राण जाने लगे तो बाकी सबको साथ खींच ले जाता है।" }, src: "Chandogya Upanishad 5.1" },
      "74": { ic: "🛕", en: "Temple of the heart", hi: "हृदय मंदिर", age: 62, moment: { en: "{name} is {age} and sits still for ten minutes every morning in the smallest room in the house, and finds it is not small.", hi: "{name} {age} बरस {का|की} है। हर सुबह घर के सबसे छोटे कमरे में दस मिनट चुप बैठना होता है, और वह कमरा छोटा नहीं लगता।" }, mirror: { en: "The Chāndogya says there is a small lotus-house in the city of the body, and inside it a space as vast as the one outside. The pupils ask the obvious thing: what could there be to look for in so small a space?", hi: "छांदोग्य कहता है कि शरीर रूपी नगर में एक छोटा कमल-गृह है, और उसके भीतर बाहर जितना ही विशाल आकाश। शिष्य वही पूछते हैं जो कोई भी पूछेगा: इतनी छोटी जगह में ढूँढने लायक क्या हो सकता है?" }, src: "Chandogya Upanishad 8.1" },
      "75": { ic: "👑", en: "Nothing of mine burns", hi: "मेरा कुछ नहीं जलता", age: 63, moment: { en: "{name} is {age}. The roof leaks onto everything kept in the trunk for forty years. {name} spreads it all out to dry, and some of it is not worth drying.", hi: "{name} {age} बरस {का|की} है। छत टपकी और चालीस बरस से संदूक में रखा सब कुछ भीग गया। {name} ने सब धूप में फैलाया, और उसमें से कुछ सुखाने लायक़ भी नहीं था।" }, mirror: { en: "When Mithila was on fire, Janaka said: nothing that is truly mine is burning.", hi: "मिथिला जल रही थी, तब जनक बोले: जो सचमुच मेरा है, उसमें से कुछ नहीं जल रहा।" }, src: "Mahabharata, Shanti Parva" },
      "76": { ic: "🌅", en: "Sandhya", hi: "संध्या", age: 64, moment: { en: "{name} is {age} and stands facing the sun every morning, asking for a clearer head, and nothing else.", hi: "{name} {age} बरस {का|की} है। हर सुबह सूरज की ओर मुँह करके एक साफ़ मन माँगा जाता है, और कुछ नहीं।", mirror: { en: "Vishvamitra's verse, the Gāyatrī, asks for exactly that: that the light impel our thoughts. A better mind, not a better life.", hi: "विश्वामित्र का मंत्र, गायत्री, ठीक यही माँगता है: प्रकाश हमारी बुद्धि को प्रेरित करे। बेहतर मन, बेहतर जीवन नहीं।" } }, mirror: { en: "Three times a day he faces the sun and says the Gāyatrī, a verse that asks the light to impel our thoughts. It asks for a better mind, not a better life.", hi: "दिन में तीन बार वह सूर्य की ओर मुख करके गायत्री कहता है, एक मंत्र जो प्रकाश से हमारी बुद्धि को प्रेरित करने को कहता है। यह बेहतर मन माँगता है, बेहतर जीवन नहीं।" }, src: "Rig Veda 3.62.10" },
      "78": { ic: "💞", en: "For the Self", hi: "आत्मा के लिए", age: 66, moment: { en: "{name} is {age}, watches the one {name} married asleep, and cannot tell whose sake the love is for.", hi: "{name} {age} बरस {का|की} है। सोते हुए जीवनसाथी को देखकर समझ नहीं आता कि यह प्रेम किसके लिए है: उसके लिए, या अपने लिए।" }, mirror: { en: "Yājñavalkya tells Maitreyī that a husband is dear not for the husband's sake but for the Self's, and the same for a wife, for sons, for wealth, for everything. It is either the most selfish sentence in the Upaniṣads or the least.", hi: "याज्ञवल्क्य मैत्रेयी से कहते हैं कि पति, पति के लिए नहीं, आत्मा के लिए प्रिय होता है, और यही पत्नी, पुत्र, धन, सब के लिए। यह या तो उपनिषदों का सबसे स्वार्थी वाक्य है या सबसे निःस्वार्थ।" }, src: "Brihadaranyaka Upanishad 2.4.5", callsBack: 41, echo: { en: "Long after the seven steps, ", hi: "उन सात फेरों के बरसों बाद, " } },
      "79": { ic: "🙋‍♀️", en: "Gargi", hi: "गार्गी", age: 67, moment: { en: "{name} is {age} and keeps asking the doctor 'and then what?', and is finally told not to ask so much.", hi: "{name} {age} बरस {का|की} है। {name} ने डॉक्टर से बार-बार पूछा, 'और फिर?', और आख़िर में कहा गया कि इतना मत पूछो।", mirror: { en: "Gargi pushed Yajnavalkya the same way, asking what the world is woven on, until he said: 'Do not question too far, Gargi, or your head will fall off.'", hi: "गार्गी ने याज्ञवल्क्य को ऐसे ही घेरा था, पूछती रहीं कि संसार किस पर बुना है, जब तक उन्होंने नहीं कहा: 'गार्गी, अति प्रश्न मत करो, वरना तुम्हारा सिर गिर जाएगा।'" } }, mirror: { en: "At Janaka's court Gārgī asks Yājñavalkya what the world is woven on, and what that is woven on, until he stops her: 'Do not question too far, Gārgī, or your head will fall off.'", hi: "जनक की सभा में गार्गी याज्ञवल्क्य से पूछती हैं कि संसार किस पर बुना है, और वह किस पर, जब तक वे उन्हें रोक नहीं देते: 'गार्गी, अति-प्रश्न मत करो, कहीं तुम्हारा सिर न गिर जाए।'" }, src: "Brihadaranyaka Upanishad 3.6" },
      "80": { ic: "🧡", en: "Saffron robe", hi: "भगवा वस्त्र", age: 68, moment: { en: "{name} is {age} and gives away everything that will not fit in one bag.", hi: "{name} {age} बरस {का|की} है। जो एक झोले में न समाए, वह सब दे दिया।", mirror: { en: "Manu's rite for this goes further: you perform your own funeral, take the sacred fires into yourself, and take a new name.", hi: "मनु की विधि इससे आगे जाती है: अपना ही अंतिम संस्कार करो, पवित्र अग्नियों को अपने भीतर ले लो, और नया नाम धारण करो।" } }, mirror: { en: "At the sannyāsa rite he performs his own funeral, takes the sacred fires into himself, as Manu puts it, and takes a new name. From that morning he is dead in law and owes the three debts no longer.", hi: "संन्यास दीक्षा में वह अपना ही श्राद्ध करता है, मनु के शब्दों में यज्ञ की अग्नियों को अपने भीतर रख लेता है, और नया नाम लेता है। उस सुबह से वह विधि की दृष्टि में मृत है और तीनों ऋणों से मुक्त।" }, src: "Manusmriti 6.38" },
      "81": { ic: "🍃", en: "Neti neti", hi: "नेति नेति", age: 69, moment: { en: "{name} is {age}. A child asks what {name} is, and {name} says 'not this' of the body, then of the name, then of the job, until the child gets bored.", hi: "{name} {age} बरस {का|की} है। एक बच्चे ने पूछा कि तुम क्या हो। {name} ने शरीर के लिए कहा 'यह नहीं', फिर नाम के लिए, फिर काम के लिए, जब तक बच्चा ऊब नहीं गया।" }, mirror: { en: "Yājñavalkya's description of the Self is two words long, and both are refusals: neti, neti, not this, not this.", hi: "याज्ञवल्क्य का आत्मा-वर्णन दो शब्दों का है, और दोनों इनकार हैं: नेति, नेति, यह नहीं, यह नहीं।" }, src: "Brihadaranyaka Upanishad 2.3.6", callsBack: 10, echo: { en: "The question comes round the other way now: ", hi: "अब प्रश्न उलटी ओर से आता है: " } },
      "82": { ic: "🌙", en: "Four states", hi: "चार अवस्थाएँ", age: 70, moment: { en: "{name} is {age}, wakes from a dream at four in the morning, and for a moment cannot remember any name or face at all, and is not afraid.", hi: "{name} {age} बरस {का|की} है। सुबह चार बजे एक सपने से नींद खुलती है, और एक क्षण तक कोई नाम, कोई चेहरा याद नहीं आता, और डर भी नहीं लगता।" }, mirror: { en: "The Māṇḍūkya, twelve verses long, counts waking, dreaming and deep sleep, then a fourth state it will describe only by what it is not.", hi: "बारह मंत्रों का माण्डूक्य जाग्रत, स्वप्न और सुषुप्ति गिनता है, फिर एक चौथी अवस्था, जिसका वर्णन वह केवल इससे करता है कि वह क्या नहीं है।" }, src: "Mandukya Upanishad 3–7" },
      "83": { ic: "🌌", en: "Immortality", hi: "अमृतत्व", age: 71, moment: { en: "{name} is {age} and tells a child who asked the one thing worth knowing, then goes for a walk alone and does not hurry back.", hi: "{name} {age} बरस {का|की} है। {name} ने पूछने वाले एक बच्चे को वह एक बात बता दी जो जानने लायक़ है, और फिर अकेले टहलने {निकल गया|निकल गई}, लौटने की कोई जल्दी नहीं।" }, mirror: { en: "Yajnavalkya taught Maitreyi the way to immortality, then left for the forest.", hi: "याज्ञवल्क्य ने मैत्रेयी को अमृतत्व का मार्ग बताया और वन चले गए।" }, src: "Brihadaranyaka Upanishad 4.5" },
      "84": { ic: "🥣", en: "Alms", hi: "भिक्षा", age: 72, moment: { en: "{name} is {age} and eats what is given at seven houses, and keeps nothing for tomorrow.", hi: "{name} {age} बरस {का|की} है। सात घरों से जो मिलता है वही खाया जाता है, और कल के लिए कुछ नहीं रखा जाता।", mirror: { en: "Mīmāṃsā objected: a man with no fire cannot sacrifice, and a man who cannot sacrifice cannot be doing dharma.", hi: "मीमांसा ने आपत्ति की: जिसके पास अग्नि नहीं, वह यज्ञ नहीं कर सकता, और जो यज्ञ नहीं कर सकता, वह धर्म नहीं कर रहा।" } }, mirror: { en: "He begs at seven houses, takes what is given and keeps nothing for tomorrow. Mīmāṃsā objected: a man with no fire cannot sacrifice, and a man who cannot sacrifice cannot be doing dharma.", hi: "वह सात घरों से भिक्षा माँगता है, जो मिले ले लेता है और कल के लिए कुछ नहीं रखता। मीमांसा ने आपत्ति की: जिसके पास अग्नि नहीं वह यज्ञ नहीं कर सकता, और जो यज्ञ नहीं कर सकता वह धर्म नहीं कर रहा।" }, src: "" },
      "86": { ic: "❔", en: "By whom?", hi: "केन?", age: 74, moment: { en: "{name} is {age}, looks at {his|her|their} own hand for a long time, and asks who is doing the looking.", hi: "{name} {age} बरस {का|की} है। {name} ने देर तक अपना ही हाथ देखा, और पूछा कि देख कौन रहा है।" }, mirror: { en: "The Kena opens with a student's question: by whom is the mind sent forth? By whom does the eye see? The answer turns out to be the one thing the eye cannot see.", hi: "केन एक शिष्य के प्रश्न से खुलता है: किसके द्वारा मन प्रेरित होता है? किससे आँख देखती है? उत्तर निकलता है वही एक चीज़ जिसे आँख नहीं देख सकती।" }, src: "Kena Upanishad 1.1" },
      "87": { ic: "🌞", en: "The golden lid", hi: "स्वर्ण पात्र", age: 75, moment: { en: "{name} is {age}. The cataract is taken off one eye, and the world is bluer than it has been for years.", hi: "{name} {age} बरस {का|की} है। एक आँख से मोतियाबिंद हटाया गया, और दुनिया बरसों बाद इतनी नीली दिखी।" }, mirror: { en: "The face of truth is covered by a golden disc. Uncover it, O Pushan, so I may see.", hi: "सत्य का मुख सोने के पात्र से ढका है। हे पूषन्, उसे हटाओ ताकि मैं देख सकूँ।" }, src: "Isha Upanishad 15" },
      "89": { ic: "🌕", en: "Bliss", hi: "आनंद", age: 77, moment: { en: "{name} is {age} and laughs out loud, alone, at nothing in particular, and cannot stop for a while.", hi: "{name} {age} बरस {का|की} है। अकेले बैठे, किसी ख़ास बात के बिना, हँसी छूट जाती है और देर तक नहीं रुकती।", mirror: { en: "Bhrigu got there on the fifth try: Brahman is bliss, and from bliss all beings are born.", hi: "भृगु पाँचवीं बार में वहाँ पहुँचा: ब्रह्म आनंद है, और आनंद से ही सब प्राणी जन्मते हैं।" } }, mirror: { en: "At last Bhrigu knew: Brahman is bliss. From bliss all beings are born.", hi: "अंत में भृगु ने जाना: ब्रह्म आनंद है। आनंद से ही सब प्राणी जन्मते हैं।" }, src: "Taittiriya Upanishad 3.6" },
      "90": { ic: "🪔", en: "Lead me to light", hi: "तमसो मा ज्योतिर्गमय", age: 78, moment: { en: "{name} is {age} and wakes in the dark not knowing which house this is, and waits, and the window comes back.", hi: "{name} {age} बरस {का|की} है। अँधेरे में नींद खुलती है, पता नहीं यह कौन-सा घर है। प्रतीक्षा, और फिर खिड़की लौट आती है।" }, mirror: { en: "Lead me from the unreal to the real. The line is older than the schools that use it, and each fills in 'the real' differently: for Sāṃkhya the witness, for Nyāya a self with properties, for Advaita the only thing there is.", hi: "असत् से सत् की ओर ले चलो। यह पंक्ति उसका प्रयोग करने वाले दर्शनों से पुरानी है, और हर एक 'सत्' को अलग भरता है: सांख्य के लिए साक्षी, न्याय के लिए गुणों वाली आत्मा, अद्वैत के लिए वह एकमात्र जो है।" }, src: "Brihadaranyaka Upanishad 1.3.28" },
      "91": { ic: "🧠", en: "Prajnanam Brahma", hi: "प्रज्ञानं ब्रह्म", age: 79, moment: { en: "{name} is {age} and, half asleep in the sun, can no longer tell where the warmth stops and {name} begins.", hi: "{name} {age} बरस {का|की} है। धूप में अधसोए, अब पता नहीं चलता कि गरमाहट कहाँ ख़त्म होती है और {name} कहाँ शुरू।" }, mirror: { en: "The Aitareya ends its story of creation with three words: prajñānaṃ brahma, consciousness is Brahman. Everything before it, gods, cows, horses, people, is listed as a name for consciousness.", hi: "ऐतरेय सृष्टि की कथा तीन शब्दों पर समाप्त करता है: प्रज्ञानं ब्रह्म, चेतना ही ब्रह्म है। उससे पहले सब कुछ, देवता, गायें, घोड़े, मनुष्य, चेतना के ही नाम गिनाए गए हैं।" }, src: "Aitareya Upanishad 3.3" },
      "92": { ic: "💫", en: "Aham Brahmasmi", hi: "अहं ब्रह्मास्मि", age: 80, moment: { en: "{name} is {age}, says 'I' one morning, and for the first time cannot find the edge of it.", hi: "{name} {age} बरस {का|की} है। एक सुबह {name} ने 'मैं' कहा, और पहली बार उसका किनारा नहीं मिला।" }, mirror: { en: "In the beginning, says the Bṛhadāraṇyaka, there was only Brahman, and it knew itself as 'I am Brahman', and so became everything. Whoever knows it so becomes all this, and even the gods cannot stop him.", hi: "आरंभ में, बृहदारण्यक कहता है, केवल ब्रह्म था, और उसने स्वयं को 'मैं ब्रह्म हूँ' जाना, और सब कुछ बन गया। जो इसे ऐसे जानता है वह यह सब बन जाता है, और देवता भी उसे रोक नहीं सकते।" }, src: "Brihadaranyaka Upanishad 1.4.10" },
      "94": { ic: "🐦", en: "The watching bird", hi: "साक्षी पक्षी", age: 82, moment: { en: "{name} is {age}, and something that has hurt for years stops hurting one morning, without being mended.", hi: "{name} {age} बरस {का|की} है। बरसों से जो बात दुखती आ रही थी, वह एक सुबह बिना सुधरे ही दुखना बंद कर देती है।" }, mirror: { en: "The Muṇḍaka finishes the two birds: when the one that eats sees the watcher as its own glory, its grief ends. Whether 'its own' means identity or kinship is exactly where the schools part.", hi: "मुंडक दो पक्षियों की बात पूरी करता है: जब फल खाने वाला साक्षी को अपनी ही महिमा देखता है, तो उसका शोक मिट जाता है। 'अपनी ही' का अर्थ एकता है या नाता, ठीक यहीं दर्शन अलग होते हैं।" }, src: "Mundaka Upanishad 3.1.2" },
      "95": { ic: "🌀", en: "Ayam Atma Brahma", hi: "अयमात्मा ब्रह्म", age: 83, moment: { en: "{name} is {age}, is told by the doctor that the body is wearing out, and nods, as if hearing about someone else's house.", hi: "{name} {age} बरस {का|की} है। डॉक्टर कहते हैं कि शरीर घिस रहा है, और {name} ने ऐसे सिर हिलाया जैसे किसी और के घर की बात हो।" }, mirror: { en: "The Māṇḍūkya's second verse: this Self is Brahman. Then it says at once that this Self has four quarters, and spends the rest of the text on three you already know.", hi: "माण्डूक्य का दूसरा मंत्र: यह आत्मा ब्रह्म है। फिर तुरंत कहता है कि इस आत्मा के चार पाद हैं, और बाकी ग्रंथ उन तीन पर लगाता है जिन्हें तुम पहले से जानते हो।" }, src: "Mandukya Upanishad 2" },
      "96": { ic: "🌍", en: "All is Brahman", hi: "सर्वं खल्विदं ब्रह्म", age: 84, moment: { en: "{name} is {age} and decides, quite deliberately, what the last thought should be, and practises it every day.", hi: "{name} {age} बरस {का|की} है। {name} ने सोच-समझकर तय किया है कि आख़िरी विचार क्या हो, और रोज़ उसका अभ्यास होता है।" }, mirror: { en: "Śāṇḍilya's meditation in the Chāndogya: all this, truly, is Brahman. Then the very next sentence: as a person's resolve is here, so they become on leaving.", hi: "छांदोग्य में शांडिल्य का ध्यान: यह सब निश्चय ही ब्रह्म है। फिर ठीक अगला वाक्य: मनुष्य का संकल्प यहाँ जैसा है, यहाँ से जाकर वह वैसा ही बनता है।" }, src: "Chandogya Upanishad 3.14.1" },
      "97": { ic: "⭕", en: "Wholeness", hi: "पूर्णता", age: 86, moment: { en: "{name} is {age}, shares a sweet among four children, gives away the last piece too, and does not feel any less.", hi: "{name} {age} बरस {का|की} है। {name} ने मिठाई चार बच्चों में बाँटी, फिर आख़िरी टुकड़ा भी दे दिया, और कुछ भी कम नहीं लगा।" }, mirror: { en: "The Īśa's invocation: take the whole from the whole and the whole remains. A sentence about infinity, written down long before mathematics had a word for it.", hi: "ईश का शांति पाठ: पूर्ण से पूर्ण निकालो तो पूर्ण ही बचता है। अनंत के बारे में एक वाक्य, जो गणित के पास इसका शब्द आने से बहुत पहले लिखा गया।" }, src: "Isha Upanishad, invocation", callsBack: 6, echo: { en: "As with the biscuit long ago, ", hi: "बहुत पहले उस बिस्कुट की तरह, " } },
      "98": { ic: "🕊️", en: "Shanti", hi: "शांति", age: 88, moment: { en: "{name} is {age}, and there is nothing {name} is waiting for.", hi: "{name} {age} बरस {का|की} है, और अब किसी चीज़ की प्रतीक्षा नहीं।", mirror: { en: "The Taittirīya says śānti three times, for three kinds of trouble. The third is the one the verse cannot promise.", hi: "तैत्तिरीय तीन बार शांति कहता है, तीन तरह के कष्टों के लिए। तीसरा वह है जिसका वचन यह मंत्र नहीं दे सकता।" } }, mirror: { en: "The Taittirīya's chants close with peace said three times, one for each kind of trouble: from yourself, from other beings, and from what nobody controls. The third is the one the verse cannot promise.", hi: "तैत्तिरीय के मंत्र तीन बार शांति कहकर समाप्त होते हैं, हर तरह के कष्ट के लिए एक बार: अपने से, दूसरे प्राणियों से, और उससे जिस पर किसी का बस नहीं। तीसरी का वादा मंत्र नहीं कर सकता।" }, src: "Taittiriya Upanishad 1.1" },
      "100": { ic: "🌄", en: "The threshold", hi: "देहरी", age: 90, moment: { en: "{name} is {age}. The people who knew {name} young are all gone, and the room is very quiet.", hi: "{name} {age} बरस {का|की} है। जो लोग {name} को जवानी में जानते थे, सब जा चुके हैं, और कमरा बहुत शांत है।" }, mirror: { en: "The last square of the world. Everything above it is a reward, and Nyāya, Mīmāṃsā and Advaita agree on exactly one thing: rewards run out.", hi: "संसार का अंतिम खाना। इसके ऊपर सब कुछ पुरस्कार है, और न्याय, मीमांसा और अद्वैत ठीक एक बात पर सहमत हैं: पुरस्कार चुक जाते हैं।" }, src: "" }
    },
    MOKSHA: {
      mirror: { en: "Nyāya, Sāṃkhya, Mīmāṃsā and three schools of Vedānta all say you have arrived here. They do not mean the same thing by it.", hi: "न्याय, सांख्य, मीमांसा और वेदांत के तीन संप्रदाय, सब कहते हैं कि आप यहाँ पहुँच गए। उनका अर्थ एक नहीं है।" }
    },
    HEAVEN: {
      "101": { en: "Indra", hi: "इन्द्र", ic: "⚡", moment: { en: "{name}'s good deeds are still being spent here, and running out.", hi: "{name} के पुण्य यहाँ अब भी ख़र्च हो रहे हैं, और घट रहे हैं।" }, mirror: { en: "Svarga, Indra's heaven: the reward of good deeds, yet not the final goal.", hi: "स्वर्ग, इंद्र का लोक: पुण्य का फल, पर अंतिम लक्ष्य नहीं।" } },
      "102": { en: "Agni", hi: "अग्नि", ic: "🔥", moment: { en: "Nothing of {name} is left here but the offerings {name} made, still travelling.", hi: "यहाँ {name} का कुछ नहीं बचा, बस वे आहुतियाँ जो {name} ने दी थीं, अब भी रास्ते में।" }, mirror: { en: "Agni carries every offering to the gods.", hi: "अग्नि हर आहुति देवताओं तक पहुँचाते हैं।" } },
      "103": { en: "Surya", hi: "सूर्य", ic: "☀️", moment: { en: "Everything {name} did was seen. Most of it nobody remembers.", hi: "{name} ने जो कुछ किया, सब देखा गया। उसमें से ज़्यादातर अब किसी को याद नहीं।" }, mirror: { en: "Surya, the visible god, witness of all actions.", hi: "सूर्य, प्रत्यक्ष देवता, सब कर्मों के साक्षी।" } },
      "104": { en: "Ganesha", hi: "गणेश", ic: "🐘", moment: { en: "{name}'s name is still painted on one door down below, until the door is painted over.", hi: "नीचे एक दरवाज़े पर {name} का नाम अब भी लिखा है, जब तक उस पर नया रंग नहीं चढ़ जाता।" }, mirror: { en: "Ganesha removes the last obstacles.", hi: "गणेश अंतिम विघ्न दूर करते हैं।" } },
      "106": { en: "Lakshmi", hi: "लक्ष्मी", ic: "🪷", moment: { en: "Whatever {name} owned has been divided, and the division argued over, and the argument forgotten.", hi: "{name} का जो कुछ था, वह बँट चुका है, बँटवारे पर झगड़ा भी हो चुका, और झगड़ा भी भुला दिया गया।" }, mirror: { en: "Lakṣmī stands on the lotus, the flower that grows out of mud and is never muddied.", hi: "लक्ष्मी कमल पर खड़ी हैं, वह फूल जो कीचड़ से उगता है और कभी मैला नहीं होता।" } },
      "107": { en: "Saraswati", hi: "सरस्वती", ic: "🦢", moment: { en: "Of everything {name} knew, one sentence is still repeated below, by someone who does not know where it came from.", hi: "{name} की सारी जानकारी में से एक वाक्य नीचे अब भी दोहराया जाता है, किसी ऐसे के मुँह से जिसे पता नहीं कि वह आया कहाँ से।" }, mirror: { en: "Sarasvatī's swan is said to separate milk from water: true knowledge from false.", hi: "कहते हैं सरस्वती का हंस दूध और पानी को अलग कर देता है: सच्चे ज्ञान को झूठे से।" } },
      "108": { en: "Brahma", hi: "ब्रह्मा", ic: "📜", moment: { en: "Somebody below still has {name}'s nose, and does not know it.", hi: "नीचे किसी के पास अब भी {name} की नाक है, और उसे यह पता नहीं।" }, mirror: { en: "The creator's square carries the hymn that doubts him. The Nāsadīya asks who knows how the world began, and answers: he who watches over it in the highest heaven knows, or maybe even he does not know.", hi: "सृष्टिकर्ता के खाने पर वह सूक्त है जो उन्हीं पर संदेह करता है। नासदीय पूछता है कि कौन जानता है संसार कैसे शुरू हुआ, और उत्तर देता है: जो परम व्योम में उसका अध्यक्ष है, वह जानता है, या शायद वह भी नहीं जानता।" }, src: "Rig Veda 10.129" },
      "109": { en: "Vishnu", hi: "विष्णु", ic: "🐚", moment: { en: "A habit {name} started is still kept in one house, by people who think it was always done that way.", hi: "{name} की शुरू की हुई एक आदत एक घर में अब भी निभाई जाती है, ऐसे लोगों से जो सोचते हैं कि यह हमेशा से होता आया है।" }, mirror: { en: "Vishnu, the preserver, who upholds dharma in every age.", hi: "पालनकर्ता विष्णु, जो हर युग में धर्म की रक्षा करते हैं।" } },
      "110": { en: "Shiva", hi: "शिव", ic: "🔱", moment: { en: "Here even {name}'s name comes loose.", hi: "यहाँ {name} का नाम भी छूट जाता है।" }, mirror: { en: "Shiva, the auspicious one, who dissolves all that binds.", hi: "कल्याणकारी शिव, जो हर बंधन को मिटाते हैं।" } }

    "1": {
      schools: [{ id: "nyaya", en: "A newborn startles, smiles and reaches for milk before anyone teaches it to. Nyāya argued that it must be remembering a life before this one.", hi: "नवजात बिना सिखाए चौंकता है, मुस्कुराता है और दूध की ओर बढ़ता है। न्याय का तर्क था कि वह इससे पहले के किसी जीवन को याद कर रहा होगा।" }, { id: "carvaka", en: "The Cārvāka answer: a mind arises from the body's elements, as heady strength arises from fermenting grain. Nothing arrived; something began.", hi: "चार्वाक का उत्तर: मन शरीर के भूतों से उत्पन्न होता है, जैसे सड़ते अन्न से नशे की शक्ति। कुछ आया नहीं; कुछ शुरू हुआ।" }],
      scholar: { en: "The newborn argument is Nyāya Sūtra 3.1.18–21. It is the board's first question, and the oldest one: is there a someone here at all before experience begins?", hi: "नवजात वाला तर्क न्यायसूत्र ३.१.१८–२१ में है। यह बोर्ड का पहला प्रश्न है, और सबसे पुराना भी: अनुभव शुरू होने से पहले क्या यहाँ कोई है भी?" },
      figures: ["akshapada"]
    },
    "2": {
      iast: "Mātṛ devo bhava",
      scholar: { en: "Mātṛ devo bhava, 'let your mother be a god to you', is the line this square used to carry. It comes from the teacher's farewell to a graduating student (Taittirīya 1.11), which the board meets again at square 38.", hi: "मातृ देवो भव, 'माता को देवता मानो', यही पंक्ति पहले इस खाने पर थी। यह स्नातक होते शिष्य को गुरु की विदाई (तैत्तिरीय १.११) से है, जो बोर्ड पर फिर खाना ३८ पर आती है।" },
      schools: [{ id: "samkhya", en: "Sāṃkhya would say the Aitareya is describing prakṛti at work: matter building a body out of matter, while the witness takes no part in it.", hi: "सांख्य कहता कि ऐतरेय प्रकृति को काम करते दिखा रहा है: पदार्थ पदार्थ से शरीर बना रहा है, और साक्षी इसमें कोई भाग नहीं लेता।" }, { id: "nyaya", en: "Nyāya disagrees: parents can build a body, but the self that arrives in it was made by no one, and it brings its own past with it.", hi: "न्याय असहमत है: माता-पिता शरीर बना सकते हैं, पर उसमें आने वाली आत्मा को किसी ने नहीं बनाया, और वह अपना अतीत साथ लाती है।" }]
    },
    "3": {
      iast: "Pitṛ devo bhava",
      scholar: { en: "Taittirīya 1.11 is the convocation: the teacher's last instructions to a student leaving for home. Speak the truth, follow dharma, do not neglect study, and then: let your mother be a god to you, your father, your teacher, your guest.", hi: "तैत्तिरीय १.११ दीक्षांत है: घर लौटते शिष्य को आचार्य की अंतिम सीख। सत्य बोलो, धर्म पर चलो, स्वाध्याय में प्रमाद न करो, और फिर: माता को देवता मानो, पिता को, आचार्य को, अतिथि को।" },
      schools: [{ id: "mimamsa", en: "Mīmāṃsā hears an injunction and takes it as one: honouring the father is a duty, and it does not end at his death; the offerings to the fathers carry it on.", hi: "मीमांसा इसमें विधि सुनती है और विधि ही मानती है: पिता का सम्मान कर्तव्य है, और वह उनकी मृत्यु पर ख़त्म नहीं होता; पितरों को दी जाने वाली आहुतियाँ उसे आगे ले जाती हैं।" }, { id: "carvaka", en: "The Cārvāka would honour the father in the room, gladly, and stop there: there are no fathers anywhere else to feed.", hi: "चार्वाक कमरे में बैठे पिता का सम्मान ख़ुशी से करता, और वहीं रुक जाता: कहीं और कोई पितर नहीं जिसे भोजन चाहिए।" }]
    },
    "4": {
      iast: "Annaprāśana",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would ask what this rite actually does. Its answer: the injunction is the Veda's real content, and the result arrives later through apūrva, an unseen potency.", hi: "मीमांसा पूछती कि यह संस्कार वास्तव में करता क्या है। उसका उत्तर: विधि ही वेद का असली विषय है, और फल बाद में अपूर्व से, एक अदृश्य शक्ति से, आता है।" }, { id: "carvaka", en: "The Cārvāka would see a child eating rice and nothing more. No unseen potency is needed to explain why a fed child grows.", hi: "चार्वाक एक बच्चे को चावल खाते देखता और कुछ नहीं। खिलाया हुआ बच्चा क्यों बढ़ता है, यह समझाने के लिए किसी अदृष्ट शक्ति की ज़रूरत नहीं।" }],
      scholar: { en: "The household manuals list about sixteen rites of passage (saṃskāra), and their lists differ. The same word, saṃskāra, later means an impression left on the mind, which the board will come back to.", hi: "गृह्यसूत्र लगभग सोलह संस्कार गिनाते हैं, और उनकी सूचियाँ भिन्न हैं। यही शब्द, संस्कार, आगे चलकर मन पर पड़ी छाप का अर्थ भी देता है, जिस पर बोर्ड लौटेगा।" }
    },
    "5": {
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.14: practice becomes firm only when kept up for a long time, without a break, and with care. Falling and getting up is the method, not a failure of it.", hi: "योगसूत्र १.१४: अभ्यास तभी दृढ़ होता है जब लंबे समय तक, निरंतर और आदर के साथ किया जाए। गिरना और उठना ही विधि है, उसकी विफलता नहीं।" }, { id: "samkhya", en: "Sāṃkhya would ask who is practising. The falling and the rising belong to prakṛti; the witness never took a step.", hi: "सांख्य पूछता कि अभ्यास कौन कर रहा है। गिरना और उठना प्रकृति का है; साक्षी ने कभी एक कदम नहीं उठाया।" }]
    },
    "6": {
      iast: "Maitrī",
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.33: meet the happy with friendliness and the suffering with compassion, and the mind grows clear.", hi: "योगसूत्र १.३३: सुखी के प्रति मैत्री और दुःखी के प्रति करुणा रखो, तो चित्त प्रसन्न होता है।" }, { id: "bauddha", en: "For the Buddhists, mettā is the first of four boundless states, to be extended outward until it reaches every being.", hi: "बौद्धों के लिए मैत्री चार अपरिमित भावों में पहली है, जिसे बाहर की ओर फैलाते जाना है जब तक वह हर प्राणी तक न पहुँचे।" }],
      scholar: { en: "From the Panchatantra's second book, 'The winning of friends'. The four animals each save the others once: friendship here is a network, not a pair.", hi: "पंचतंत्र की दूसरी पुस्तक, 'मित्रसंप्राप्ति' से। चारों पशु एक-एक बार दूसरों को बचाते हैं: यहाँ मित्रता एक जाल है, जोड़ा नहीं।" }
    },
    "7": {
      schools: [{ id: "advaita", en: "Śaṅkara reads Bādarāyaṇa's sūtra strictly: creation is līlā, done with no motive at all, the way a king with everything plays a game for nothing.", hi: "शंकर बादरायण के सूत्र को अक्षरशः पढ़ते हैं: सृष्टि लीला है, बिना किसी प्रयोजन के, जैसे सब कुछ पा चुका राजा बिना किसी लाभ के खेल खेलता है।" }, { id: "nyaya", en: "Nyāya says no: God makes the world for the sake of souls, so that their karma can ripen. A maker with no reason is not a maker; it is an accident.", hi: "न्याय कहता है नहीं: ईश्वर जगत को जीवों के लिए बनाता है, ताकि उनके कर्म फल सकें। बिना कारण का कर्ता कर्ता नहीं; वह एक संयोग है।" }],
      iast: "Līlā",
      figures: ["badarayana", "shankara"]
    },
    "8": {
      scholar: { en: "The geese warned the tortoise not to speak. The story is in the Panchatantra's first book, and also among the Buddhist Jātakas, where the moral is the same.", hi: "हंसों ने कछुए को बोलने से मना किया था। यह कथा पंचतंत्र की पहली पुस्तक में है, और बौद्ध जातकों में भी, जहाँ सीख वही है।" },
      schools: [{ id: "jaina", en: "For the Jains speech is one of the three activities (yoga) through which karmic matter flows in and sticks to the soul. The tortoise's mouth was a door.", hi: "जैनों के लिए वाणी उन तीन क्रियाओं (योग) में से है जिनसे कर्म-पुद्गल आत्मा में बहकर चिपकता है। कछुए का मुँह एक द्वार था।" }, { id: "carvaka", en: "The Cārvāka would point out that a tortoise falls because it is heavy. Nothing in the sky was keeping accounts.", hi: "चार्वाक कहता कि कछुआ इसलिए गिरा कि वह भारी है। आकाश में कोई हिसाब नहीं रख रहा था।" }]
    },
    "9": {
      scholar: { en: "The frame story: King Amaraśakti despaired of his three sons, and the old Viṣṇuśarman promised to teach them statecraft in six months. Every fable on the board is part of that one lesson.", hi: "कथा का ढाँचा: राजा अमरशक्ति अपने तीन पुत्रों से निराश थे, और वृद्ध विष्णु शर्मा ने छह महीने में उन्हें नीति सिखाने का वचन दिया। बोर्ड की हर कथा उसी एक पाठ का अंश है।" },
      figures: ["vishnusharma"],
      schools: [{ id: "nyaya", en: "Nyāya counts likeness (upamāna) as a means of knowledge: told a wild ox looks like a cow, you know one when you meet it. A fable is upamāna for princes.", hi: "न्याय सादृश्य (उपमान) को ज्ञान का साधन मानता है: बताया जाए कि नीलगाय गाय जैसी दिखती है, तो मिलने पर आप उसे पहचान लेते हैं। कथा राजकुमारों के लिए उपमान है।" }, { id: "mimamsa", en: "Mīmāṃsā files every story in the Veda as arthavāda, supporting talk. It can praise a rule, but by itself it teaches nothing.", hi: "मीमांसा वेद की हर कथा को अर्थवाद, सहायक वचन, मानती है। वह किसी विधि की प्रशंसा कर सकती है, पर अपने आप कुछ नहीं सिखाती।" }]
    },
    "10": {
      schools: [{ id: "mimamsa", en: "Mīmāṃsā held that words and their meanings are eternal, and the Veda authorless, so its testimony can be trusted with no speaker to vouch for it.", hi: "मीमांसा मानती थी कि शब्द और अर्थ का संबंध नित्य है, और वेद अपौरुषेय, इसलिए उसकी गवाही पर बिना किसी वक्ता के भरोसा किया जा सकता है।" }, { id: "nyaya", en: "Nyāya disagreed: meaning is a convention, and testimony is only as good as its speaker. The Veda is reliable because God, a reliable speaker, composed it.", hi: "न्याय असहमत था: अर्थ एक संकेत (परंपरा) है, और गवाही उतनी ही अच्छी जितना उसका वक्ता। वेद प्रमाण है क्योंकि उसे एक आप्त वक्ता, ईश्वर, ने रचा।" }]
    },
    "11": {
      schools: [{ id: "nyaya", en: "Nyāya would call the blue fur a false sign: it did not always go with kingship. The howl was a true sign, because a jackal's howl always goes with a jackal.", hi: "न्याय नीले रंग को हेत्वाभास कहता: वह हमेशा राजा होने के साथ नहीं जाता। हुआँ-हुआँ सच्चा हेतु था, क्योंकि सियार की आवाज़ हमेशा सियार के साथ होती है।" }, { id: "advaita", en: "Advaita would call the blue a superimposition: the forest took a colour for a king, the way people take a body for a Self.", hi: "अद्वैत नीले रंग को अध्यास कहता: जंगल ने एक रंग को राजा समझ लिया, जैसे लोग शरीर को आत्मा समझ लेते हैं।" }]
    },
    "12": {
      iast: "Buddhi",
      scholar: { en: "The hare told the lion of a rival lion in the well. In Sāṃkhya, buddhi is the intellect, the first thing to arise from matter, before even the sense of 'I'.", hi: "खरगोश ने शेर को कुएँ में दूसरे शेर की बात बताई। सांख्य में बुद्धि प्रकृति से उत्पन्न होने वाला पहला तत्त्व है, 'मैं' के भाव से भी पहले।" },
      schools: [{ id: "nyaya", en: "Nyāya would admire the hare's wit as inference under pressure: from what the lion wants, work out what the lion will do.", hi: "न्याय खरगोश की बुद्धि को दबाव में किया गया अनुमान कहता: शेर क्या चाहता है, इससे निकालो कि शेर क्या करेगा।" }, { id: "yoga", en: "Yoga wants a settled mind, not a quick one. The hare's cleverness won the day; it would not have stilled him for a minute.", hi: "योग स्थिर मन चाहता है, तेज़ नहीं। खरगोश की चतुराई ने बाज़ी जीत ली; वह उसे एक पल भी शांत नहीं कर पाती।" }]
    },
    "13": {
      scholar: { en: "This is the frame story of the Panchatantra's fourth book, 'Loss of what was gained'. The crocodile had the monkey on its back and talked too soon.", hi: "यह पंचतंत्र की चौथी पुस्तक, 'लब्धप्रणाश', की मुख्य कथा है। मगरमच्छ की पीठ पर बंदर था और वह जल्दी बोल पड़ा।" },
      schools: [{ id: "carvaka", en: "The Cārvāka would say the monkey knew exactly what he was: the body is the self, so of course he fought for it.", hi: "चार्वाक कहता कि बंदर ठीक जानता था कि वह क्या है: शरीर ही आत्मा है, तो ज़ाहिर है वह उसके लिए लड़ा।" }, { id: "advaita", en: "Advaita would enjoy the joke. He escaped by saying that what the crocodile wanted was somewhere else entirely, and about the Self that is the whole teaching.", hi: "अद्वैत इस मज़ाक का आनंद लेता। वह यह कहकर बचा कि मगरमच्छ जो चाहता है वह कहीं और है, और आत्मा के बारे में यही तो पूरा उपदेश है।" }]
    },
    "14": {
      iast: "Vācālatā",
      schools: [{ id: "jaina", en: "Jain monks keep three guards (gupti): over the mind, the body and speech. Guarding speech means not speaking unless it is needed.", hi: "जैन मुनि तीन गुप्तियाँ रखते हैं: मन, काया और वचन की। वचन-गुप्ति का अर्थ है बिना आवश्यकता के न बोलना।" }, { id: "nyaya", en: "Nyāya prized speech; debate was its whole method. The tortoise's error was speaking at the wrong moment, not speaking.", hi: "न्याय वाणी को महत्व देता था; शास्त्रार्थ ही उसकी पूरी पद्धति थी। कछुए की भूल बोलना नहीं, गलत क्षण में बोलना थी।" }]
    },
    "15": {
      schools: [{ id: "jaina", en: "For the Jains the mouse gnawing the net and the deer inside it each have a soul (jīva) with as much claim as yours, so ahiṃsā has to reach them both.", hi: "जैनों के लिए जाल कुतरता चूहा और उसमें फँसा हिरण, दोनों में आपके जितने ही अधिकार वाला जीव है, इसलिए अहिंसा को दोनों तक पहुँचना होगा।" }, { id: "mimamsa", en: "And yet the Veda enjoins animal sacrifice, and Mīmāṃsā held that a killing done at its command is not harm. The two schools argued over it for a thousand years.", hi: "फिर भी वेद पशु-बलि का विधान करता है, और मीमांसा का मत था कि उसकी आज्ञा से किया गया वध हिंसा नहीं। दोनों दर्शन हज़ार वर्ष तक इस पर लड़ते रहे।" }]
    },
    "16": {
      scholar: { en: "A story inside a story in the Panchatantra's first book, told by a jackal to show that a clever plan beats a stronger enemy.", hi: "पंचतंत्र की पहली पुस्तक में कथा के भीतर कथा, जिसे एक सियार यह दिखाने को कहता है कि चतुर योजना बलवान शत्रु को हरा देती है।" },
      schools: [{ id: "vaisheshika", en: "Vaiśeṣika would explain the plan without praising anyone: a necklace moved, guards followed it, a stick fell. Ordinary causes, all the way down.", hi: "वैशेषिक बिना किसी की प्रशंसा किए योजना समझाता: हार हिला, पहरेदार उसके पीछे गए, डंडा गिरा। साधारण कारण, अंत तक।" }, { id: "nyaya", en: "Nyāya would answer that the crows reasoned: where a necklace goes, guards go. That is what reasoning is, whoever does it.", hi: "न्याय का उत्तर होता कि कौओं ने तर्क किया: जहाँ हार जाता है, वहाँ पहरेदार जाते हैं। तर्क यही है, चाहे कोई भी करे।" }]
    },
    "17": {
      schools: [{ id: "yoga", en: "Patañjali accepts the strands and refuses the comfort. A proportion can be changed, and practice is the lever (Yoga Sūtra 1.12).", hi: "पतंजलि गुणों को मानते हैं पर उस सांत्वना को नहीं। अनुपात बदला जा सकता है, और अभ्यास ही उसका साधन है (योगसूत्र १.१२)।" }, { id: "carvaka", en: "The Cārvāka would ask what the lesson was for. If the body is the self and the body wants sleep, the boy has chosen the only good there is.", hi: "चार्वाक पूछता कि पाठ किसलिए था। यदि शरीर ही आत्मा है और शरीर नींद चाहता है, तो बालक ने एकमात्र सुख चुना है।" }]
    },
    "18": {
      schools: [{ id: "dvaita", en: "For Madhva, Prahlāda shows what bhakti is for: the devotee does not save himself. Viṣṇu does, by grace, when the pillar breaks open.", hi: "मध्व के लिए प्रह्लाद दिखाते हैं कि भक्ति किसलिए है: भक्त स्वयं को नहीं बचाता। खंभा फटने पर विष्णु बचाते हैं, कृपा से।" }, { id: "advaita", en: "For Advaita the story is about fearlessness: Prahlāda could not be harmed because he did not take himself for what was being harmed.", hi: "अद्वैत के लिए यह कथा निर्भयता की है: प्रह्लाद को हानि नहीं पहुँच सकती थी क्योंकि वह स्वयं को वह नहीं मानता था जिसे हानि पहुँचाई जा रही थी।" }],
      scholar: { en: "His father Hiraṇyakaśipu tried poison, elephants, fire and a cliff. Viṣṇu came as Narasiṃha, half man and half lion, at dusk, on a threshold: neither inside nor outside.", hi: "उसके पिता हिरण्यकशिपु ने विष, हाथी, अग्नि और पहाड़ से गिराना, सब आज़माया। विष्णु नरसिंह बनकर आए, आधे मनुष्य आधे सिंह, संध्या के समय, देहरी पर: न भीतर, न बाहर।" }
    },
    "19": {
      iast: "Asatya",
      schools: [{ id: "yoga", en: "Yoga Sūtra 2.36: when someone is established in truthfulness, what they say comes to pass. The jackal had the reverse: his word made nothing true.", hi: "योगसूत्र २.३६: जो सत्य में प्रतिष्ठित हो, उसकी वाणी फलित होती है। सियार के साथ उल्टा था: उसके कहने से कुछ भी सच नहीं हुआ।" }, { id: "jaina", en: "Truth is the Jains' second great vow, and they count a lie as violence, because it harms the one deceived.", hi: "सत्य जैनों का दूसरा महाव्रत है, और वे झूठ को हिंसा मानते हैं, क्योंकि वह धोखा खाने वाले को हानि पहुँचाता है।" }],
      scholar: { en: "The blue jackal is in the Panchatantra's first book. Satya, truthfulness, is the second of Yoga's five restraints and of the Jains' five great vows.", hi: "नीला सियार पंचतंत्र की पहली पुस्तक में है। सत्य योग के पाँच यमों में दूसरा है, और जैनों के पाँच महाव्रतों में भी।" }
    },
    "20": {
      iast: "Upanayana",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā asks who is entitled (adhikārin) to perform a rite. Upanayana is where that entitlement begins, and who it shut out was argued over for centuries.", hi: "मीमांसा पूछती है कि कर्म करने का अधिकारी कौन है। उपनयन से वह अधिकार आरंभ होता है, और इसने किसे बाहर रखा, इस पर सदियों बहस हुई।" }, { id: "bauddha", en: "The Buddha took students without asking their birth, and said a brahmin is made by conduct, not by a thread.", hi: "बुद्ध ने बिना जन्म पूछे शिष्य स्वीकार किए, और कहा कि ब्राह्मण आचरण से बनता है, धागे से नहीं।" }],
      scholar: { en: "Called the second birth: a twice-born (dvija) is one who has received the thread. The Gṛhya Sūtras restricted it by varṇa; reformers from the medieval bhakti poets onward challenged that.", hi: "इसे दूसरा जन्म कहा गया: द्विज वह है जिसने यज्ञोपवीत पाया। गृह्यसूत्रों ने इसे वर्ण से सीमित किया; मध्यकाल के भक्त कवियों से लेकर आगे के सुधारकों ने इसे चुनौती दी।" }
    },
    "21": {
      iast: "Gurukula",
