<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moksha Patam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The old Indian game of snakes and ladders, played as one life, with a story from the Panchatantra or the Upanishads on every square. In English and Hindi.">
<meta name="theme-color" content="#B5261E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Moksha Patam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&display=swap">
<!-- Hind draws Devanagari digits in Western shapes, so the ten digits come from Noto instead -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700&text=%E0%A5%A6%E0%A5%A7%E0%A5%A8%E0%A5%A9%E0%A5%AA%E0%A5%AB%E0%A5%AC%E0%A5%AD%E0%A5%AE%E0%A5%AF&display=swap">
<!-- Card text: a book face for English and a Devanagari text face for Hindi -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;display=swap">
<style>
/* Layout: board as the hero on the left, a narrow control column (turn, die, players, log) on the right; stacks on phones. */
:root {
  color-scheme: light;
  --ground: #E4E7F0;
  --surface: #F6F7FB;
  --ink: #1A1D35;
  --muted: #5B6080;
  --line: #CBD0E0;
  --accent: #2B3A8F;
  --on-accent: #FFFFFF;
  --f-display: "Noto Sans Devanagari", "Rozha One", "Iowan Old Style", Georgia, serif;
  --f-body: "Noto Sans Devanagari", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --f-card: "Crimson Pro", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-card-hi: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Kohinoor Devanagari", "Noto Sans Devanagari", serif;
  --p0: #C0392B; --p1: #2E5BBA; --p2: #2E8B57; --p3: #D98300;
  --frame-red: #B5261E; --frame-dark: #5A1208; --frame-gold: #F6C443;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #11132A; --surface: #1B1E3A; --ink: #ECEDF7; --muted: #A2A7C6;
    --line: #2E3257; --accent: #A3B2FF; --on-accent: #11132A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #11132A; --surface: #1B1E3A; --ink: #ECEDF7; --muted: #A2A7C6;
  --line: #2E3257; --accent: #A3B2FF; --on-accent: #11132A;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 14px; }
header .tools { display: flex; align-items: center; gap: 8px; }
button.icon { width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
#mute .cross { display: none; }
#mute.off .cross { display: inline; }
#mute.off .wave { display: none; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; grid-column: 1 / -1; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.lang button { padding: 5px 14px; border: 0; border-radius: 0; background: transparent; color: var(--ink); font-size: 14px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 820px) { .game { grid-template-columns: 1fr; } }

/* Board: an ornate red-and-gold printed frame around a 10 x 11 grid (100 earthly squares + a row of heavenly realms). */
.board-col { display: flex; flex-direction: column; gap: 10px; }
.board-frame {
  --fp: clamp(8px, 2.6vw, 18px);
  width: 100%; max-width: 600px;
  padding: var(--fp);
  background: radial-gradient(circle, var(--frame-gold) 0 1.6px, transparent 2.2px) 0 0 / 11px 11px, var(--frame-red);
  border: 3px solid var(--frame-dark); border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--frame-gold), 0 10px 30px rgba(10, 12, 40, 0.3);
}
.board-wrap { position: relative; width: 100%; aspect-ratio: 10 / 11; border: 3px solid var(--frame-dark); outline: 2px solid var(--frame-gold); background: var(--frame-dark); container-type: inline-size; }
.cells, .labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(11, 1fr); }
.cell { position: relative; box-shadow: inset 0 0 0 0.5px rgba(40, 18, 4, 0.45); }
/* The picture on each plain square sits under the snakes and ladders, like the painted boards. */
.cell .pic { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 8%; font-family: var(--f-emoji); font-size: 4.6cqi; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3)); }
.cell.heaven { background: radial-gradient(circle at 50% 40%, #FFF3C4, #F2C14E 62%, #D9922B); box-shadow: inset 0 -3px 0 var(--frame-dark), inset 0 0 0 0.5px rgba(90, 30, 8, 0.5); }
.cell.goal { background: radial-gradient(circle at 50% 42%, #4A5CD0, #1E2A78 75%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cells { filter: brightness(0.9) saturate(0.92); } }
:root[data-theme="dark"] .cells { filter: brightness(0.9) saturate(0.92); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fx { z-index: 1; }

/* The four ashramas, written up the left edge of the frame. */
.ashramas { position: absolute; top: 0; bottom: 0; right: calc(100% + 3px); width: var(--fp); pointer-events: none; }
.ashramas span {
  position: absolute; left: 50%; transform: translate(-50%, -50%) rotate(180deg);
  writing-mode: vertical-rl; white-space: nowrap;
  font-size: calc(var(--fp) * 0.58); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1;
  color: var(--frame-gold); background: var(--frame-red); padding: 4px 0;
}

/* Square labels sit above the snakes and ladders so numbers and symbols stay readable. */
.labels { z-index: 1; }
.lab { position: relative; min-width: 0; overflow: hidden; cursor: pointer; }
/* any square opens its card */
.lab:hover { box-shadow: inset 0 0 0 2px rgba(255, 236, 170, 0.85); }
.lab:focus-visible { outline: 3px solid var(--frame-gold); outline-offset: -3px; z-index: 2; }
.lab .n { position: absolute; top: 3%; left: 5%; font-size: clamp(7px, 1.75cqi, 12px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #3A2208; text-shadow: 0 0 2px rgba(255, 248, 230, 0.9); }
.lab.li .n, .lab.goal .n { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.lab .ic {
  position: absolute; top: 4%; right: 4%;
  width: 3.9cqi; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
  background: #FFF6DE; border: max(1px, 0.3cqi) solid #C98B3E;
  font-family: var(--f-emoji); font-size: 2.2cqi; line-height: 1;
}
.lab.vice .ic { border-color: #B3261E; }
.lab.virtue .ic { border-color: #2E7D4F; }
.lab .nm {
  position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
  max-width: 96%; padding: 0 0.5cqi; border-radius: 1cqi;
  background: rgba(28, 16, 6, 0.78); color: #FFF3D6;
  font-size: clamp(6px, 1.3cqi, 10px); font-weight: 600; line-height: 1.4;
  white-space: nowrap; overflow: hidden;
}
.lab.vice .nm { background: rgba(120, 20, 12, 0.88); }
.lab.virtue .nm { background: rgba(22, 80, 44, 0.9); }
.lab.heaven .ic { top: 43%; left: 50%; right: auto; transform: translate(-50%, -50%); width: auto; background: none; border: none; font-size: 4.2cqi; filter: drop-shadow(0 1px 1px rgba(90, 40, 0, 0.45)); }
.lab .dv { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-family: var(--f-display); font-size: clamp(7px, 1.75cqi, 13px); line-height: 1; color: #5A1E08; white-space: nowrap; }
.lab.goal .om { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 5.6cqi; line-height: 1; color: #FFD86B; text-shadow: 0 0 1.2cqi rgba(255, 210, 90, 0.85); animation: glow 3s ease-in-out infinite; }
.lab.goal .dv { color: #FFE7A0; }
@keyframes glow { 50% { text-shadow: 0 0 2.4cqi rgba(255, 220, 110, 1); } }
@container (max-width: 440px) {
  .lab .nm, .ashramas { display: none; }
  .lab .ic { width: 4.6cqi; font-size: 2.6cqi; }
}

/* Players: pixel-art figures that walk, climb and grow. Feet sit on the square, with a shadow in the player's colour. */
.tokens { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.token {
  position: absolute; width: 7.4%; aspect-ratio: 12 / 16;
  transform: translate(-50%, -92%);
  transition: left 0.14s ease-out, top 0.14s ease-out;
  z-index: 2;
}
.token.free { transition: none; }
.token::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -5%; height: 15%; border-radius: 50%;
  background: var(--pc); box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0, 0, 0, 0.5); z-index: -1;
}
.token .body { width: 100%; height: 100%; }
.token .spr { width: 100%; height: 100%; background-size: 100% 100%; image-rendering: pixelated; filter: drop-shadow(0 0 0.6px #fff) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45)); }
.token.left .spr { transform: scaleX(-1); }
.token.divine .spr { filter: drop-shadow(0 0 3px #FFD54A) drop-shadow(0 0 1px #fff); }
.token.active { z-index: 3; }
.token.active .body { animation: bob 1.1s ease-in-out infinite; }
.token.hop .body { animation: hop 0.18s ease-out; }
.token.gulp .body { transform-origin: 50% 30%; animation: gulp 0.34s ease-in forwards; }
.token.dizzy .body { animation: dizzy 0.7s ease-out; }
.token.hide { opacity: 0; }
.token.poof::before {
  content: ""; position: absolute; inset: -45%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 236, 150, 0.95) 0 18%, rgba(255, 200, 80, 0.55) 40%, transparent 66%);
  animation: poof 0.65s ease-out forwards;
}
@keyframes bob { 50% { transform: translateY(-7%); } }
@keyframes hop { 50% { transform: translateY(-24%); } }
@keyframes gulp { to { transform: translateY(-30%) scale(0); } }
@keyframes dizzy { 0% { transform: scale(0.2) rotate(0); } 60% { transform: scale(1.15) rotate(540deg); } 100% { transform: scale(1) rotate(720deg); } }
@keyframes poof { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.tray .token { position: relative; left: auto !important; top: auto !important; transform: none; width: 24px; }
.tray .token .body { animation: none; }

.tray { display: flex; align-items: center; gap: 10px; min-height: 40px; color: var(--muted); font-size: 13px; }
.tray .label { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; font-size: 11px; }
.tray .slots { display: flex; gap: 8px; }

/* Stage-change banner */
.toast {
  position: absolute; left: 50%; top: 11%; z-index: 4; pointer-events: none;
  background: rgba(28, 16, 6, 0.9); color: #FFF3D6; border: 1px solid var(--frame-gold);
  padding: 0.6cqi 2.4cqi; border-radius: 99px; white-space: nowrap;
  font-size: max(12px, 2.3cqi); font-weight: 600;
  animation: toast 2.4s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

/* The card: a pothi folio, a landscape manuscript leaf with a string hole, its text held between double red rules.
   Fixed paper colours, so it reads the same in both themes. */
.folio {
  padding: 0; border: 0; background: transparent; color: #2A1A08; overflow: visible;
  width: min(780px, calc(100vw - 24px)); max-width: none; max-height: calc(100dvh - 24px);
}
.folio::backdrop { background: rgba(20, 12, 4, 0.58); }
.leaf {
  --l-ink: #2A1A08; --l-ink2: #5E4527; --l-gold: #8A5A1E; --l-rule: #B5261E; --l-line: rgba(110, 70, 20, 0.32);
  view-transition-name: folio;
  position: relative; display: flex; flex-direction: column; max-height: calc(100dvh - 24px);
  border-radius: 14px / 18px; color: var(--l-ink); font-family: var(--f-card);
  background:
    radial-gradient(130% 150% at 50% 45%, transparent 55%, rgba(120, 72, 20, 0.3) 100%),
    radial-gradient(60% 40% at 85% 12%, rgba(255, 255, 255, 0.35), transparent 70%),
    linear-gradient(176deg, #FBF3DC, #F2DFB0 85%);
  box-shadow: inset 0 0 0 1px rgba(110, 70, 20, 0.35), inset 0 0 34px rgba(120, 72, 20, 0.22), 0 22px 60px rgba(0, 0, 0, 0.5);
}
.leaf > :not(.flourish) { position: relative; z-index: 1; }
.leaf-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 2px 24px; font-family: var(--f-body); }
.leaf .eb { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--l-gold); }
.leaf-tools { display: flex; gap: 8px; align-items: center; }
.leaf button { font-family: var(--f-body); }
.lang-mini { display: inline-flex; border: 1px solid var(--l-line); border-radius: 99px; overflow: hidden; }
.lang-mini button { padding: 3px 11px; font-size: 12px; font-weight: 600; background: transparent; color: var(--l-ink); border: 0; border-radius: 0; }
.lang-mini button[aria-pressed="true"] { background: var(--l-rule); color: #FFF6E0; }
.leaf .x { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: transparent; color: var(--l-ink); border: 1px solid var(--l-line); font-size: 20px; line-height: 1; }
.leaf button:focus-visible, .leaf a:focus-visible { outline: 3px solid var(--l-rule); outline-offset: 2px; }
.leaf-main { display: grid; grid-template-columns: 104px minmax(0, 1fr); padding: 8px 24px 4px; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.leaf-margin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px 12px 0; border-right: 4px double var(--l-rule); }
.leaf .glyph { font-family: var(--f-emoji); font-size: 52px; line-height: 1.1; filter: drop-shadow(0 2px 2px rgba(60, 30, 0, 0.25)); }
.leaf.goal .glyph { font-family: var(--f-display); color: #FFD86B; text-shadow: 0 0 14px rgba(255, 215, 100, 0.8); }
.leaf .sqn { font-family: var(--f-display); font-size: 22px; line-height: 1; color: var(--l-gold); }
/* the hole the binding string passed through */
.leaf .hole {
  margin: auto 0; width: 16px; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #24160A 0 42%, #6B4A22 58%, rgba(107, 74, 34, 0) 72%);
}
.leaf-text { padding: 6px 18px 10px 22px; border-right: 4px double var(--l-rule); min-width: 0; }
.leaf-text:lang(hi), .leaf-text :lang(hi) { font-family: var(--f-card-hi); }
.leaf-text:lang(en), .leaf-text :lang(en) { font-family: var(--f-card); }
.leaf .leaf-text h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4.6vw, 38px); line-height: 1.05; margin: 0; text-wrap: balance; }
.leaf .alt { margin: 4px 0 0; font-size: 17px; font-style: italic; color: var(--l-gold); }
.leaf .tag { margin: 6px 0 0; font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--l-ink2); }
.leaf .story p { margin: 12px 0 0; font-size: 20px; line-height: 1.5; max-width: 58ch; text-wrap: pretty; }
.leaf .story p.second, .leaf .chips p.second, .leaf .views p.second, .leaf p.note.second { font-size: 0.86em; color: var(--l-ink2); margin-top: 4px; }
.leaf .story .line2 { font-style: italic; color: var(--l-ink2); font-size: 18px; }
.leaf-text :lang(hi) p, .leaf-text:lang(hi) p { line-height: 1.7; }
.leaf .sub { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--l-line); font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--l-gold); }
.leaf .chips, .leaf .views { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.leaf .chips p, .leaf .views p { margin: 4px 0 0; font-size: 17px; line-height: 1.45; }
.leaf .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.leaf .views li { padding: 8px 10px; border-radius: 6px; background: rgba(255, 252, 240, 0.5); border: 1px solid var(--l-line); }
.leaf .views p { font-size: 15.5px; }
.leaf .chip {
  display: inline-block; padding: 1px 10px; border-radius: 99px; text-decoration: none;
  font-family: var(--f-body); font-size: 12.5px; font-weight: 600; background: #7A1F12; color: #FFF3D6;
}
.leaf .chip.new::after, .leaf .plink.new::after { content: " ✦"; color: #F6C443; }
.leaf .chip:hover { background: #9E2A1C; }
.leaf .note { margin: 16px 0 0; padding-left: 12px; border-left: 2px solid rgba(181, 38, 30, 0.5); font-size: 16.5px; line-height: 1.5; color: var(--l-ink2); }
.leaf .moksha { margin: 8px 0 0; font-size: 17px; font-style: italic; }
.leaf .people, .leaf .onboard { margin: 14px 0 0; font-size: 15px; line-height: 1.9; }
.leaf .people > span, .leaf .onboard > span { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--l-gold); margin-right: 4px; }
.leaf .people a, .leaf .onboard a { color: #7A1F12; text-underline-offset: 3px; }
.leaf .onboard a { display: inline-block; min-width: 2.2em; padding: 0 4px; margin: 0 2px 4px 0; border: 1px solid var(--l-line); border-radius: 4px; text-align: center; text-decoration: none; font-variant-numeric: tabular-nums; }
.leaf .srcline { margin: 16px 0 2px; font-size: 15px; }
.leaf .src { color: #7A1F12; font-style: italic; text-underline-offset: 3px; text-decoration-color: rgba(122, 31, 18, 0.45); }
.leaf .gloss { display: block; margin-top: 3px; font-size: 14.5px; color: var(--l-ink2); }
.leaf-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 16px 14px; font-family: var(--f-body); }
.leaf-foot > :last-child { justify-self: end; }
.leaf .nav { background: transparent; color: var(--l-ink); border: 1px solid var(--l-line); padding: 6px 12px; font-size: 14px; font-weight: 600; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaf .nav:hover { background: rgba(255, 252, 240, 0.6); }
.leaf .ft { font-size: 14px; font-weight: 700; color: var(--l-gold); text-align: center; }

.leaf.virtue { --l-rule: #2E7D4F; --l-gold: #2E6B45; }
.leaf.vice { --l-rule: #B3261E; --l-gold: #9E2A1C; background: radial-gradient(130% 150% at 50% 45%, transparent 55%, rgba(120, 30, 20, 0.3) 100%), linear-gradient(176deg, #FDF0E6, #F1CDBF 85%); }
.leaf.heaven { --l-rule: #C08A14; background: radial-gradient(130% 150% at 50% 45%, transparent 55%, rgba(150, 100, 10, 0.3) 100%), linear-gradient(176deg, #FFFBEA, #F8E3A0 85%); }
.leaf.goal { --l-ink: #FFF3D6; --l-ink2: #E2D6B4; --l-gold: #FFD86B; --l-rule: #FFD86B; --l-line: rgba(255, 216, 107, 0.35); background: radial-gradient(circle at 30% 30%, #4A5CD0, #1E2A78 75%); }
.leaf.goal .chip { background: #FFD86B; color: #1E2A78; }
.leaf.goal .views li { background: rgba(255, 255, 255, 0.08); }
.leaf.goal .src, .leaf.goal .people a, .leaf.goal .onboard a { color: #FFE7A0; }
.leaf.entry { --l-rule: #2B3A8F; --l-gold: #2B3A8F; }
.leaf.vice.landed { animation: shake 0.5s ease-in-out; }

/* virtue rays, falling petals for the realms */
.flourish { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; z-index: 0; }
.flourish .rays {
  position: absolute; left: 76px; top: 45%; width: 560px; aspect-ratio: 1; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(rgba(255, 190, 50, 0.2) 0 9deg, transparent 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); mask: radial-gradient(circle, #000 10%, transparent 60%);
  animation: spin 24s linear infinite;
}
.flourish .sp { position: absolute; bottom: -4%; color: #E0A400; font-size: 13px; opacity: 0.7; animation: rise 2.4s ease-out infinite; }
.flourish .pt { position: absolute; top: -6%; font-family: var(--f-emoji); font-size: 13px; opacity: 0.7; animation: fall 3.4s linear infinite; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 20% { opacity: 0.7; } to { transform: translateY(-260px); opacity: 0; } }
@keyframes fall { from { transform: translateY(0) rotate(0); opacity: 0; } 15% { opacity: 0.7; } to { transform: translateY(380px) rotate(200deg); opacity: 0; } }
@keyframes shake { 15%, 55% { transform: translateX(-1.2%); } 35%, 75% { transform: translateX(1.2%); } }

/* the square morphs into the card and back */
::view-transition-group(folio) { animation-duration: 340ms; animation-timing-function: cubic-bezier(0.2, 0.8, 0.25, 1); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 200ms; }

@media (max-width: 600px) {
  .leaf-top { padding: 12px 12px 0 16px; }
  .leaf-main { grid-template-columns: 52px minmax(0, 1fr); padding: 6px 12px 2px; }
  .leaf-margin { padding: 8px 8px 10px 0; border-right-width: 3px; }
  .leaf .glyph { font-size: 32px; }
  .leaf .sqn { font-size: 16px; }
  .leaf-text { padding: 4px 4px 8px 14px; border-right: 0; }
  .leaf .story p { font-size: 18px; }
  .leaf .chips p, .leaf .note { font-size: 16px; }
  .leaf-foot { padding: 6px 10px 12px; }
  .leaf .nav { max-width: 12ch; }
}

.win { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(17, 19, 42, 0.62); z-index: 5; }
.win > div { background: var(--surface); color: var(--ink); padding: 24px 28px; border-radius: 6px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 80%; }
.win h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); margin: 0; line-height: 1.1; text-wrap: balance; }
.win p { margin: 0; color: var(--muted); }

/* Side panel */
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--muted); }

.turn { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
.roll-row { display: flex; align-items: center; gap: 14px; }
.die {
  width: 72px; height: 72px; flex: none; border-radius: 12px;
  background: #FBF7EE; border: 2px solid #3B2812;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 9px; gap: 2px;
  box-shadow: 0 4px 0 #3B2812;
}
.die span { border-radius: 50%; background: transparent; margin: 3px; }
.die span.on { background: #7A1F12; }
.die.rolling { animation: tumble 0.56s ease-in-out; }
@keyframes tumble { 0% { transform: rotate(0); } 40% { transform: rotate(-25deg) translateY(-6px); } 70% { transform: rotate(15deg); } 100% { transform: rotate(0); } }
.roll-info { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); }

button {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 6px; padding: 10px 16px; border: 1px solid transparent;
  background: var(--accent); color: var(--on-accent);
}
button:disabled { opacity: 0.45; cursor: default; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.players li { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; }
.players li.current .pname { font-weight: 700; }
.players .pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.players .kind { font-size: 11px; color: var(--muted); margin-left: 4px; }
.players .stage { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; font-size: 13.5px; }
.log li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; }
.log li .dot { width: 9px; height: 9px; border-width: 1px; }
.log li.snake { color: #B03A26; }
.log li.ladder { color: #2E7D4F; }
.log li.heaven { color: #A0620A; }
:root[data-theme="dark"] .log li.snake { color: #FF8C75; }
:root[data-theme="dark"] .log li.ladder { color: #7FD9A3; }
:root[data-theme="dark"] .log li.heaven { color: #F2C55C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .log li.snake { color: #FF8C75; }
  :root:not([data-theme="light"]) .log li.ladder { color: #7FD9A3; }
  :root:not([data-theme="light"]) .log li.heaven { color: #F2C55C; }
}

details.card summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.card summary::after { content: "+"; color: var(--muted); }
details[open].card summary::after { content: "−"; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 6px 0; }
.seg button[aria-pressed="false"] { background: transparent; color: var(--ink); border-color: var(--line); }
.prow { display: grid; grid-template-columns: 14px 1fr 112px; gap: 8px; align-items: center; }
input[type="text"], select { font: inherit; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); width: 100%; min-width: 0; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
label.check input { margin-top: 4px; accent-color: var(--accent); }
label.pick { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; font-size: 14px; }
.setup-body { display: flex; flex-direction: column; gap: 12px; }

/* Moves | Codex */
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; margin-bottom: -1px; padding: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--muted); }
.logbtn { all: unset; cursor: pointer; border-radius: 3px; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.logbtn:hover { text-decoration-color: currentColor; }
.logbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.codex { display: flex; flex-direction: column; gap: 12px; max-height: 340px; overflow-y: auto; font-size: 13.5px; }
.codex .hint { margin: 0; }
.codex ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.codex .ent { display: inline-block; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); text-decoration: none; font-size: 13px; }
.codex a.ent:hover { border-color: var(--accent); }
.codex .ent.unmet { color: var(--muted); }
.codex .ent.locked { color: var(--muted); border-style: dashed; letter-spacing: 0.1em; }

@media (prefers-reduced-motion: reduce) {
  .token, .token.slide { transition: none; }
  .token .body, .die.rolling, .lab.goal .om, .leaf, .leaf *, .flourish *, .toast { animation: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
</style>

    </aside>
  </div>

      "88": { to: 71, ic: "🎭", en: "Hypocrisy", hi: "दंभ", skt: "Dambha", src: "Panchatantra", story: ["A cat posed as a holy ascetic. When a hare and a partridge came for judgment, it ate them both.", "बिल्ली तपस्वी होने का ढोंग करती रही। न्याय माँगने आए खरगोश और तीतर को खा गई।"] },
      "93": { to: 64, ic: "🦌", en: "Clinging", hi: "आसक्ति", skt: "Asakti", src: "Bhagavata Purana 5.8", story: ["The sage Bharata had given up a kingdom, yet grew attached to an orphaned fawn.", "राजपाट त्याग चुके भरत मुनि एक अनाथ हिरण-शावक के मोह में बँध गए।"] },
      "99": { to: 61, ic: "🪞", en: "Ego", hi: "अहंकार", skt: "Ahankara", src: "Chandogya Upanishad 8.8", story: ["Shown his reflection, Virochana took the body for the Self and went home content.", "अपना प्रतिबिंब देखकर विरोचन ने शरीर को ही आत्मा मान लिया और संतुष्ट लौट गया।"] }
    },
    SQ: {
      "1": ["👶", "Birth", "जन्म", "A soul arrives. The whole board lies ahead.", "एक आत्मा का आगमन। पूरा जीवन सामने है।", ""],
      "2": ["🤱", "Mother", "माँ", "Matru devo bhava: honour your mother as a god.", "मातृ देवो भव: माता को देवता मानो।", "Taittiriya Upanishad 1.11"],
      "3": ["👨‍👦", "Father", "पिता", "Pitru devo bhava: honour your father as a god.", "पितृ देवो भव: पिता को देवता मानो।", "Taittiriya Upanishad 1.11"],
      "4": ["🍚", "First rice", "अन्नप्राशन", "Annaprashana: the baby's first taste of rice, one of the rites of life.", "अन्नप्राशन: शिशु का पहला अन्न, जीवन के संस्कारों में से एक।", "Grihya Sutras"],
      "5": ["🚶", "First steps", "पहले कदम", "Falling down and getting up again: the very first lesson.", "गिरना और फिर उठना: सबसे पहला पाठ।", ""],
      "7": ["🧸", "Play", "खेल", "Play teaches sharing and waiting your turn.", "खेल से बाँटना और अपनी बारी की प्रतीक्षा करना आता है।", ""],
      "8": ["🪂", "The fall", "गिरना", "The tortoise opened its mouth to talk and fell from the sky. Silence would have saved it.", "कछुए ने बोलने को मुँह खोला और आकाश से गिर पड़ा। चुप रहता तो बच जाता।", "Panchatantra"],
      "9": ["📜", "Story time", "कथा का समय", "Vishnu Sharma taught three dull princes wisdom through animal stories: the Panchatantra.", "विष्णु शर्मा ने तीन मंदबुद्धि राजकुमारों को पशु-कथाओं से ज्ञान दिया: यही पंचतंत्र है।", "Panchatantra"],
      "10": ["💬", "First words", "पहले शब्द", "Speech is a gift: keep it gentle and true.", "वाणी एक वरदान है: इसे मधुर और सच्चा रखो।", ""],
      "11": ["🌧️", "Found out", "पोल खुली", "The blue jackal howled along with the other jackals and was found out. A lie never lasts.", "नीला सियार दूसरे सियारों के साथ हुआँ-हुआँ करने लगा और पकड़ा गया। झूठ टिकता नहीं।", "Panchatantra"],
      "13": ["🐊", "Monkey and crocodile", "बंदर और मगरमच्छ", "Asked for its heart, the monkey said, 'I left it up in the tree!' and escaped.", "कलेजा माँगे जाने पर बंदर बोला, 'वह तो पेड़ पर छोड़ आया!' और बच निकला।", "Panchatantra"],
      "15": ["🐭", "Set free", "मुक्ति", "When the deer was caught in a net, the mouse gnawed it through. Friends in need.", "हिरण जाल में फँसा तो चूहे ने जाल कुतर दिया। सच्चे मित्र संकट में काम आते हैं।", "Panchatantra"],
      "16": ["🐦", "The crows' plan", "कौओं की युक्ति", "The crows dropped a queen's necklace into the cobra's hole; the guards came and killed the snake. Wit beats strength.", "कौओं ने रानी का हार साँप के बिल में डाल दिया; पहरेदारों ने आकर साँप मार दिया। बुद्धि बल से बड़ी है।", "Panchatantra"],
      "17": ["😴", "Missed lesson", "छूटा पाठ", "The lazy one wakes to find the lesson already over.", "आलसी जब जागता है तो पाठ समाप्त हो चुका होता है।", ""],
      "18": ["🧒", "Prahlada", "प्रह्लाद", "The boy Prahlada kept his faith in Vishnu, whatever his father threatened.", "बालक प्रह्लाद ने पिता की हर धमकी के बाद भी विष्णु में आस्था रखी।", "Bhagavata Purana 7"],
      "20": ["🧵", "Sacred thread", "उपनयन", "Upanayana: with the sacred thread, a child becomes a student.", "उपनयन: यज्ञोपवीत धारण कर बालक विद्यार्थी बनता है।", ""],
      "21": ["🛖", "Gurukul", "गुरुकुल", "Leaving home to live and learn with the teacher.", "घर छोड़कर गुरु के साथ रहना और सीखना।", ""],
      "22": ["🦁", "The lion wakes", "शेर जागा", "The lion the brothers brought to life ate them. Learning without sense is dangerous.", "भाइयों का जिलाया शेर उन्हीं को खा गया। समझ के बिना विद्या खतरनाक है।", "Panchatantra"],
      "24": ["💧", "The well", "कुआँ", "Shown 'another lion' in a well, the lion leapt at its own reflection.", "कुएँ में 'दूसरा शेर' देखकर शेर अपने ही प्रतिबिंब पर कूद पड़ा।", "Panchatantra"],
      "25": ["📿", "Gayatri", "गायत्री", "'May the divine light inspire our minds.' The student's daily prayer.", "'वह दिव्य प्रकाश हमारी बुद्धि को प्रेरित करे।' विद्यार्थी की नित्य प्रार्थना।", "Rig Veda 3.62.10"],
      "26": ["🪵", "Firewood", "समिधा", "The seeker goes to the teacher with firewood in hand, ready to serve and learn.", "जिज्ञासु हाथ में समिधा लेकर गुरु के पास जाता है, सेवा और सीखने को तैयार।", "Mundaka Upanishad 1.2.12"],
      "27": ["❓", "Six seekers", "छह जिज्ञासु", "Six seekers came to sage Pippalada. He told them to live a year in discipline before asking.", "छह जिज्ञासु ऋषि पिप्पलाद के पास आए। उन्होंने कहा, पहले एक वर्ष संयम से रहो, फिर पूछो।", "Prashna Upanishad 1.2"],
      "30": ["📖", "Speak the truth", "सत्यं वद", "Satyam vada, dharmam chara: speak the truth, live by dharma.", "सत्यं वद, धर्मं चर: सच बोलो, धर्म पर चलो।", "Taittiriya Upanishad 1.11"],
      "31": ["🔥", "Yayati's fire", "ययाति की अग्नि", "Desire is never quenched by enjoying it; it grows like a fire fed with ghee.", "भोग से इच्छा कभी शांत नहीं होती; घी डालने से अग्नि की तरह बढ़ती है।", "Mahabharata, Adi Parva"],
      "32": ["🧂", "Salt in water", "जल में नमक", "Shvetaketu could not see the salt in the water, yet tasted it in every sip. So is the Self.", "श्वेतकेतु को जल में नमक दिखा नहीं, पर हर घूँट में स्वाद था। आत्मा भी ऐसी ही है।", "Chandogya Upanishad 6.13"],
      "33": ["🌱", "Banyan seed", "बरगद का बीज", "Break the tiny seed and you see nothing. From that subtle nothing grows the great banyan.", "नन्हा बीज तोड़ो तो कुछ नहीं दिखता। उसी सूक्ष्म से विशाल बरगद उगता है।", "Chandogya Upanishad 6.12"],
      "35": ["🐎", "The chariot", "रथ", "The body is the chariot, the senses the horses, the mind the reins, the intellect the driver.", "शरीर रथ है, इंद्रियाँ घोड़े, मन लगाम और बुद्धि सारथी।", "Katha Upanishad 1.3.3–4"],
      "36": ["💎", "You are That", "तत् त्वम् असि", "'You are That, Shvetaketu,' said his father Uddalaka.", "'तुम वही हो, श्वेतकेतु,' पिता उद्दालक ने कहा।", "Chandogya Upanishad 6.8.7"],
      "37": ["🙌", "Blessing", "आशीर्वाद", "Pleased with Aruni, his teacher blessed him: all the Vedas shone in his mind.", "आरुणि से प्रसन्न होकर गुरु ने आशीर्वाद दिया: सारे वेद उसके मन में प्रकाशित हो उठे।", "Mahabharata, Adi Parva"],
      "38": ["🎓", "Graduation", "समावर्तन", "Samavartana: the student's ritual bath and return home.", "समावर्तन: विद्यार्थी का स्नान और घर वापसी।", ""],
      "40": ["🕯️", "Parting words", "दीक्षांत उपदेश", "'Never neglect study and teaching,' the teacher tells the departing student.", "'स्वाध्याय और प्रवचन में कभी प्रमाद न करना,' गुरु जाते हुए शिष्य से कहते हैं।", "Taittiriya Upanishad 1.11"],
      "41": ["💍", "Marriage", "विवाह", "Seven steps around the fire: companions for life on the path of dharma.", "अग्नि के चारों ओर सात फेरे: धर्म के मार्ग पर जीवन भर के साथी।", ""],
      "42": ["🏡", "Home", "गृह", "The householder's home feeds and supports all the other ashramas.", "गृहस्थ का घर बाकी सभी आश्रमों का पालन करता है।", "Manusmriti 3.77–78"],
      "43": ["🏹", "The bowstring", "धनुष की डोरी", "To save the meat for later, the jackal gnawed the bowstring first. The bow sprang and killed him.", "मांस बचाने के लिए सियार ने पहले धनुष की डोरी चबाई। धनुष उछला और वह मर गया।", "Panchatantra"],
      "45": ["🐄", "A thousand cows", "हज़ार गायें", "Satyakama returned with a thousand cows, his face shining like one who knows Brahman.", "सत्यकाम हज़ार गायें लेकर लौटा, उसका मुख ब्रह्मज्ञानी की तरह चमक रहा था।", "Chandogya Upanishad 4.9"],
      "46": ["⚔️", "Kurukshetra", "कुरुक्षेत्र", "A father's blind love ended in a war that destroyed the family.", "पिता के अंधे मोह का अंत उस युद्ध में हुआ जिसने कुल का नाश कर दिया।", "Mahabharata"],
      "48": ["🍛", "Food is sacred", "अन्नं ब्रह्म", "Do not despise food; make food plentiful. Food is Brahman.", "अन्न का निरादर न करो; अन्न बढ़ाओ। अन्न ब्रह्म है।", "Taittiriya Upanishad 3.7–9"],
      "49": ["🌾", "Five offerings", "पंच महायज्ञ", "Each day the householder honours the gods, the sages, the ancestors, guests and all creatures.", "गृहस्थ प्रतिदिन देवताओं, ऋषियों, पितरों, अतिथियों और सभी प्राणियों का ऋण चुकाता है।", "Manusmriti 3.70"],
      "50": ["💔", "Too late", "पछतावा", "Then she found the dead cobra: the mongoose had saved her child. Anger acts first and weeps later.", "फिर उसने मरा हुआ साँप देखा: नेवले ने बच्चे को बचाया था। क्रोध पहले करता है, बाद में पछताता है।", "Panchatantra"],
      "52": ["🎲", "The dice game", "द्यूत क्रीड़ा", "Envy led Duryodhana to the rigged game of dice, and from there to ruin.", "ईर्ष्या दुर्योधन को कपट के जुए तक ले गई, और वहाँ से विनाश तक।", "Mahabharata, Sabha Parva"],
      "53": ["🔆", "Yama teaches", "यम का उपदेश", "Moved by his resolve, Yama taught Nachiketa the secret of the deathless Self.", "उसके दृढ़ निश्चय से प्रसन्न होकर यम ने नचिकेता को अमर आत्मा का रहस्य बताया।", "Katha Upanishad 1.2"],
      "54": ["🛞", "Raikva", "रैक्व", "Raikva, the humble man sitting under his cart, knew more than the king.", "अपनी गाड़ी के नीचे बैठे साधारण रैक्व राजा से अधिक जानते थे।", "Chandogya Upanishad 4.1"],
      "56": ["🍽️", "The guest", "अतिथि", "Atithi devo bhava: honour the guest as a god.", "अतिथि देवो भव: अतिथि को देवता मानो।", "Taittiriya Upanishad 1.11"],
      "58": ["🌿", "A blade of grass", "तिनका", "Agni could not burn a blade of grass, nor Vayu blow it away. All power is Brahman's.", "अग्नि एक तिनका न जला सके, न वायु उसे उड़ा सके। सारी शक्ति ब्रह्म की है।", "Kena Upanishad 3"],
      "60": ["🧓", "Grey hair", "श्वेत केश", "When the householder sees grey hair and grandchildren, it is time for the forest.", "जब गृहस्थ के केश सफ़ेद हों और पोते-पोतियाँ दिखें, तब वन जाने का समय है।", "Manusmriti 6.2"],
      "61": ["🔁", "Begin again", "फिर से आरंभ", "Indra was not satisfied with that answer. He came back to learn, again and again, for 101 years.", "इंद्र उस उत्तर से संतुष्ट न हुए। वे बार-बार सीखने लौटे, कुल १०१ वर्ष।", "Chandogya Upanishad 8.11"],
      "63": ["🎁", "Enjoy by letting go", "त्यागपूर्वक भोग", "All this is pervaded by the Lord: enjoy it by letting go, and covet no one's wealth.", "यह सब ईश्वर से व्याप्त है: त्यागपूर्वक भोगो, किसी के धन का लोभ न करो।", "Isha Upanishad 1"],
      "64": ["🐾", "Born a deer", "हिरण का जन्म", "Thinking of the fawn at the moment of death, Bharata was reborn as a deer.", "मृत्यु के समय शावक का ध्यान करते रहने से भरत हिरण बनकर जन्मे।", "Bhagavata Purana 5.8"],
      "66": ["🌲", "To the forest", "वन की ओर", "Handing the home to the next generation, the householder turns toward the forest.", "घर अगली पीढ़ी को सौंपकर गृहस्थ वन की ओर चल पड़ता है।", ""],
      "67": ["🫂", "No hatred", "द्वेष नहीं", "One who sees all beings in the Self, and the Self in all beings, hates no one.", "जो सब प्राणियों को आत्मा में और आत्मा को सब में देखता है, वह किसी से घृणा नहीं करता।", "Isha Upanishad 6"],
      "68": ["📚", "Only words", "केवल शब्द", "Narada had mastered every scripture, yet came grieving: 'I know only words, not the Self.'", "नारद सब शास्त्र जानते थे, फिर भी दुखी होकर बोले: 'मैं केवल शब्द जानता हूँ, आत्मा नहीं।'", "Chandogya Upanishad 7.1"],
      "70": ["🪆", "Five sheaths", "पंचकोश", "The Self is wrapped in five sheaths: food, breath, mind, intellect and bliss.", "आत्मा पाँच कोशों में ढकी है: अन्न, प्राण, मन, विज्ञान और आनंद।", "Taittiriya Upanishad 2"],
      "71": ["🐈", "Unmasked", "ढोंग उजागर", "The cat's prayers were only a trap. True austerity needs no audience.", "बिल्ली की प्रार्थना केवल एक जाल थी। सच्चे तप को दर्शकों की ज़रूरत नहीं।", "Panchatantra"],
      "73": ["🌬️", "Breath", "प्राण", "The senses argued over which was greatest; when breath began to leave, all of them failed.", "इंद्रियों में श्रेष्ठता का विवाद हुआ; जब प्राण जाने लगे तो सब शिथिल हो गईं।", "Chandogya Upanishad 5.1"],
      "74": ["🛕", "Temple of the heart", "हृदय मंदिर", "In the city of the body is a small lotus-house; within it is a space as vast as the universe.", "शरीर रूपी नगर में एक छोटा कमल-गृह है; उसके भीतर ब्रह्मांड जितना विशाल आकाश है।", "Chandogya Upanishad 8.1"],
      "75": ["👑", "Nothing of mine burns", "मेरा कुछ नहीं जलता", "When Mithila was on fire, Janaka said: nothing that is truly mine is burning.", "मिथिला जल रही थी, तब जनक बोले: जो सचमुच मेरा है, उसमें से कुछ नहीं जल रहा।", "Mahabharata, Shanti Parva"],
      "76": ["🌅", "Sandhya", "संध्या", "Dawn, noon and dusk: the forest-dweller's day turns around prayer.", "प्रातः, मध्याह्न और संध्या: वानप्रस्थी का दिन उपासना के चारों ओर घूमता है।", ""],
      "78": ["💞", "For the Self", "आत्मा के लिए", "'It is not for the husband's sake that a husband is dear, but for the sake of the Self.'", "'पति, पति के लिए प्रिय नहीं होता, आत्मा के लिए प्रिय होता है।'", "Brihadaranyaka Upanishad 2.4.5"],
      "79": ["🎯", "Bow and arrow", "धनुष-बाण", "Om is the bow, the self is the arrow, and Brahman is the target.", "प्रणव धनुष है, आत्मा बाण है और ब्रह्म लक्ष्य है।", "Mundaka Upanishad 2.2.4"],
      "80": ["🧡", "Saffron robe", "भगवा वस्त्र", "Taking sannyasa: the last fire, the saffron robe, a new name.", "संन्यास दीक्षा: अंतिम अग्नि, भगवा वस्त्र, नया नाम।", ""],
      "81": ["🍃", "Neti neti", "नेति नेति", "Not this, not this: the Self is beyond every description.", "यह नहीं, यह नहीं: आत्मा हर वर्णन से परे है।", "Brihadaranyaka Upanishad 2.3.6"],
      "82": ["🌙", "Four states", "चार अवस्थाएँ", "Waking, dreaming, deep sleep, and the fourth, Turiya, beyond them all.", "जाग्रत, स्वप्न, सुषुप्ति, और इन सबसे परे चौथी, तुरीय।", "Mandukya Upanishad 3–7"],
      "83": ["🌌", "Immortality", "अमृतत्व", "Yajnavalkya taught Maitreyi the way to immortality, then left for the forest.", "याज्ञवल्क्य ने मैत्रेयी को अमृतत्व का मार्ग बताया और वन चले गए।", "Brihadaranyaka Upanishad 4.5"],
      "84": ["🥣", "Alms", "भिक्षा", "The renunciate asks only for today's food and keeps nothing more.", "संन्यासी केवल आज का भोजन माँगता है, और कुछ नहीं रखता।", ""],
      "86": ["❔", "By whom?", "केन?", "By whom is the mind sent forth? By whom does the eye see?", "किसके द्वारा मन प्रेरित होता है? किससे आँख देखती है?", "Kena Upanishad 1.1"],
      "87": ["🌞", "The golden lid", "स्वर्ण पात्र", "The face of truth is covered by a golden disc. Uncover it, O Pushan, so I may see.", "सत्य का मुख सोने के पात्र से ढका है। हे पूषन्, उसे हटाओ ताकि मैं देख सकूँ।", "Isha Upanishad 15"],
      "89": ["🌕", "Bliss", "आनंद", "At last Bhrigu knew: Brahman is bliss. From bliss all beings are born.", "अंत में भृगु ने जाना: ब्रह्म आनंद है। आनंद से ही सब प्राणी जन्मते हैं।", "Taittiriya Upanishad 3.6"],
      "90": ["🪔", "Lead me to light", "तमसो मा ज्योतिर्गमय", "Lead me from the unreal to the real, from darkness to light, from death to immortality.", "असत् से सत् की ओर, तम से ज्योति की ओर, मृत्यु से अमृत की ओर ले चलो।", "Brihadaranyaka Upanishad 1.3.28"],
      "91": ["🧠", "Prajnanam Brahma", "प्रज्ञानं ब्रह्म", "Consciousness is Brahman.", "चेतना ही ब्रह्म है।", "Aitareya Upanishad 3.3"],
      "92": ["💫", "Aham Brahmasmi", "अहं ब्रह्मास्मि", "I am Brahman.", "मैं ब्रह्म हूँ।", "Brihadaranyaka Upanishad 1.4.10"],
      "94": ["🐦", "The watching bird", "साक्षी पक्षी", "When the bird that eats sees the other, the witness, as its own glory, its grief ends.", "जब फल खाने वाला पक्षी दूसरे, साक्षी पक्षी को अपनी ही महिमा जानता है, तो उसका शोक मिट जाता है।", "Mundaka Upanishad 3.1.2"],
      "95": ["🌀", "Ayam Atma Brahma", "अयमात्मा ब्रह्म", "This Self is Brahman.", "यह आत्मा ब्रह्म है।", "Mandukya Upanishad 2"],
      "96": ["🌍", "All is Brahman", "सर्वं खल्विदं ब्रह्म", "All this, truly, is Brahman.", "यह सब कुछ निश्चय ही ब्रह्म है।", "Chandogya Upanishad 3.14.1"],

    "4": {
      iast: "Annaprāśana",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would ask what this rite actually does. Its answer: the injunction is the Veda's real content, and the result arrives later through apūrva, an unseen potency.", hi: "मीमांसा पूछती कि यह संस्कार वास्तव में करता क्या है। उसका उत्तर: विधि ही वेद का असली विषय है, और फल बाद में अपूर्व से, एक अदृश्य शक्ति से, आता है।" }],
      scholar: { en: "The household manuals list about sixteen rites of passage (saṃskāra), and their lists differ. The same word, saṃskāra, later means an impression left on the mind, which the board will come back to.", hi: "गृह्यसूत्र लगभग सोलह संस्कार गिनाते हैं, और उनकी सूचियाँ भिन्न हैं। यही शब्द, संस्कार, आगे चलकर मन पर पड़ी छाप का अर्थ भी देता है, जिस पर बोर्ड लौटेगा।" }
    },
    "5": {
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.14: practice becomes firm only when kept up for a long time, without a break, and with care. Falling and getting up is the method, not a failure of it.", hi: "योगसूत्र १.१४: अभ्यास तभी दृढ़ होता है जब लंबे समय तक, निरंतर और आदर के साथ किया जाए। गिरना और उठना ही विधि है, उसकी विफलता नहीं।" }]
    },
    "6": {
      iast: "Maitrī",
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.33: meet the happy with friendliness and the suffering with compassion, and the mind grows clear.", hi: "योगसूत्र १.३३: सुखी के प्रति मैत्री और दुःखी के प्रति करुणा रखो, तो चित्त प्रसन्न होता है।" }, { id: "bauddha", en: "For the Buddhists, mettā is the first of four boundless states, to be extended outward until it reaches every being.", hi: "बौद्धों के लिए मैत्री चार अपरिमित भावों में पहली है, जिसे बाहर की ओर फैलाते जाना है जब तक वह हर प्राणी तक न पहुँचे।" }],
      scholar: { en: "From the Panchatantra's second book, 'The winning of friends'. The four animals each save the others once: friendship here is a network, not a pair.", hi: "पंचतंत्र की दूसरी पुस्तक, 'मित्रसंप्राप्ति' से। चारों पशु एक-एक बार दूसरों को बचाते हैं: यहाँ मित्रता एक जाल है, जोड़ा नहीं।" }
    },
    "8": {
      scholar: { en: "The geese warned the tortoise not to speak. The story is in the Panchatantra's first book, and also among the Buddhist Jātakas, where the moral is the same.", hi: "हंसों ने कछुए को बोलने से मना किया था। यह कथा पंचतंत्र की पहली पुस्तक में है, और बौद्ध जातकों में भी, जहाँ सीख वही है।" }
    },
    "9": {
      scholar: { en: "The frame story: King Amaraśakti despaired of his three sons, and the old Viṣṇuśarman promised to teach them statecraft in six months. Every fable on the board is part of that one lesson.", hi: "कथा का ढाँचा: राजा अमरशक्ति अपने तीन पुत्रों से निराश थे, और वृद्ध विष्णु शर्मा ने छह महीने में उन्हें नीति सिखाने का वचन दिया। बोर्ड की हर कथा उसी एक पाठ का अंश है।" },
      figures: ["vishnusharma"]
    },
    "10": {
      schools: [{ id: "mimamsa", en: "Mīmāṃsā held that words and their meanings are eternal, and the Veda authorless, so its testimony can be trusted with no speaker to vouch for it.", hi: "मीमांसा मानती थी कि शब्द और अर्थ का संबंध नित्य है, और वेद अपौरुषेय, इसलिए उसकी गवाही पर बिना किसी वक्ता के भरोसा किया जा सकता है।" }, { id: "nyaya", en: "Nyāya disagreed: meaning is a convention, and testimony is only as good as its speaker. The Veda is reliable because God, a reliable speaker, composed it.", hi: "न्याय असहमत था: अर्थ एक संकेत (परंपरा) है, और गवाही उतनी ही अच्छी जितना उसका वक्ता। वेद प्रमाण है क्योंकि उसे एक आप्त वक्ता, ईश्वर, ने रचा।" }]
    },
    "11": {
      schools: [{ id: "nyaya", en: "Nyāya would call the blue fur a false sign: it did not always go with kingship. The howl was a true sign, because a jackal's howl always goes with a jackal.", hi: "न्याय नीले रंग को हेत्वाभास कहता: वह हमेशा राजा होने के साथ नहीं जाता। हुआँ-हुआँ सच्चा हेतु था, क्योंकि सियार की आवाज़ हमेशा सियार के साथ होती है।" }]
    },
    "12": {
      iast: "Buddhi",
      scholar: { en: "The hare told the lion of a rival lion in the well. In Sāṃkhya, buddhi is the intellect, the first thing to arise from matter, before even the sense of 'I'.", hi: "खरगोश ने शेर को कुएँ में दूसरे शेर की बात बताई। सांख्य में बुद्धि प्रकृति से उत्पन्न होने वाला पहला तत्त्व है, 'मैं' के भाव से भी पहले।" }
    },
    "13": {
      scholar: { en: "This is the frame story of the Panchatantra's fourth book, 'Loss of what was gained'. The crocodile had the monkey on its back and talked too soon.", hi: "यह पंचतंत्र की चौथी पुस्तक, 'लब्धप्रणाश', की मुख्य कथा है। मगरमच्छ की पीठ पर बंदर था और वह जल्दी बोल पड़ा।" }
    },
    "14": {
      iast: "Vācālatā",
      schools: [{ id: "jaina", en: "Jain monks keep three guards (gupti): over the mind, the body and speech. Guarding speech means not speaking unless it is needed.", hi: "जैन मुनि तीन गुप्तियाँ रखते हैं: मन, काया और वचन की। वचन-गुप्ति का अर्थ है बिना आवश्यकता के न बोलना।" }]
    },
    "16": {
      scholar: { en: "A story inside a story in the Panchatantra's first book, told by a jackal to show that a clever plan beats a stronger enemy.", hi: "पंचतंत्र की पहली पुस्तक में कथा के भीतर कथा, जिसे एक सियार यह दिखाने को कहता है कि चतुर योजना बलवान शत्रु को हरा देती है।" }
    },
    "17": {
      schools: [{ id: "samkhya", en: "Sāṃkhya has a name for the heaviness that keeps you asleep: tamas, the strand of inertia woven into all matter. It is not a sin. It is weight.", hi: "सांख्य के पास उस भारीपन का नाम है जो आपको सुलाए रखता है: तमस्, जड़ता का गुण जो सारी प्रकृति में बुना है। यह पाप नहीं है। यह भार है।" }]
    },
    "18": {
      schools: [{ id: "dvaita", en: "For Madhva, Prahlāda shows what bhakti is for: the devotee does not save himself. Viṣṇu does, by grace, when the pillar breaks open.", hi: "मध्व के लिए प्रह्लाद दिखाते हैं कि भक्ति किसलिए है: भक्त स्वयं को नहीं बचाता। खंभा फटने पर विष्णु बचाते हैं, कृपा से।" }],
      scholar: { en: "His father Hiraṇyakaśipu tried poison, elephants, fire and a cliff. Viṣṇu came as Narasiṃha, half man and half lion, at dusk, on a threshold: neither inside nor outside.", hi: "उसके पिता हिरण्यकशिपु ने विष, हाथी, अग्नि और पहाड़ से गिराना, सब आज़माया। विष्णु नरसिंह बनकर आए, आधे मनुष्य आधे सिंह, संध्या के समय, देहरी पर: न भीतर, न बाहर।" }
    },
    "19": {
      iast: "Asatya",
      schools: [{ id: "yoga", en: "Yoga Sūtra 2.36: when someone is established in truthfulness, what they say comes to pass. The jackal had the reverse: his word made nothing true.", hi: "योगसूत्र २.३६: जो सत्य में प्रतिष्ठित हो, उसकी वाणी फलित होती है। सियार के साथ उल्टा था: उसके कहने से कुछ भी सच नहीं हुआ।" }],
      scholar: { en: "The blue jackal is in the Panchatantra's first book. Satya, truthfulness, is the second of Yoga's five restraints and of the Jains' five great vows.", hi: "नीला सियार पंचतंत्र की पहली पुस्तक में है। सत्य योग के पाँच यमों में दूसरा है, और जैनों के पाँच महाव्रतों में भी।" }
    },
    "20": {
      iast: "Upanayana",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā asks who is entitled (adhikārin) to perform a rite. Upanayana is where that entitlement begins, and who it shut out was argued over for centuries.", hi: "मीमांसा पूछती है कि कर्म करने का अधिकारी कौन है। उपनयन से वह अधिकार आरंभ होता है, और इसने किसे बाहर रखा, इस पर सदियों बहस हुई।" }],
      scholar: { en: "Called the second birth: a twice-born (dvija) is one who has received the thread. The Gṛhya Sūtras restricted it by varṇa; reformers from the medieval bhakti poets onward challenged that.", hi: "इसे दूसरा जन्म कहा गया: द्विज वह है जिसने यज्ञोपवीत पाया। गृह्यसूत्रों ने इसे वर्ण से सीमित किया; मध्यकाल के भक्त कवियों से लेकर आगे के सुधारकों ने इसे चुनौती दी।" }
    },
    "21": {
      iast: "Gurukula"
    },
    "22": {
      scholar: { en: "From the Panchatantra's fifth book. The lesson is aimed at the princes who are hearing it: a learned fool is more dangerous than an ignorant one.", hi: "पंचतंत्र की पाँचवीं पुस्तक से। यह सीख उन राजकुमारों के लिए है जो इसे सुन रहे हैं: विद्वान मूर्ख, अनपढ़ मूर्ख से अधिक खतरनाक है।" }
    },
    "23": {
      iast: "Guru-bhakti",
      scholar: { en: "Āruṇi of Pāñcāla was a student of Āyoda Dhaumya, in the Pauṣya Parva of the Mahābhārata. His teacher renamed him Uddālaka, 'the one who rose up', when he got up out of the breach.", hi: "पांचाल के आरुणि आयोद धौम्य के शिष्य थे, महाभारत के पौष्य पर्व में। जब वे मेड़ से उठकर निकले, तो गुरु ने उनका नाम उद्दालक रखा, 'जो ऊपर उठा'।" }
    },
    "24": {
      schools: [{ id: "advaita", en: "Advaita has a word for what the lion did: adhyāsa, superimposition, taking one thing for another. Taking the body for the Self, it says, is the same leap at a reflection.", hi: "अद्वैत के पास शेर की गलती का शब्द है: अध्यास, एक को दूसरा मान लेना। शरीर को आत्मा मान लेना, वह कहता है, प्रतिबिंब पर वही छलाँग है।" }]
    },
    "25": {
      iast: "Gāyatrī",
      scholar: { en: "Ṛg Veda 3.62.10, seen by the sage Viśvāmitra and addressed to Savitṛ, the sun as the one who sets things moving. It is named for its metre, gāyatrī, three lines of eight syllables.", hi: "ऋग्वेद ३.६२.१०, ऋषि विश्वामित्र द्वारा दृष्ट, सविता को संबोधित, वह सूर्य जो सबको गति देता है। इसका नाम इसके छंद, गायत्री, से है: आठ-आठ अक्षरों की तीन पंक्तियाँ।" }
    },
    "26": {
      iast: "Samit-pāṇi",
      schools: [{ id: "advaita", en: "Śaṅkara read this verse strictly: the Self is known from scripture heard from a teacher, not worked out alone. Even the most learned must go with fuel in hand.", hi: "शंकर ने इस मंत्र को कठोरता से पढ़ा: आत्मा गुरु से सुने शास्त्र से जानी जाती है, अकेले सोचकर नहीं। सबसे विद्वान को भी हाथ में समिधा लेकर जाना होता है।" }]
    },
    "27": {
      scholar: { en: "The six asked where beings come from, which powers hold up the body, where breath comes from, what sleeps and what wakes, what meditating on Om attains, and who the person of sixteen parts is.", hi: "छहों ने पूछा: प्राणी कहाँ से आते हैं, कौन सी शक्तियाँ शरीर को धारण करती हैं, प्राण कहाँ से आता है, कौन सोता है और कौन जागता है, ॐ के ध्यान से क्या मिलता है, और सोलह कलाओं वाला पुरुष कौन है।" }
    },
    "28": {
      iast: "Satya",
      scholar: { en: "His mother Jabālā had told him: 'I do not know your lineage. You are Satyakāma, son of Jabālā.' The teacher Gautama accepted him, saying only a true brahmin would speak so plainly.", hi: "उसकी माँ जबाला ने कहा था: 'मैं तुम्हारा गोत्र नहीं जानती। तुम सत्यकाम जाबाल हो।' गुरु गौतम ने उसे यह कहकर स्वीकार किया कि इतना सीधा सच कोई सच्चा ब्राह्मण ही बोलेगा।" }
    },
    "29": {
      iast: "Ālasya",
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.30 lists nine obstacles that scatter the mind. Sloth, ālasya, is the fifth, right after doubt and carelessness.", hi: "योगसूत्र १.३० चित्त को बिखेरने वाले नौ विघ्न गिनाता है। आलस्य पाँचवाँ है, संशय और प्रमाद के ठीक बाद।" }]
    },
    "30": {
      iast: "Satyaṃ vada, dharmaṃ cara",
      schools: [{ id: "mimamsa", en: "Note the grammar: commands. For Mīmāṃsā that is the whole point. Dharma is what the Veda enjoins (Mīmāṃsā Sūtra 1.1.2), not what anyone feels to be right.", hi: "व्याकरण देखिए: आज्ञाएँ। मीमांसा के लिए यही सार है। धर्म वह है जिसकी वेद विधि करता है (मीमांसासूत्र १.१.२), वह नहीं जो किसी को सही लगे।" }]
    },
    "31": {
      schools: [{ id: "carvaka", en: "The Cārvāka reply, at full strength: would you throw away the rice because it comes in husks? Pleasure always comes mixed with pain, and that is a reason to husk carefully, not to stop eating.", hi: "चार्वाक का उत्तर, पूरी ताकत से: क्या भूसी के कारण चावल फेंक दोगे? सुख हमेशा दुःख के साथ आता है, और यह सावधानी से कूटने का कारण है, खाना छोड़ने का नहीं।" }],
      scholar: { en: "Yayāti's verse, 'na jātu kāmaḥ kāmānām upabhogena śāmyati', is one of the most quoted lines in Sanskrit. Manu repeats it (2.94).", hi: "ययाति का श्लोक, 'न जातु कामः कामानामुपभोगेन शाम्यति', संस्कृत की सबसे अधिक उद्धृत पंक्तियों में से है। मनु इसे दोहराते हैं (२.९४)।" }
    },
    "32": {
      schools: [{ id: "advaita", en: "Advaita takes the lesson at its word: the Self pervades you as salt pervades water, everywhere and nowhere in particular.", hi: "अद्वैत इस पाठ को शब्दशः लेता है: आत्मा आपमें वैसे ही व्याप्त है जैसे जल में नमक, हर जगह और किसी एक जगह नहीं।" }, { id: "nyaya", en: "Nyāya would add: the Self is not seen either, but it can be inferred from its marks, which are desire, aversion, effort, pleasure, pain and knowing (Nyāya Sūtra 1.1.10).", hi: "न्याय जोड़ता: आत्मा भी दिखती नहीं, पर उसके लक्षणों से उसका अनुमान होता है: इच्छा, द्वेष, प्रयत्न, सुख, दुःख और ज्ञान (न्यायसूत्र १.१.१०)।" }],
      figures: ["uddalaka"]
    },
    "33": {
      schools: [{ id: "samkhya", en: "Sāṃkhya: the tree was already in the seed. An effect pre-exists in its cause (satkāryavāda); otherwise, why does oil come from sesame and never from sand?", hi: "सांख्य: वृक्ष पहले से बीज में था। कार्य कारण में पहले से रहता है (सत्कार्यवाद); नहीं तो तेल तिल से ही क्यों निकलता है, रेत से कभी क्यों नहीं?" }, { id: "vaisheshika", en: "Vaiśeṣika: no, the tree is new. Atoms combine into a whole that did not exist before (asatkāryavāda). If the tree were already there, why plant anything?", hi: "वैशेषिक: नहीं, वृक्ष नया है। परमाणु मिलकर एक ऐसा संपूर्ण बनाते हैं जो पहले नहीं था (असत्कार्यवाद)। यदि वृक्ष पहले से था, तो कुछ बोना ही क्यों?" }],
      figures: ["uddalaka", "kapila"]
    },
    "34": {
      iast: "Śraddhā",
      scholar: { en: "It began with a hollow sacrifice: his father Vājaśravas gave away cows too old to give milk. 'To whom will you give me?' the boy asked, three times. 'To Death,' said his father, and the boy went.", hi: "यह एक खोखले यज्ञ से शुरू हुआ: उसके पिता वाजश्रवा ने ऐसी गायें दान कीं जो दूध देने लायक नहीं थीं। 'मुझे किसे दोगे?' बालक ने तीन बार पूछा। 'मृत्यु को,' पिता बोले, और बालक चला गया।" }
    },
    "35": {
      schools: [{ id: "samkhya", en: "The Katha's ladder goes on: beyond the senses the mind, beyond the mind the intellect, beyond that the unmanifest, then the Person. Sāṃkhya would later count these as its tattvas.", hi: "कठ की सीढ़ी आगे जाती है: इंद्रियों से परे मन, मन से परे बुद्धि, उससे परे अव्यक्त, फिर पुरुष। सांख्य ने आगे चलकर इन्हें अपने तत्त्वों में गिना।" }]
    },
    "36": {
      iast: "Tat tvam asi",
      views: [{ id: "advaita", en: "Śaṅkara: identity. 'You' minus the body and mind is the same as 'That', Brahman. Nothing is joined; an error is removed.", hi: "शंकर: अभेद। शरीर और मन हटाकर 'तुम' वही है जो 'तत्', ब्रह्म। कुछ जुड़ता नहीं; एक भूल मिटती है।" }, { id: "vishishtadvaita", en: "Rāmānuja: 'you' is a mode of Brahman, as a body is of its indweller. One reality, with real differences inside it.", hi: "रामानुज: 'तुम' ब्रह्म का एक प्रकार है, जैसे शरीर अपने अंतर्यामी का। एक सत्य, जिसके भीतर वास्तविक भेद हैं।" }, { id: "dvaita", en: "Madhva splits the sandhi differently: 'sa ātmā atat tvam asi', you are not That. The soul is like God, and forever distinct.", hi: "मध्व संधि को अलग तोड़ते हैं: 'स आत्मा अतत् त्वम् असि', तुम वह नहीं हो। जीव ईश्वर जैसा है, पर सदा भिन्न।" }],
      scholar: { en: "Uddālaka says it nine times, at the end of nine lessons. One sentence of four syllables, and Vedānta splits three ways over it, all reading the same text with the same care.", hi: "उद्दालक इसे नौ बार कहते हैं, नौ पाठों के अंत में। चार अक्षरों का एक वाक्य, और वेदांत इस पर तीन ओर बँट जाता है, सब एक ही पाठ को उतनी ही सावधानी से पढ़ते हुए।" },
      figures: ["uddalaka", "shankara", "ramanuja", "madhva"]
    },
    "38": {
      iast: "Samāvartana",
      scholar: { en: "The returning student is a snātaka, 'one who has bathed'. The bath marks the end of brahmacarya and the start of eligibility to marry.", hi: "लौटता विद्यार्थी स्नातक कहलाता है, 'जिसने स्नान किया'। यह स्नान ब्रह्मचर्य का अंत और विवाह की पात्रता का आरंभ है।" }
    },
    "39": {
      iast: "Vidyā-mada",
      schools: [{ id: "nyaya", en: "Nyāya ranked kinds of debate: honest inquiry (vāda), arguing to win (jalpa), and pure demolition with no thesis of your own (vitaṇḍā). The three brothers had learning without vāda.", hi: "न्याय ने कथा के प्रकार गिनाए: सच्ची जिज्ञासा (वाद), जीतने के लिए तर्क (जल्प), और अपना पक्ष रखे बिना केवल खंडन (वितंडा)। तीन भाइयों के पास विद्या थी, वाद नहीं।" }]
    },
    "40": {
      iast: "Svādhyāya",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā starts here. 'One's own Veda must be studied' (svādhyāyo 'dhyetavyaḥ) is the injunction its commentators take as the ground of the whole inquiry.", hi: "मीमांसा यहीं से शुरू होती है। 'स्वाध्यायोऽध्येतव्यः' (अपने वेद का अध्ययन करना चाहिए) वह विधि है जिसे इसके भाष्यकार पूरी जिज्ञासा का आधार मानते हैं।" }]
    },
    "41": {
      iast: "Vivāha · saptapadī",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā debated who may sacrifice and concluded that the householder does so jointly with his wife. The fire of the wedding is the fire of their rites.", hi: "मीमांसा ने विचार किया कि यज्ञ कौन कर सकता है और निष्कर्ष निकाला कि गृहस्थ अपनी पत्नी के साथ मिलकर करता है। विवाह की अग्नि ही उनके यज्ञों की अग्नि है।" }]
    },
    "42": {
      iast: "Gṛha",
      scholar: { en: "Manu calls the householder the highest āśrama, because all the others live on what it gives. The same text's rules on caste and on women have been contested from its own time to now.", hi: "मनु गृहस्थ को सबसे श्रेष्ठ आश्रम कहते हैं, क्योंकि बाकी सब उसी के दिए पर जीते हैं। इसी ग्रंथ के जाति और स्त्रियों संबंधी नियम अपने समय से आज तक विवादित रहे हैं।" }
    },
    "44": {
      iast: "Dāna · datta",
      schools: [{ id: "bauddha", en: "In Buddhism, generosity (dāna) is the first of the perfections. Its fruit is less in what is given than in the loosening of the hand that gives.", hi: "बौद्ध धर्म में दान पहली पारमिता है। इसका फल दी गई वस्तु में कम, देने वाले हाथ की पकड़ ढीली होने में अधिक है।" }],
      scholar: { en: "Prajāpati's children came for teaching and he said one syllable, 'da'. The gods heard dāmyata, be restrained; humans heard datta, give; the asuras heard dayadhvam, be compassionate. The thunder still says it: da da da.", hi: "प्रजापति की संतानें उपदेश के लिए आईं और उन्होंने एक अक्षर कहा, 'द'। देवों ने सुना दाम्यत, संयम करो; मनुष्यों ने दत्त, दान करो; असुरों ने दयध्वम्, दया करो। मेघ आज भी यही कहता है: द द द।" }
    },
    "45": {
      scholar: { en: "His teacher sent him off with four hundred thin cows and he stayed away until they were a thousand. On the way back a bull, a fire, a swan and a diver-bird each taught him a quarter of Brahman.", hi: "गुरु ने उसे चार सौ दुबली गायों के साथ भेजा और वह तब तक लौटा नहीं जब तक वे हज़ार न हो गईं। लौटते हुए एक बैल, अग्नि, हंस और जलपक्षी ने उसे ब्रह्म का एक-एक पाद सिखाया।" }
    },
    "46": {
      scholar: { en: "Kurukṣetra is also where the Bhagavad Gītā is spoken, to a man refusing to fight his own family. The board puts the war on the snake's tail; the Gītā puts it at the start of a teaching.", hi: "कुरुक्षेत्र वही स्थान है जहाँ भगवद्गीता कही गई, उस व्यक्ति से जो अपने ही परिवार से लड़ने से मना कर रहा था। बोर्ड युद्ध को साँप की पूँछ पर रखता है; गीता उसे एक उपदेश के आरंभ में।" }
    },
    "47": {
      iast: "Kāma",
      schools: [{ id: "bauddha", en: "The Buddha's second noble truth names it: suffering arises from craving (taṇhā), and craving is exactly the fire Yayāti kept feeding.", hi: "बुद्ध का दूसरा आर्य सत्य इसका नाम लेता है: दुःख तृष्णा से उत्पन्न होता है, और तृष्णा ठीक वही आग है जिसे ययाति खिलाते रहे।" }],
      scholar: { en: "Kāma is also one of the four aims of life (puruṣārtha), alongside dharma, artha and mokṣa. The snake is craving; the aim is desire kept within dharma.", hi: "काम जीवन के चार पुरुषार्थों में से भी एक है, धर्म, अर्थ और मोक्ष के साथ। साँप तृष्णा है; पुरुषार्थ धर्म की सीमा में रखी गई इच्छा है।" }
    },
    "48": {
      iast: "Annaṃ brahma",
      schools: [{ id: "carvaka", en: "Cārvāka would happily agree that the body is food, then stop there: the self is this body, and the Upaniṣad's further sheaths are a story told on top of it.", hi: "चार्वाक खुशी से मानता कि शरीर अन्न है, फिर वहीं रुक जाता: आत्मा यही शरीर है, और उपनिषद् के आगे के कोश उसके ऊपर कही गई कथा हैं।" }]
    },
    "49": {
      iast: "Pañca mahāyajña",
      schools: [{ id: "mimamsa", en: "For Mīmāṃsā these are nitya karma, obligatory daily rites. You do them because they are enjoined; skipping them is a fault, and doing them earns no special reward.", hi: "मीमांसा के लिए ये नित्य कर्म हैं, अनिवार्य दैनिक कर्तव्य। आप इन्हें इसलिए करते हैं क्योंकि इनकी विधि है; छोड़ना दोष है, और करने से कोई विशेष फल नहीं मिलता।" }]
    },
    "51": {
      iast: "Dayā · dayadhvam",
      schools: [{ id: "jaina", en: "For the Jains compassion reaches every living thing, down to the beings in water and air. Monks sweep the ground before they step so as not to crush what lives there.", hi: "जैनों के लिए दया हर प्राणी तक जाती है, जल और वायु के जीवों तक भी। मुनि कदम रखने से पहले ज़मीन बुहारते हैं ताकि वहाँ रहने वाले जीव न कुचलें।" }]
    },
    "52": {
      scholar: { en: "Dice were an old danger. Ṛg Veda 10.34 is a gambler's lament: his wife has left, his mother-in-law hates him, and still the brown dice call him back to the board.", hi: "जुआ पुराना खतरा था। ऋग्वेद १०.३४ एक जुआरी का विलाप है: पत्नी छोड़ गई, सास घृणा करती है, फिर भी भूरे पासे उसे बार-बार बिसात पर बुलाते हैं।" }
    },
    "53": {
      schools: [{ id: "advaita", en: "Yama's verse, 'it is not born, it does not die' (Katha 1.2.18), returns in the Gītā (2.20). For Advaita it is the plainest statement that the Self was never in danger.", hi: "यम का मंत्र, 'न जायते म्रियते वा' (कठ १.२.१८), गीता (२.२०) में लौटता है। अद्वैत के लिए यह सबसे सीधा कथन है कि आत्मा कभी संकट में थी ही नहीं।" }],
      scholar: { en: "Death offered him every pleasure first: chariots, music, long life. 'Keep them,' said Naciketas. 'They wear out the senses.' Only then did Yama teach.", hi: "मृत्यु ने पहले उसे हर सुख दिया: रथ, संगीत, लंबी आयु। 'इन्हें रखिए,' नचिकेता ने कहा। 'ये इंद्रियों को घिसते हैं।' तभी यम ने उपदेश दिया।" }
    },
    "54": {
      scholar: { en: "King Jānaśruti brought cows, a necklace and a chariot. Raikva, scratching his sores under his cart, sent him back with 'keep them, śūdra'. He taught the doctrine of absorption (saṃvarga): wind takes in all things, and breath takes in all the senses.", hi: "राजा जानश्रुति गायें, हार और रथ लेकर आए। अपनी गाड़ी के नीचे खुजली खुजाते रैक्व ने उन्हें 'हे शूद्र, इन्हें रखो' कहकर लौटा दिया। उन्होंने संवर्ग विद्या सिखाई: वायु सब कुछ अपने में समेटता है, और प्राण सब इंद्रियों को।" }
    },
    "55": {
      iast: "Lobha",
      schools: [{ id: "jaina", en: "The fifth Jain vow, aparigraha, non-possession, is the cure the jackal never tried: own as little as you can, and hold even that loosely.", hi: "जैनों का पाँचवाँ व्रत, अपरिग्रह, वह इलाज है जो सियार ने कभी नहीं आज़माया: जितना कम हो सके उतना रखो, और उसे भी ढीले हाथ से।" }]
    },
    "56": {
      iast: "Atithi devo bhava",
      scholar: { en: "A-tithi means one without a date: the guest who arrives unannounced. Feeding the guest is one of the five daily offerings of square 49.", hi: "अ-तिथि का अर्थ है जिसकी कोई तिथि न हो: बिना बताए आने वाला। अतिथि को खिलाना खाना ४९ के पंच महायज्ञों में से एक है।" }
    },
    "57": {
      iast: "Dharma",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would hold Janaka up as the model: keep doing your duties, and the duties themselves are the good.", hi: "मीमांसा जनक को आदर्श मानती: अपने कर्तव्य करते रहो, कर्तव्य ही स्वयं श्रेय हैं।" }, { id: "advaita", en: "Śaṅkara would answer that Janaka acted because he was already free, not in order to become free. Action can purify the mind; only knowledge liberates.", hi: "शंकर उत्तर देते कि जनक कर्म इसलिए करते थे क्योंकि वे पहले से मुक्त थे, मुक्त होने के लिए नहीं। कर्म मन को शुद्ध कर सकता है; मुक्ति केवल ज्ञान से है।" }],
      scholar: { en: "The Gītā (3.20) cites Janaka as one who reached perfection through action itself. Whether action and knowledge can be combined was one of the long quarrels of Vedānta.", hi: "गीता (३.२०) जनक का उदाहरण देती है जिन्होंने कर्म से ही सिद्धि पाई। कर्म और ज्ञान मिलाए जा सकते हैं या नहीं, यह वेदांत के लंबे विवादों में से एक था।" },
      figures: ["yajnavalkya"]
    },
    "58": {
      schools: [{ id: "nyaya", en: "Nyāya would read the blade of grass as evidence: a world this ordered needs a maker, and that maker can be inferred the way a pot implies a potter.", hi: "न्याय तिनके को प्रमाण की तरह पढ़ता: इतने व्यवस्थित जगत को एक कर्ता चाहिए, और उसका अनुमान वैसे ही होता है जैसे घड़े से कुम्हार का।" }, { id: "mimamsa", en: "Mīmāṃsā would refuse: no creator is needed at all. The world has always been as it is, and the Veda's rites work on their own.", hi: "मीमांसा इनकार करती: किसी सृष्टिकर्ता की आवश्यकता ही नहीं। जगत सदा से ऐसा ही है, और वेद के कर्म अपने आप फल देते हैं।" }],
      scholar: { en: "The Yakṣa vanished and in its place stood Umā Haimavatī, who told the gods that the victory had been Brahman's. In the Kena she is the first teacher of Brahman.", hi: "यक्ष अंतर्धान हो गया और उसकी जगह उमा हैमवती खड़ी थीं, जिन्होंने देवताओं को बताया कि विजय ब्रह्म की थी। केन में वे ब्रह्म की पहली उपदेशिका हैं।" }
    },
    "59": {
      iast: "Krodha",
      schools: [{ id: "yoga", en: "Yoga Sūtra 2.33 gives the method the brahmin's wife needed: when a harmful thought rises, cultivate its opposite (pratipakṣa-bhāvanā) before you act on it.", hi: "योगसूत्र २.३३ वह विधि देता है जो ब्राह्मणी को चाहिए थी: जब कोई हिंसक विचार उठे, तो उस पर कर्म करने से पहले उसके विपरीत भाव (प्रतिपक्ष-भावना) को साधो।" }]
    },
    "61": {
      scholar: { en: "Prajāpati taught Indra in stages: first that the Self is the body, then the dreaming self, then the self in deep sleep, and at last the Self that is none of these. Indra rejected each answer until the last, which took 101 years in all.", hi: "प्रजापति ने इंद्र को क्रम से सिखाया: पहले कि आत्मा शरीर है, फिर स्वप्न का आत्मा, फिर सुषुप्ति का, और अंत में वह आत्मा जो इनमें से कोई नहीं। इंद्र ने अंतिम से पहले हर उत्तर को अस्वीकार किया, जिसमें कुल १०१ वर्ष लगे।" }
    },
    "62": {
      iast: "Moha",
      schools: [{ id: "yoga", en: "Yoga names attachment (rāga) as the affliction that follows pleasure (Yoga Sūtra 2.7). Dhṛtarāṣṭra's love for his son was real; it was the clinging that blinded him twice.", hi: "योग राग को वह क्लेश कहता है जो सुख के पीछे आता है (योगसूत्र २.७)। धृतराष्ट्र का पुत्र-प्रेम सच्चा था; उस पकड़ ने उन्हें दोबारा अंधा कर दिया।" }]
    },
    "63": {
      iast: "Tena tyaktena bhuñjīthāḥ",
      scholar: { en: "The verse can be read two ways. Śaṅkara takes 'tyaktena' as renunciation: protect the Self by giving everything up. Others read it as 'with what has been left to you': enjoy what the Lord has allotted, and want nothing more.", hi: "इस मंत्र को दो तरह पढ़ा जा सकता है। शंकर 'त्यक्तेन' को त्याग के रूप में लेते हैं: सब छोड़कर आत्मा की रक्षा करो। दूसरे इसे 'जो तुम्हें छोड़ा गया है उससे' पढ़ते हैं: ईश्वर ने जो दिया उसका भोग करो, और अधिक की इच्छा मत करो।" },
      figures: ["shankara"]
    },
    "64": {
      schools: [{ id: "carvaka", en: "The Cārvāka verse: 'once the body is ash, how can it ever return?' There was no Bharata left to become a deer; only a story that needs someone to be reborn.", hi: "चार्वाक का श्लोक: 'भस्मीभूतस्य देहस्य पुनरागमनं कुतः', राख हो चुका शरीर फिर कैसे लौटेगा? हिरण बनने को कोई भरत बचा ही नहीं था; बस एक कथा है जिसे पुनर्जन्म के लिए कोई चाहिए।" }],
      scholar: { en: "Bharata was reborn as a deer and then as a brahmin who pretended to be simple-minded so that no one would attach him to anything again. That is why he is called Jaḍa Bharata, 'Bharata the dull'.", hi: "भरत हिरण बने और फिर एक ब्राह्मण, जो जड़ होने का ढोंग करते थे ताकि कोई उन्हें फिर किसी बंधन में न बाँधे। इसीलिए वे जड़ भरत कहलाते हैं।" }
    },
    "65": {
