      vaisheshika: { name: { en: "Vaisheshika", hi: "वैशेषिक" }, iast: "Vaiśeṣika", tag: { en: "Āstika · physics", hi: "आस्तिक · पदार्थ-विज्ञान" }, url: "https://en.wikipedia.org/wiki/Vaisheshika", line: { en: "The world is made of partless atoms, and every whole is something new.", hi: "जगत अविभाज्य परमाणुओं से बना है, और हर संपूर्ण वस्तु कुछ नई होती है।" }, body: { en: "Kaṇāda's school sorts everything that exists into categories: substance, quality, motion, the universal, the particular and inherence. Earth, water, fire and air are made of atoms (paramāṇu) that combine in pairs and triads. A pot is a new thing, not the clay in disguise. It is the sister school of Nyāya, and the two later merged.", hi: "कणाद का यह दर्शन हर अस्तित्ववान वस्तु को पदार्थों में बाँटता है: द्रव्य, गुण, कर्म, सामान्य, विशेष और समवाय। पृथ्वी, जल, अग्नि और वायु परमाणुओं से बने हैं जो दो-दो और तीन-तीन मिलकर जुड़ते हैं। घड़ा एक नई वस्तु है, भेष बदली हुई मिट्टी नहीं। यह न्याय का सहोदर दर्शन है, और आगे चलकर दोनों एक हो गए।" }, moksha: { en: "The self freed of all its qualities, including pleasure and awareness.", hi: "आत्मा का अपने सब गुणों से, सुख और चेतना से भी, मुक्त हो जाना।" } },
      samkhya: { name: { en: "Samkhya", hi: "सांख्य" }, iast: "Sāṃkhya", tag: { en: "Āstika · analysis", hi: "आस्तिक · विश्लेषण" }, url: "https://en.wikipedia.org/wiki/Samkhya", line: { en: "Two realities: the watching self, and the matter that does everything.", hi: "दो सत्य: देखने वाला पुरुष, और सब कुछ करने वाली प्रकृति।" }, body: { en: "Sāṃkhya counts twenty-five principles (tattva). Puruṣa is pure witnessing consciousness and never acts. Prakṛti is everything else: body, senses, mind, intellect and even the sense of 'I' (ahaṅkāra), all woven from three strands, the guṇas: sattva (clarity), rajas (drive) and tamas (inertia). Effects already exist in their causes, as the oil is in the sesame seed. It needs no God.", hi: "सांख्य पच्चीस तत्त्व गिनता है। पुरुष शुद्ध साक्षी चेतना है और कभी कर्म नहीं करता। प्रकृति बाकी सब कुछ है: शरीर, इंद्रियाँ, मन, बुद्धि और 'मैं' का भाव (अहंकार) भी, सब तीन गुणों से बुने हुए: सत्त्व (प्रकाश), रजस् (गति) और तमस् (जड़ता)। कार्य पहले से ही कारण में होता है, जैसे तिल में तेल। इसे ईश्वर की आवश्यकता नहीं।" }, moksha: { en: "Kaivalya: puruṣa sees that it was never bound to prakṛti. Possible in life.", hi: "कैवल्य: पुरुष देख लेता है कि वह प्रकृति से कभी बँधा ही नहीं था। जीते जी संभव।" } },
      yoga: { name: { en: "Yoga", hi: "योग" }, iast: "Yoga", tag: { en: "Āstika · practice", hi: "आस्तिक · साधना" }, url: "https://en.wikipedia.org/wiki/Yoga_(philosophy)", line: { en: "Sāṃkhya's map, walked: a discipline for stilling the movements of the mind.", hi: "सांख्य का नक्शा, चलकर: मन की वृत्तियों को शांत करने का अनुशासन।" }, body: { en: "Patañjali's Yoga Sūtra opens by defining yoga as the stilling of the mind's fluctuations (citta-vṛtti-nirodha). It names five afflictions (kleśa): ignorance, I-am-ness, attachment, aversion and clinging to life. Against them it sets eight limbs, from ethical restraints such as truth and non-violence, through posture and breath, to meditative absorption. It keeps a special God (Īśvara) as a focus for devotion.", hi: "पतंजलि का योगसूत्र योग की परिभाषा से आरंभ होता है: चित्त की वृत्तियों का निरोध। यह पाँच क्लेश बताता है: अविद्या, अस्मिता, राग, द्वेष और अभिनिवेश। इनके सामने यह आठ अंग रखता है, सत्य और अहिंसा जैसे यमों से लेकर आसन और प्राणायाम तक, और फिर समाधि तक। यह भक्ति के आलंबन के रूप में एक विशेष ईश्वर को मानता है।" }, moksha: { en: "Kaivalya, as in Sāṃkhya, reached by trained stillness. Possible in life.", hi: "कैवल्य, सांख्य की तरह, साधे हुए निरोध से। जीते जी संभव।" } },
      mimamsa: { name: { en: "Mimamsa", hi: "मीमांसा" }, iast: "Mīmāṃsā", tag: { en: "Āstika · ritual", hi: "आस्तिक · कर्मकांड" }, url: "https://en.wikipedia.org/wiki/Mimamsa", line: { en: "Dharma is what the Veda commands, and the command works by itself.", hi: "धर्म वही है जिसकी वेद आज्ञा देता है, और वह आज्ञा अपने आप फल देती है।" }, body: { en: "Mīmāṃsā is the science of reading the Veda's injunctions. It holds the Veda to be eternal and authorless, so no speaker's error can enter it. A rite produces its result through apūrva, an unseen potency, with no god needed to hand out rewards; Kumārila argued at length against a creator. For centuries its goal was heaven (svarga), not liberation.", hi: "मीमांसा वेद की विधियों को पढ़ने का शास्त्र है। यह वेद को नित्य और अपौरुषेय मानती है, इसलिए उसमें किसी वक्ता की भूल नहीं आ सकती। यज्ञ अपना फल अपूर्व से देता है, एक अदृश्य शक्ति से, फल बाँटने के लिए किसी देवता की ज़रूरत नहीं; कुमारिल ने सृष्टिकर्ता के विरुद्ध लंबे तर्क दिए। सदियों तक इसका लक्ष्य मोक्ष नहीं, स्वर्ग था।" }, moksha: { en: "For centuries, none: svarga was enough. Later teachers admitted mokṣa as the end of rebirth.", hi: "सदियों तक कोई नहीं: स्वर्ग पर्याप्त था। बाद के आचार्यों ने मोक्ष को पुनर्जन्म के अंत के रूप में माना।" } },
      advaita: { name: { en: "Advaita Vedanta", hi: "अद्वैत वेदांत" }, iast: "Advaita Vedānta", tag: { en: "Āstika · Vedānta", hi: "आस्तिक · वेदांत" }, url: "https://en.wikipedia.org/wiki/Advaita_Vedanta", line: { en: "Not two: the self you are and the Brahman you seek are one.", hi: "दो नहीं: जो आत्मा आप हैं और जिस ब्रह्म को आप खोजते हैं, वे एक हैं।" }, body: { en: "Śaṅkara read the Upaniṣads as teaching one thing: ātman is Brahman. The world of many things is real enough to live in but not ultimately real, the way a rope is taken for a snake in dim light. The error is ignorance (avidyā), and only knowledge removes it: rites and good deeds can prepare the mind, never free it. The great sentences (mahāvākya) of the Upaniṣads are where that knowledge is heard.", hi: "शंकर ने उपनिषदों में एक ही शिक्षा पढ़ी: आत्मा ही ब्रह्म है। अनेक वस्तुओं का संसार जीने भर के लिए सत्य है, परम सत्य नहीं, जैसे धुँधली रोशनी में रस्सी साँप लगती है। यह भूल अविद्या है, और इसे केवल ज्ञान मिटाता है: कर्म और पुण्य मन को तैयार कर सकते हैं, मुक्त नहीं। उपनिषदों के महावाक्य वह स्थान हैं जहाँ यह ज्ञान सुना जाता है।" }, moksha: { en: "Knowing you were always Brahman. Possible while alive (jīvanmukti).", hi: "यह जानना कि आप सदा से ब्रह्म थे। जीते जी संभव (जीवन्मुक्ति)।" } },
      vishishtadvaita: { name: { en: "Vishishtadvaita", hi: "विशिष्टाद्वैत" }, iast: "Viśiṣṭādvaita", tag: { en: "Āstika · Vedānta", hi: "आस्तिक · वेदांत" }, url: "https://en.wikipedia.org/wiki/Vishishtadvaita", line: { en: "One Brahman, with the world and every self as its body.", hi: "एक ब्रह्म, और जगत तथा हर आत्मा उसका शरीर।" }, body: { en: "Rāmānuja agreed that Brahman is one, but denied that the world is an illusion. Selves and matter are real, and they belong to Brahman as a body belongs to the one who lives in it. Brahman is a personal God, Viṣṇu-Nārāyaṇa, full of good qualities, and devotion (bhakti) together with surrender (prapatti) is the way to him.", hi: "रामानुज ने माना कि ब्रह्म एक है, पर जगत को माया नहीं माना। आत्माएँ और पदार्थ वास्तविक हैं, और वे ब्रह्म के हैं जैसे शरीर उसमें रहने वाले का होता है। ब्रह्म सगुण ईश्वर हैं, विष्णु-नारायण, कल्याण गुणों से पूर्ण, और भक्ति के साथ प्रपत्ति (शरणागति) उन तक पहुँचने का मार्ग है।" }, moksha: { en: "Eternal service of God in his presence, your individuality kept.", hi: "ईश्वर के सान्निध्य में उनकी नित्य सेवा, अपना व्यक्तित्व बनाए रखकर।" } },
      dvaita: { name: { en: "Dvaita Vedanta", hi: "द्वैत वेदांत" }, iast: "Dvaita Vedānta", tag: { en: "Āstika · Vedānta", hi: "आस्तिक · वेदांत" }, url: "https://en.wikipedia.org/wiki/Dvaita_Vedanta", line: { en: "Two, always: God and the soul are never the same.", hi: "सदा दो: ईश्वर और जीव कभी एक नहीं होते।" }, body: { en: "Madhva taught five eternal differences: between God and souls, God and matter, soul and soul, soul and matter, and matter and matter. Viṣṇu alone is independent; everything else depends on him. Souls differ in nature, and liberation comes by God's grace, which answers devotion but is never earned like a wage.", hi: "मध्व ने पाँच नित्य भेद बताए: ईश्वर और जीव, ईश्वर और जड़, जीव और जीव, जीव और जड़, तथा जड़ और जड़ के बीच। केवल विष्णु स्वतंत्र हैं; बाकी सब उन पर निर्भर है। जीव स्वभाव से भिन्न हैं, और मुक्ति ईश्वर की कृपा से मिलती है, जो भक्ति का उत्तर देती है पर मज़दूरी की तरह कमाई नहीं जाती।" }, moksha: { en: "Loving, eternal nearness to Viṣṇu, by his grace. Never merging.", hi: "विष्णु की कृपा से उनका प्रेमपूर्ण, नित्य सान्निध्य। विलय कभी नहीं।" } },
      carvaka: { name: { en: "Charvaka", hi: "चार्वाक" }, iast: "Cārvāka · Lokāyata", tag: { en: "Nāstika · materialism", hi: "नास्तिक · भौतिकवाद" }, url: "https://en.wikipedia.org/wiki/Charvaka", line: { en: "Only what you perceive is real. This body, this life, this world.", hi: "जो प्रत्यक्ष है वही सत्य है। यही शरीर, यही जीवन, यही संसार।" }, body: { en: "The Lokāyata, 'those of this world', accepted only perception as a means of knowledge. Inference, they argued, rests on a universal rule that no one has ever seen hold everywhere. Consciousness arises from the body's elements, as intoxicating power arises from fermented grain. There is no self that survives the body, no rebirth and no karma to fear, so a good life is a pleasant one, with pain avoided where you can. Their own books are lost; we know them from opponents, who rarely put the case at full strength.", hi: "लोकायत, 'इसी लोक वाले', केवल प्रत्यक्ष को प्रमाण मानते थे। उनका तर्क था कि अनुमान एक सार्वभौम नियम पर टिका है जिसे किसी ने कभी हर जगह लागू होते नहीं देखा। चेतना शरीर के भूतों से उत्पन्न होती है, जैसे सड़े अन्न से नशे की शक्ति। शरीर के बाद बचने वाली कोई आत्मा नहीं, न पुनर्जन्म, न डरने को कर्म; इसलिए अच्छा जीवन सुखी जीवन है, जहाँ तक हो सके दुःख से बचते हुए। उनके अपने ग्रंथ खो गए; हम उन्हें विरोधियों से जानते हैं, जो उनका पक्ष शायद ही पूरी ताकत से रखते थे।" }, moksha: { en: "Death itself is liberation. There is nothing after it to be freed from.", hi: "मृत्यु ही मोक्ष है। उसके बाद मुक्त होने को कुछ नहीं बचता।" } },
      bauddha: { name: { en: "Buddhism", hi: "बौद्ध दर्शन" }, iast: "Bauddha", tag: { en: "Nāstika · the middle way", hi: "नास्तिक · मध्यम मार्ग" }, url: "https://en.wikipedia.org/wiki/Buddhist_philosophy", line: { en: "There is suffering, it has a cause, and there is no self to hold on to.", hi: "दुःख है, उसका कारण है, और पकड़कर रखने को कोई आत्मा नहीं।" }, body: { en: "The Buddha rejected the Veda's authority and the permanent self (anattā), and kept karma and rebirth. Craving (taṇhā) drives the cycle, and every thing arises dependent on conditions. Later schools argued fiercely with the Hindu darśanas: Yogācāra said only consciousness is real, Madhyamaka that nothing has a fixed nature at all. Buddhist logicians such as Dignāga and Dharmakīrti sharpened Nyāya by attacking it.", hi: "बुद्ध ने वेद के प्रामाण्य और नित्य आत्मा को नहीं माना (अनात्म), पर कर्म और पुनर्जन्म को रखा। तृष्णा इस चक्र को चलाती है, और हर वस्तु कारणों पर निर्भर होकर उत्पन्न होती है। बाद के संप्रदायों ने हिंदू दर्शनों से तीखा शास्त्रार्थ किया: योगाचार ने कहा केवल विज्ञान (चेतना) सत्य है, माध्यमिक ने कहा किसी वस्तु का कोई स्थिर स्वभाव है ही नहीं। दिङ्नाग और धर्मकीर्ति जैसे बौद्ध तार्किकों ने न्याय पर प्रहार करके उसे और पैना किया।" }, moksha: { en: "Nirvāṇa: craving blown out like a flame. No self is liberated, because none was bound.", hi: "निर्वाण: तृष्णा का दीपक की लौ की तरह बुझ जाना। कोई आत्मा मुक्त नहीं होती, क्योंकि कोई बँधी ही नहीं थी।" } },
      jaina: { name: { en: "Jainism", hi: "जैन दर्शन" }, iast: "Jaina", tag: { en: "Nāstika · non-violence", hi: "नास्तिक · अहिंसा" }, url: "https://en.wikipedia.org/wiki/Jain_philosophy", line: { en: "Karma is a fine dust that sticks to the soul. Harm no living thing.", hi: "कर्म एक सूक्ष्म धूल है जो जीव पर चिपकती है। किसी प्राणी को हानि न पहुँचाओ।" }, body: { en: "For the Jains every living thing has a soul (jīva), and karma is a real, subtle matter that binds it, drawn in by passion and violence. Five great vows clean it off: non-violence, truth, not stealing, chastity and non-possession, with austerity (tapas) burning away what has already stuck. The universe was never created. Their doctrine of many-sidedness (anekāntavāda) holds that any claim is true only from some standpoint. Jain boards of this game, with 84 squares, survive from the medieval period.", hi: "जैनों के लिए हर प्राणी में जीव है, और कर्म एक वास्तविक, सूक्ष्म पुद्गल है जो उसे बाँधता है, कषाय और हिंसा से खिंचकर। पाँच महाव्रत उसे धोते हैं: अहिंसा, सत्य, अस्तेय, ब्रह्मचर्य और अपरिग्रह, और तप पहले से चिपके कर्म को जलाता है। ब्रह्मांड कभी बनाया नहीं गया। उनका अनेकांतवाद कहता है कि हर कथन किसी दृष्टि से ही सत्य है। इस खेल के चौरासी खानों वाले जैन बोर्ड मध्यकाल से बचे हुए हैं।" }, moksha: { en: "Kevala: the soul, freed of all karmic matter, rises to the top of the universe in endless knowing.", hi: "कैवल्य: सब कर्म-पुद्गल से मुक्त जीव लोक के शिखर पर पहुँचकर अनंत ज्ञान में रहता है।" } },
      trika: { name: { en: "Kashmir Shaivism", hi: "काश्मीर शैव दर्शन" }, iast: "Trika · Pratyabhijñā", tag: { en: "Āgamic · outside the six", hi: "आगमिक · षड्दर्शन से बाहर" }, url: "https://en.wikipedia.org/wiki/Kashmir_Shaivism", line: { en: "You do not become Śiva. You recognise that you were Śiva all along.", hi: "आप शिव बनते नहीं। आप पहचानते हैं कि आप सदा से शिव थे।" }, body: { en: "The Trika of Kashmir, systematised by Abhinavagupta, takes its authority from the Śaiva Āgamas rather than the Veda, so it is usually left off the list of six. Like Advaita it says consciousness alone is real, but it insists the world is not illusion: it is Śiva's own free self-expression. Consciousness is not only light (prakāśa) but self-aware (vimarśa). Its path is pratyabhijñā, recognition, like suddenly seeing that a stranger is someone you already knew.", hi: "काश्मीर का त्रिक, जिसे अभिनवगुप्त ने व्यवस्थित किया, वेद की बजाय शैव आगमों से प्रमाण लेता है, इसलिए प्रायः छह दर्शनों की सूची से बाहर रहता है। अद्वैत की तरह यह कहता है कि केवल चेतना सत्य है, पर ज़ोर देता है कि जगत माया नहीं: वह शिव की अपनी स्वतंत्र अभिव्यक्ति है। चेतना केवल प्रकाश नहीं, विमर्श भी है, स्वयं को जानने वाली। इसका मार्ग प्रत्यभिज्ञा है, पहचान, जैसे अचानक दिखे कि कोई अजनबी वही है जिसे आप पहले से जानते थे।" }, moksha: { en: "Recognition of yourself as Śiva, with the world kept as your own play.", hi: "स्वयं को शिव के रूप में पहचानना, जगत को अपनी ही लीला मानते हुए।" } }
    },
    sources: {
      panchatantra: { name: { en: "Panchatantra", hi: "पंचतंत्र" }, match: "Panchatantra", url: "https://en.wikipedia.org/wiki/Panchatantra", gloss: { en: "Five books of animal fables told to teach statecraft to three princes; among the most translated books in the world.", hi: "तीन राजकुमारों को नीति सिखाने के लिए कही गई पशु-कथाओं की पाँच पुस्तकें; दुनिया में सबसे अधिक अनूदित पुस्तकों में से एक।" } },
      mahabharata: { name: { en: "Mahabharata", hi: "महाभारत" }, match: "Mahabharata", url: "https://en.wikipedia.org/wiki/Mahabharata", gloss: { en: "The great epic of the Kuru war, in eighteen books (parvas); it holds the Bhagavad Gītā and hundreds of shorter stories.", hi: "कुरु युद्ध का महाकाव्य, अठारह पर्वों में; इसमें भगवद्गीता और सैकड़ों छोटी कथाएँ हैं।" } },
      chandogya: { name: { en: "Chandogya Upanishad", hi: "छांदोग्य उपनिषद्" }, match: "Chandogya Upanishad", url: "https://en.wikipedia.org/wiki/Chandogya_Upanishad", gloss: { en: "One of the oldest Upaniṣads, of the Sāma Veda; home of 'tat tvam asi' and of the stories of Śvetaketu, Satyakāma and Indra.", hi: "सामवेद का, सबसे पुराने उपनिषदों में से एक; 'तत् त्वम् असि' और श्वेतकेतु, सत्यकाम तथा इंद्र की कथाओं का घर।" } },
      brihadaranyaka: { name: { en: "Brihadaranyaka Upanishad", hi: "बृहदारण्यक उपनिषद्" }, match: "Brihadaranyaka Upanishad", url: "https://en.wikipedia.org/wiki/Brihadaranyaka_Upanishad", gloss: { en: "The 'great forest' Upaniṣad of the White Yajur Veda, the longest of them; Yājñavalkya's debates and 'neti neti' are here.", hi: "शुक्ल यजुर्वेद का 'महान वन' उपनिषद्, सबसे लंबा; याज्ञवल्क्य के शास्त्रार्थ और 'नेति नेति' यहीं हैं।" } },
      taittiriya: { name: { en: "Taittiriya Upanishad", hi: "तैत्तिरीय उपनिषद्" }, match: "Taittiriya Upanishad", url: "https://en.wikipedia.org/wiki/Taittiriya_Upanishad", gloss: { en: "An Upaniṣad of the Black Yajur Veda: a teacher's parting advice, the five sheaths, and Bhṛgu's search that ends in bliss.", hi: "कृष्ण यजुर्वेद का उपनिषद्: गुरु का दीक्षांत उपदेश, पंचकोश, और भृगु की खोज जो आनंद पर समाप्त होती है।" } },
      katha: { name: { en: "Katha Upanishad", hi: "कठ उपनिषद्" }, match: "Katha Upanishad", url: "https://en.wikipedia.org/wiki/Katha_Upanishad", gloss: { en: "The boy Naciketas questions Death himself about what survives; it gives the image of the chariot.", hi: "बालक नचिकेता स्वयं मृत्यु से पूछता है कि क्या बचता है; रथ का रूपक इसी में है।" } },
      mundaka: { name: { en: "Mundaka Upanishad", hi: "मुंडक उपनिषद्" }, match: "Mundaka Upanishad", url: "https://en.wikipedia.org/wiki/Mundaka_Upanishad", gloss: { en: "A verse Upaniṣad of the Atharva Veda that ranks rites below knowledge; the two birds on one tree are from here.", hi: "अथर्ववेद का पद्य उपनिषद् जो कर्मकांड को ज्ञान से नीचे रखता है; एक वृक्ष पर दो पक्षी यहीं से हैं।" } },
      mandukya: { name: { en: "Mandukya Upanishad", hi: "माण्डूक्य उपनिषद्" }, match: "Mandukya Upanishad", url: "https://en.wikipedia.org/wiki/Mandukya_Upanishad", gloss: { en: "Twelve verses on Om and the four states of consciousness; Gauḍapāda's commentary on it began Advaita.", hi: "ॐ और चेतना की चार अवस्थाओं पर बारह मंत्र; इस पर गौड़पाद की कारिका से अद्वैत का आरंभ हुआ।" } },
      isha: { name: { en: "Isha Upanishad", hi: "ईश उपनिषद्" }, match: "Isha Upanishad", url: "https://en.wikipedia.org/wiki/Isha_Upanishad", gloss: { en: "Eighteen verses that close the White Yajur Veda's Saṃhitā, on living in the world without grasping it.", hi: "शुक्ल यजुर्वेद संहिता के अंत के अठारह मंत्र, संसार में बिना पकड़े जीने पर।" } },
      kena: { name: { en: "Kena Upanishad", hi: "केन उपनिषद्" }, match: "Kena Upanishad", url: "https://en.wikipedia.org/wiki/Kena_Upanishad", gloss: { en: "Named for its first word, 'by whom?'; it asks what moves the mind and tells of the gods humbled by a Yakṣa.", hi: "अपने पहले शब्द 'केन' (किसके द्वारा?) से नाम पाया; यह पूछता है कि मन को कौन चलाता है, और यक्ष से विनम्र हुए देवताओं की कथा कहता है।" } },
      prashna: { name: { en: "Prashna Upanishad", hi: "प्रश्न उपनिषद्" }, match: "Prashna Upanishad", url: "https://en.wikipedia.org/wiki/Prashna_Upanishad", gloss: { en: "The Upaniṣad of questions: six seekers each put one question to the sage Pippalāda.", hi: "प्रश्नों का उपनिषद्: छह जिज्ञासु ऋषि पिप्पलाद से एक-एक प्रश्न पूछते हैं।" } },
      aitareya: { name: { en: "Aitareya Upanishad", hi: "ऐतरेय उपनिषद्" }, match: "Aitareya Upanishad", url: "https://en.wikipedia.org/wiki/Aitareya_Upanishad", gloss: { en: "A short Upaniṣad of the Ṛg Veda on how the Self created the worlds; it ends in 'prajñānaṃ brahma'.", hi: "ऋग्वेद का छोटा उपनिषद्, आत्मा ने लोक कैसे रचे; इसका अंत 'प्रज्ञानं ब्रह्म' पर होता है।" } },
      bhagavata: { name: { en: "Bhagavata Purana", hi: "भागवत पुराण" }, match: "Bhagavata Purana", url: "https://en.wikipedia.org/wiki/Bhagavata_Purana", gloss: { en: "The great devotional Purāṇa of Viṣṇu, in twelve books; the stories of Prahlāda and of Jaḍa Bharata are here.", hi: "विष्णु का महान भक्ति पुराण, बारह स्कंधों में; प्रह्लाद और जड़ भरत की कथाएँ यहीं हैं।" } },
      manusmriti: { name: { en: "Manusmriti", hi: "मनुस्मृति" }, match: "Manusmriti", url: "https://en.wikipedia.org/wiki/Manusmriti", gloss: { en: "A treatise on dharma that sets out the four āśramas; its rules on caste and on women were contested in its own time and are now.", hi: "धर्म पर एक ग्रंथ जो चार आश्रमों का वर्णन करता है; जाति और स्त्रियों पर इसके नियम अपने समय में भी विवादित थे और आज भी हैं।" } },
      rigveda: { name: { en: "Rig Veda", hi: "ऋग्वेद" }, match: "Rig Veda", url: "https://en.wikipedia.org/wiki/Rigveda", gloss: { en: "The oldest of the four Vedas: over a thousand hymns, arranged in ten books (maṇḍalas).", hi: "चारों वेदों में सबसे पुराना: एक हज़ार से अधिक सूक्त, दस मंडलों में।" } },
      grihya: { name: { en: "Grihya Sutras", hi: "गृह्यसूत्र" }, match: "Grihya Sutras", url: "https://en.wikipedia.org/wiki/Grihya_Sutras", gloss: { en: "Manuals of the household rites, from birth and first food to the sacred thread, marriage and death.", hi: "गृहस्थ के संस्कारों की नियमावली, जन्म और अन्नप्राशन से उपनयन, विवाह और मृत्यु तक।" } },
      subhashita: { name: { en: "Subhashita", hi: "सुभाषित" }, match: "Subhashita", url: "https://en.wikipedia.org/wiki/Subhashita", gloss: { en: "'Well said': the vast tradition of single Sanskrit verses of practical wisdom, quoted rather than read.", hi: "'अच्छा कहा गया': व्यावहारिक ज्ञान के एकल संस्कृत श्लोकों की विशाल परंपरा, जो पढ़ी कम, उद्धृत अधिक जाती है।" } },
      kaushitaki: { name: { en: "Kaushitaki Upanishad", hi: "कौषीतकि उपनिषद्" }, match: "Kaushitaki Upanishad", url: "https://en.wikipedia.org/wiki/Kaushitaki_Upanishad", gloss: { en: "A Ṛg Vedic Upaniṣad about what happens at death, including the father who hands himself over to his son.", hi: "मृत्यु पर क्या होता है, इस पर एक ऋग्वैदिक उपनिषद्, जिसमें वह पिता भी है जो स्वयं को पुत्र को सौंप देता है।" } },
      brahmasutra: { name: { en: "Brahma Sutra", hi: "ब्रह्मसूत्र" }, match: "Brahma Sutra", url: "https://en.wikipedia.org/wiki/Brahma_Sutras", gloss: { en: "Bādarāyaṇa's aphorisms summing up the Upaniṣads: the text every school of Vedānta had to write a commentary on.", hi: "उपनिषदों का सार बादरायण के सूत्रों में: वह ग्रंथ जिस पर वेदांत के हर संप्रदाय को भाष्य लिखना पड़ा।" } },
      gita: { name: { en: "Bhagavad Gita", hi: "भगवद्गीता" }, match: "Bhagavad Gita", url: "https://en.wikipedia.org/wiki/Bhagavad_Gita", gloss: { en: "Krishna's teaching to Arjuna on the battlefield, seven hundred verses inside the Mahābhārata. Its ninth chapter says heaven is a reward, and that rewards run out.", hi: "युद्धभूमि में अर्जुन को कृष्ण का उपदेश, महाभारत के भीतर सात सौ श्लोक। उसका नौवाँ अध्याय कहता है कि स्वर्ग एक पुरस्कार है, और पुरस्कार चुक जाते हैं।" } }
    },
    figures: {

      gaudapada: { name: { en: "Gaudapada", hi: "गौड़पाद" }, iast: "Gauḍapāda", school: "advaita", url: "https://en.wikipedia.org/wiki/Gaudapada", dates: { en: "c. 6th century", hi: "लगभग छठी सदी" }, line: { en: "Author of the verses on the Māṇḍūkya, the first systematic Advaita text, and by tradition the teacher of Śaṅkara's teacher.", hi: "माण्डूक्य पर कारिका के रचयिता, अद्वैत का पहला व्यवस्थित ग्रंथ, और परंपरा के अनुसार शंकर के गुरु के गुरु।" } },

      vishnusharma: { name: { en: "Vishnu Sharma", hi: "विष्णु शर्मा" }, iast: "Viṣṇuśarman", school: null, url: "https://en.wikipedia.org/wiki/Vishnu_Sharma", dates: { en: "the Panchatantra's narrator", hi: "पंचतंत्र के कथावाचक" }, line: { en: "The old teacher who promised a king to make his three dull sons wise in six months, and did it with stories.", hi: "वे वृद्ध गुरु जिन्होंने राजा को वचन दिया कि छह महीने में उसके तीन मंदबुद्धि पुत्रों को बुद्धिमान बना देंगे, और कथाओं से ऐसा किया।" } },

      kapila: { name: { en: "Kapila", hi: "कपिल" }, iast: "Kapila", school: "samkhya", url: "https://en.wikipedia.org/wiki/Kapila", dates: { en: "legendary founder", hi: "पौराणिक संस्थापक" }, line: { en: "The sage tradition names as Sāṃkhya's founder; the school's surviving classic is Īśvarakṛṣṇa's Sāṃkhya Kārikā.", hi: "वे ऋषि जिन्हें परंपरा सांख्य का संस्थापक मानती है; इस दर्शन का बचा हुआ मुख्य ग्रंथ ईश्वरकृष्ण की सांख्यकारिका है।" } },
      akshapada: { name: { en: "Akshapada Gautama", hi: "अक्षपाद गौतम" }, iast: "Akṣapāda Gautama", school: "nyaya", url: "https://en.wikipedia.org/wiki/Aksapada_Gautama", dates: { en: "c. 2nd century", hi: "लगभग दूसरी सदी" }, line: { en: "Author of the Nyāya Sūtra. His nickname, 'eyes in his feet', comes from a story that he walked lost in thought into a well.", hi: "न्यायसूत्र के रचयिता। उनका उपनाम 'अक्षपाद' (पैरों में आँखें) उस कथा से आया कि वे विचारों में खोए चलते-चलते कुएँ में गिर पड़े।" } },

      badarayana: { name: { en: "Badarayana", hi: "बादरायण" }, iast: "Bādarāyaṇa", school: null, url: "https://en.wikipedia.org/wiki/Badarayana", dates: { en: "author of the Brahma Sūtra", hi: "ब्रह्मसूत्र के रचयिता" }, line: { en: "He compressed the Upaniṣads into some five hundred aphorisms, so terse that every school of Vedānta could read itself into them.", hi: "उन्होंने उपनिषदों को लगभग पाँच सौ सूत्रों में समेटा, इतने संक्षिप्त कि वेदांत का हर संप्रदाय उनमें अपने को पढ़ सका।" } },
      kanada: { name: { en: "Kanada", hi: "कणाद" }, iast: "Kaṇāda", school: "vaisheshika", url: "https://en.wikipedia.org/wiki/Kanada_(philosopher)", dates: { en: "founder of Vaiśeṣika", hi: "वैशेषिक के प्रवर्तक" }, line: { en: "His name is said to mean 'grain-eater', and he made the grain into a theory: everything you can see is built from atoms you cannot.", hi: "कहते हैं उनके नाम का अर्थ है 'कण खाने वाला', और उन्होंने कण को सिद्धांत बना दिया: जो कुछ आप देख सकते हैं, वह उन परमाणुओं से बना है जिन्हें आप नहीं देख सकते।" } },

      ushasti: { name: { en: "Ushasti", hi: "उषस्ति" }, iast: "Uṣasti Cākrāyaṇa", school: null, url: "https://en.wikipedia.org/wiki/Chandogya_Upanishad", dates: { en: "Upaniṣadic sage", hi: "उपनिषद् काल के ऋषि" }, line: { en: "A starving brahmin who ate forbidden leftovers to live, refused the water because he could, and the next morning cross-examined the king's priests.", hi: "एक भूखा ब्राह्मण जिसने जीने के लिए वर्जित जूठा खाया, जल इसलिए ठुकराया कि ठुकरा सकता था, और अगली सुबह राजा के पुरोहितों से जिरह की।" } }

  function renderSetup() {
    const setup = G.setup;
    $("count").setAttribute("aria-label", t("players"));
    $("count").innerHTML = [2, 3, 4].map((n) => `<button type="button" data-n="${n}" aria-pressed="${n === setup.count}">${t("nPlayers", { n })}</button>`).join("");
    $("prows").innerHTML = setup.rows.slice(0, setup.count).map((r, i) => `
    <div class="prow">
      <span class="dot" style="background:${COLORS[i]}"></span>
      <input type="text" id="pname${i}" value="${esc(r.name)}" placeholder="${esc(t("def" + i))}" maxlength="16" aria-label="${t("colour" + i)}">
      <select id="ptype${i}" aria-label="${t("colour" + i)}">
        <option value="human"${r.type === "human" ? " selected" : ""}>${t("human")}</option>
        <option value="cpu"${r.type === "cpu" ? " selected" : ""}>${t("cpu")}</option>
      </select>
      <select id="pgender${i}" aria-label="${t("namingAs")} · ${t("colour" + i)}">
        ${[["", "genderAny"], ["f", "genderF"], ["m", "genderM"], ["n", "genderN"]].map(([v, k]) => `<option value="${v}"${(r.gender || "") === v ? " selected" : ""}>${t(k)}</option>`).join("")}
      </select>
    </div>`).join("");
    $("ruleSix").checked = setup.rules.six;
    $("ruleBrahmaloka").checked = !!setup.rules.brahmaloka;
    $("prefDepth").innerHTML = [["story", "depthStory"], ["school", "depthSchool"], ["scholar", "depthScholar"]].map(([v, k]) => `<option value="${v}"${v === prefs.depth ? " selected" : ""}>${t(k)}</option>`).join("");
    $("prefLand").checked = prefs.landAll;
    $("prefBoth").checked = prefs.both;
  }
  function readSetup() {
    const setup = G.setup;
    setup.rows.slice(0, setup.count).forEach((r, i) => {
      r.name = $("pname" + i).value;
      r.type = $("ptype" + i).value;
      r.gender = $("pgender" + i).value;
    });
    setup.rules = { six: $("ruleSix").checked, brahmaloka: $("ruleBrahmaloka").checked };
  }
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach((el) => {
      el.textContent = t(el.dataset.t);
    });
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    renderMute();
    $("ashramas").innerHTML = ASHRAMAS.slice(0, 5).map(([, en, hi], i) => `<span style="top:${(ROWS - (2 * i + 1)) / ROWS * 100}%">${L(en, hi)}</span>`).join("");
  }
  function setLang(l) {
    if (l === lang) return;
    readSetup();
    setLangValue(l);
    try {
      localStorage.setItem("mp-lang", l);
    } catch {
    }
    applyStatic();
    buildCells();
    age(true);
    renderSetup();
    render();
    renderCodex();
    refreshCard();
    refreshLife();
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  $("count").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-n]");
    if (!b) return;
    readSetup();
    G.setup.count = +b.dataset.n;
    renderSetup();
  });
  var urlSeed = new URLSearchParams(location.search).get("seed");
  var nextSeed = urlSeed != null && /^\d+$/.test(urlSeed) ? +urlSeed >>> 0 : null;
  function startGame() {
    G.gen++;
    clearTimeout(G.cpuTimer);
    G.rollQueued = false;
    G.plan = null;
    G.face = null;
    G.waitingCard = false;
    G.choosing = null;
    G.deciding = null;
    $("pick").hidden = true;
    $("pick").innerHTML = "";
    $("roll").hidden = false;
    closeCard({ instant: true });
    closeLife();
    $("toastSlot").innerHTML = "";
    if (S) fxClear();
    G.busy = false;
    G.state = newState(nextSeed ?? freshSeed());
    nextSeed = null;
    buildTokens();
    render();
    age(true);
    queueCpu();
  }
  $("newGame").addEventListener("click", () => {
    readSetup();
    startGame();
  });
  $("again").addEventListener("click", startGame);
  $("readLife").addEventListener("click", () => openLife());
  function openNaming() {
    const r = G.setup.rows[0];
    $("namingName").value = r.name;
    document.querySelectorAll("#namingGenders input").forEach((i) => {
      i.checked = i.value === r.gender;
    });
    $("naming").showModal();
  }
  $("namingForm").addEventListener("submit", () => {
    readSetup();
    const r = G.setup.rows[0];
    r.name = $("namingName").value.trim();
    r.type = "human";
    r.gender = new FormData($("namingForm")).get("gender");
    saveSelf(r.name, r.gender);
    renderSetup();
    nextSeed = G.state.rng.seed;
    startGame();
  });
  $("naming").addEventListener("cancel", (e) => e.preventDefault());
  $("roll").addEventListener("click", takeTurn);
  document.addEventListener("keydown", (e) => {
    if (G.deciding && /^[1-3]$/.test(e.key) && !e.target.closest("input, select, textarea") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const o = G.deciding.opts[+e.key - 1];
      if (o) {
        e.preventDefault();
        return pickOption(o.id);
      }
    }
    if (G.choosing && !e.target.closest("input, select, textarea") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const { dice } = G.choosing, v = e.key === "1" ? dice[0] : e.key === "2" ? dice[1] : /^[s0]$/i.test(e.key) ? 0 : null;
      if (v != null) {
        e.preventDefault();
        return pickMove(v);
      }
    }
    if (e.code !== "Space" || e.target.closest("input, select, button, textarea, summary")) return;
    if (e.target.closest("[role=button]")) return;
    e.preventDefault();
    if (cardOpen()) return closeCard();
    if (cur().type === "human") takeTurn();
  });
  $("board").addEventListener("pointerdown", hold, { passive: true });
  $("labels").addEventListener("focusin", hold);
  $("labels").addEventListener("click", (e) => {
    const lab = e.target.closest(".lab");
    if (lab) openSquare(+lab.dataset.n, { from: lab });
  });
  var gridIndex = (n) => {
    const { col, row } = colRow(n);
    return (ROWS - 1 - row) * 10 + col;
  };
  var atIndex = (i) => +$("labels").children[i]?.dataset.n;
  $("labels").addEventListener("keydown", (e) => {
    const lab = e.target.closest(".lab");
    if (!lab) return;
    const n = +lab.dataset.n;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      return openSquare(n, { from: lab });
    }
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -10, ArrowDown: 10 }[e.key];
    if (!step) return;
    e.preventDefault();
    const i = gridIndex(n) + step;
    if (i >= 0 && i < ROWS * 10 && (Math.abs(step) === 10 || Math.floor(i / 10) === Math.floor(gridIndex(n) / 10))) focusSquare(atIndex(i));
  });
  $("log").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sq]");
    if (b) openSquare(+b.dataset.sq, { from: labEls[+b.dataset.sq] });
  });
  $("prefDepth").addEventListener("change", (e) => {
    setPref("depth", e.target.value);
    refreshCard();
  });
  $("prefLand").addEventListener("change", (e) => setPref("landAll", e.target.checked));
  $("prefBoth").addEventListener("change", (e) => {
    setPref("both", e.target.checked);
    refreshCard();
  });
  function renderMute() {
    const b = $("mute");
    b.setAttribute("aria-pressed", String(!prefs.mute));
    b.setAttribute("aria-label", t(prefs.mute ? "soundOff" : "soundOn"));
    b.title = t(prefs.mute ? "soundOff" : "soundOn");
    b.classList.toggle("off", prefs.mute);
  }
  $("mute").addEventListener("click", () => {
    setMuted(!prefs.mute);
    renderMute();
  });
  ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, unlockAudio, { passive: true }));
  onCardChange(renderCodex);
  function openFromHash() {
    const m = location.hash.match(/^#(sq|codex)\/([\w-]+)$/);
    if (!m) return;
    if (m[1] === "sq" && +m[2] >= 1 && +m[2] <= TOP) openSquare(+m[2]);
    else if (m[1] === "codex") openEntry(m[2]);
  }
  addEventListener("hashchange", openFromHash);
  new ResizeObserver(draw).observe($("cells"));
  if (new URLSearchParams(location.search).has("debug")) {
    window.mp = {
      jump(n) {
        cur().pos = n;
        render();
        age(true);
      },
      // mp.years(n) sets how many years the current player has lived, so the end of a life can be reached on demand
      years(n) {
        if (n != null) {
          cur().years = n;
          render();
          age(true);
        }
        return cur().years;
      },
      // the lens the board is aged through: { fadeAge, dimAge, lead, droneStage }
      age: () => lens(G.state),
      // { ctx, stage, voices, wanted, muted }
      audio: audioState,
      // mp.quality("low") draws less: no camera, no motion extras, no paper grain
      quality(q2) {
        if (q2) {
          setQuality(q2);
          pullBack(true);
          draw();
        }
        return quality;
      },
      roll(...vs) {
        G.forcedRoll = vs.length > 1 ? vs : vs[0];
        return takeTurn();
      },
      // the moves the dice now offer, or null when nothing is waiting on a choice
      get choosing() {
        return G.choosing ? [...G.choosing.moves] : null;
      },
      pick: pickMove,
      // the options a situation offers, with whether each is open, or null when nothing is waiting on one
      get deciding() {
        return G.deciding ? G.deciding.opts.map((o) => ({ id: o.id, open: o.open })) : null;
      },
      choose: pickOption,
      // the situation on square n, or null (REDESIGN.md Phase 10)
      situation: (n) => situationAt(n),
      // how many dice player i (the current one by default) has spent on practice in this life
      practised: (i = G.state.turn) => G.state.players[i].practised ?? 0,
      seed(n) {
        if (n == null) return G.state.rng.seed;
        nextSeed = n >>> 0;
        startGame();
        return G.state.rng.seed;
      },
      get state() {
        return G.state;
      },
      // true while a turn is being played out
      get busy() {
        return G.busy;
      },
      open: openSquare,
      // the card as it stands: { detent, height, half, full } on a phone (null on a wide screen), opened further, rolled from
      sheet: () => ({ open: cardOpen(), sheet: sheetState(), expanded: cardExpanded(), carried: cardCarried() }),
      // presses the card's Roll; mp.rollFromCard(v) fixes the next roll, so call it on the reader's own turn
      rollFromCard(v) {
        const b = document.querySelector('#leaf .roll-c[aria-disabled="false"]');
        if (b && v != null) G.forcedRoll = v;
        b?.click();
        return !!b;
      },
      entry: openEntry,
      close: closeCard,
      sprite: spriteURL,
      data: { GOAL, TOP, LADDERS, SNAKES, SQ, HEAVEN, STR },
      setLang,
      life: openLife,
      // mp.rules({ brahmaloka: true }) changes the running game's rules
      rules(r) {
        if (r) Object.assign(G.state.rules, r);
        return { ...G.state.rules };
      },
      lifeText: (i = 0, l) => lifeText2(G.state, i, l),
      naming: openNaming
    };
  }
  function start(data) {
    G.setup = data?.setup || defaultSetup();
    if (data?.setup?.lang && !urlLang) setLangValue(data.setup.lang);
    applyStatic();
    buildCells();
    renderSetup();
    if (data?.state) {
      G.state = data.state;
      G.state.rng ||= makeRng(freshSeed());
      G.state.over ??= G.state.winner != null;
      G.busy = false;
      buildTokens();
      render();
      age(true);
      queueCpu();
    } else {
      startGame();
      if (!data?.setup && !loadSelf() && !location.hash) openNaming();
    }
    draw();
    renderCodex();
    showTab("moves");
    openFromHash();
  }
  window.claude?.hot?.snapshot?.(() => ({ setup: { ...G.setup, lang }, state: G.state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {
    }));
  }
})();
</script>
</body>
</html>
