<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moksha Patam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The old Indian game of snakes and ladders, played as one life, with a story from the Panchatantra or the Upanishads on every square. In English and Hindi.">
<meta name="theme-color" content="#B5261E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Moksha Patam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&display=swap">
<!-- Hind draws Devanagari digits in Western shapes, so the ten digits come from Noto instead -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700&text=%E0%A5%A6%E0%A5%A7%E0%A5%A8%E0%A5%A9%E0%A5%AA%E0%A5%AB%E0%A5%AC%E0%A5%AD%E0%A5%AE%E0%A5%AF&display=swap">
<!-- Card text: a book face for English and a Devanagari text face for Hindi -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;display=swap">
<!-- @style -->
</head>
<body>
<!-- @sprites -->

<div class="wrap">
  <header>
    <h1 data-t="title">Moksha Patam</h1>
    <div class="tools">
      <button type="button" class="ghost icon" id="mute" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Language / भाषा">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
      </div>
    </div>
  </header>

  <div class="game">
    <div class="board-col">
      <div class="board-frame">
        <div class="vimana" id="vimana" aria-hidden="true"></div>
        <div class="board-wrap" id="board">
          <div class="ashramas" id="ashramas" aria-hidden="true"></div>
          <!-- the stage clips the camera; cam is what it moves -->
          <div class="board-stage" id="stage"><div class="cam" id="cam">
            <div class="cells" id="cells"></div>
            <canvas id="art"></canvas>
            <canvas id="age"></canvas>
            <!-- the door and the wheel of time on 105 (render/door.js): drawn, and told in words elsewhere -->
            <div class="gate" id="door" aria-hidden="true" hidden></div>
            <div class="labels" id="labels"></div>
            <canvas id="fx"></canvas>
            <div class="tokens" id="tokens"></div>
          </div></div>
          <div id="toastSlot"></div>
          <div class="win" id="win" hidden>
            <div>
              <h2 id="winTitle"></h2>
              <p id="winText"></p>
              <button id="readLife" type="button" data-t="readLife">Read the lives</button>
              <button id="again" type="button" class="ghost" data-t="again">Play again</button>
            </div>
          </div>
        </div>
      </div>
      <button type="button" class="landed" id="landed" aria-live="polite" data-empty tabindex="-1"></button>
      <div class="tray"><span class="label" data-t="start">Start</span><span class="slots" id="tray"></span></div>
    </div>

    <aside class="panel">
      <section class="card" aria-live="polite">
        <span class="eyebrow" data-t="turn">Turn</span>
        <div class="turn"><span class="dot" id="turnDot"></span><span id="turnName"></span></div>
        <div class="roll-row">
          <div class="dice"><div class="die" id="die" aria-label="Die"></div><div class="die" id="die2" aria-label="Die" hidden></div></div>
          <div class="roll-info">
            <button id="roll" type="button">Roll the die</button>
            <div class="pick" id="pick" role="group" hidden></div>
            <span class="hint" id="hint"></span>
          </div>
        </div>
      </section>

      <section class="card">
        <span class="eyebrow" data-t="players">Players</span>
        <ul class="players" id="players"></ul>
      </section>

      <section class="card" id="ledgerCard" hidden>
        <span class="eyebrow" data-t="ledgerHead">Ledger</span>
        <ul class="players" id="ledger"></ul>
        <p class="hint" id="ledgerNote"></p>
      </section>

      <section class="card">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tabMoves" aria-controls="log" aria-selected="true" data-t="moves">Moves</button>
          <button type="button" role="tab" id="tabCodex" aria-controls="codexPanel" aria-selected="false"><span data-t="codex">Codex</span> <span class="count" id="codexCount"></span></button>
        </div>
        <ul class="log" id="log" role="tabpanel" aria-labelledby="tabMoves"></ul>
        <div class="codex" id="codexPanel" role="tabpanel" aria-labelledby="tabCodex" hidden></div>
      </section>

      <details class="card" id="setup">
        <summary data-t="setup">Players &amp; rules</summary>
        <div class="setup-body">
          <div class="seg" id="count" role="group"></div>
          <div id="prows" class="setup-body"></div>
          <label class="check"><input type="checkbox" id="ruleSix" checked> <span data-t="ruleSix"></span></label>
          <label class="pick"><span data-t="depth"></span><select id="prefDepth"></select></label>
          <span class="hint depth-hint" data-t="depthHint"></span>
          <label class="check"><input type="checkbox" id="prefEvery"> <span data-t="everyCard"></span></label>
          <label class="check"><input type="checkbox" id="prefBoth"> <span data-t="cardBoth"></span></label>
          <label class="pick"><span data-t="theme"></span><select id="prefTheme"></select></label>
          <button id="newGame" type="button" data-t="newGame">Start new game</button>
          <span class="hint" id="seed"></span>
        </div>
      </details>
      <section class="card colophon"><p data-t="intro"></p></section>
    </aside>
  </div>
</div>

<dialog class="folio" id="folio" aria-labelledby="leafTitle">
  <article class="leaf" id="leaf" aria-live="polite"></article>
</dialog>

<!-- The naming, before the board (docs/NARRATIVE.md §3) -->
<dialog class="folio naming" id="naming" aria-labelledby="namingTitle">
  <form method="dialog" class="leaf naming-leaf" id="namingForm">
    <header class="leaf-top">
      <span class="eb" data-t="title">Moksha Patam</span>
      <div class="lang-mini" role="group" aria-label="Language / भाषा">
        <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="hi" lang="hi" aria-pressed="false">हिं</button>
      </div>
    </header>
    <div class="naming-body">
      <h2 id="namingTitle" data-t="namingTitle">Nāmakaraṇa</h2>
      <p class="naming-line" data-t="namingLine"></p>
      <fieldset class="naming-field" id="namingWho">
        <legend data-t="namingWho">Who is playing?</legend>
        <div class="naming-genders" id="namingWhoOpts"></div>
      </fieldset>
      <p class="naming-step" id="namingStep" hidden></p>
      <label class="naming-field"><span data-t="namingName">Name</span>
        <input type="text" id="namingName" maxlength="16" autocomplete="given-name" spellcheck="false">
      </label>
      <fieldset class="naming-field">
        <legend data-t="namingAs">Born</legend>
        <div class="naming-genders" id="namingGenders">
          <label><input type="radio" name="gender" value="f" required> <span data-t="genderF"></span></label>
          <label><input type="radio" name="gender" value="m"> <span data-t="genderM"></span></label>
          <label><input type="radio" name="gender" value="n"> <span data-t="genderN"></span></label>
        </div>
        <span class="hint" data-t="genderWhy"></span>
      </fieldset>
      <div class="naming-act">
        <button type="submit" id="namingBegin">Begin</button>
        <button type="button" id="namingBack" data-t="namingBack" hidden>Back</button>
      </div>
    </div>
  </form>
</dialog>

<!-- The life account, at the end of a game (docs/NARRATIVE.md §9) -->
<dialog class="folio life" id="lifeDlg" aria-labelledby="lifeTitle">
  <article class="leaf life-leaf" id="lifeLeaf"></article>
</dialog>

<!-- @script -->
</body>
</html>
