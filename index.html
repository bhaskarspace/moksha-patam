      schools: [{ id: "advaita", en: "Śaṅkara lists what a student must bring before a teacher will begin, and money is not on it. First comes the ability to tell the lasting from the passing (nityānitya-vastu-viveka).", hi: "शंकर गिनाते हैं कि गुरु के शुरू करने से पहले शिष्य को क्या लाना चाहिए, और धन उसमें नहीं है। सबसे पहले नित्य और अनित्य को अलग पहचानने की क्षमता (नित्यानित्य-वस्तु-विवेक)।" }, { id: "mimamsa", en: "Mīmāṃsā asks for no inner readiness, only eligibility and the injunction. The boy is told to study his Veda, and being told is reason enough.", hi: "मीमांसा कोई भीतरी तैयारी नहीं माँगती, केवल अधिकार और विधि। बालक से वेद पढ़ने को कहा गया है, और कहा जाना ही पर्याप्त कारण है।" }]
    },
    "22": {
      scholar: { en: "From the Panchatantra's fifth book. The lesson is aimed at the princes who are hearing it: a learned fool is more dangerous than an ignorant one.", hi: "पंचतंत्र की पाँचवीं पुस्तक से। यह सीख उन राजकुमारों के लिए है जो इसे सुन रहे हैं: विद्वान मूर्ख, अनपढ़ मूर्ख से अधिक खतरनाक है।" },
      schools: [{ id: "nyaya", en: "The brothers reasoned 'we can make it live, so we should'. Nyāya would say they never checked the limiting condition (upādhi): a living lion eats whoever is nearest.", hi: "भाइयों ने तर्क किया 'हम इसे जीवित कर सकते हैं, तो करना चाहिए'। न्याय कहता कि उन्होंने उपाधि कभी नहीं जाँची: जीवित शेर जो पास हो उसी को खाता है।" }, { id: "samkhya", en: "Sāṃkhya would blame the strand, not the logic. Knowledge held in a rajasic mind is used to do something, not to see something.", hi: "सांख्य तर्क को नहीं, गुण को दोष देता। राजसिक मन में रखा ज्ञान कुछ करने के काम आता है, कुछ देखने के नहीं।" }]
    },
    "23": {
      iast: "Guru-bhakti",
      scholar: { en: "Āruṇi of Pāñcāla was a student of Āyoda Dhaumya, in the Pauṣya Parva of the Mahābhārata. His teacher renamed him Uddālaka, 'the one who rose up', when he got up out of the breach.", hi: "पांचाल के आरुणि आयोद धौम्य के शिष्य थे, महाभारत के पौष्य पर्व में। जब वे मेड़ से उठकर निकले, तो गुरु ने उनका नाम उद्दालक रखा, 'जो ऊपर उठा'।" },
      schools: [{ id: "mimamsa", en: "For Mīmāṃsā, Āruṇi was simply doing what is enjoined: the student serves the teacher, and the duty does not ask how cold the water is.", hi: "मीमांसा के लिए आरुणि वही कर रहे थे जिसका विधान है: शिष्य गुरु की सेवा करता है, और कर्तव्य यह नहीं पूछता कि पानी कितना ठंडा है।" }, { id: "dvaita", en: "Madhva's tradition reads it the other way round: devotion is the means, not the fee. Āruṇi's knowledge came by his teacher's grace, not as payment.", hi: "मध्व की परंपरा इसे उलटा पढ़ती है: भक्ति साधन है, शुल्क नहीं। आरुणि का ज्ञान गुरु की कृपा से आया, भुगतान के रूप में नहीं।" }]
    },
    "24": {
      schools: [{ id: "advaita", en: "Advaita has a word for what the lion did: adhyāsa, superimposition, taking one thing for another. Taking the body for the Self, it says, is the same leap at a reflection.", hi: "अद्वैत के पास शेर की गलती का शब्द है: अध्यास, एक को दूसरा मान लेना। शरीर को आत्मा मान लेना, वह कहता है, प्रतिबिंब पर वही छलाँग है।" }, { id: "nyaya", en: "Nyāya would call it an error with a cause: the water showed a real lion, his own, in the wrong place (anyathākhyāti).", hi: "न्याय इसे कारण वाली भ्रांति कहता: पानी ने एक असली शेर दिखाया, उसका अपना, गलत जगह पर (अन्यथाख्याति)।" }]
    },
    "25": {
      iast: "Gāyatrī",
      scholar: { en: "Ṛg Veda 3.62.10, seen by Viśvāmitra and addressed to Savitṛ, the sun as the one who sets things moving. The dogs' chant (Chāndogya 1.12) was read by Max Müller and Paul Deussen as satire on priests; other scholars read it straight.", hi: "ऋग्वेद ३.६२.१०, विश्वामित्र द्वारा देखा गया और सविता, गति देने वाले सूर्य, को संबोधित। कुत्तों के उद्गीथ (छांदोग्य १.१२) को मैक्स म्यूलर और पॉल डॉयसन ने पुरोहितों पर व्यंग्य पढ़ा; दूसरे विद्वान इसे सीधा पढ़ते हैं।" },
      schools: [{ id: "carvaka", en: "The Cārvākas said the Veda's authors were buffoons, knaves and night-prowlers, and the Chāndogya nearly agrees. In 1.12 dogs file past in a line, each holding the tail of the one in front, chanting 'Om, let us eat!'", hi: "चार्वाकों ने कहा कि वेद के रचयिता भांड, धूर्त और निशाचर थे, और छांदोग्य लगभग सहमत है। १.१२ में कुत्ते कतार में चलते हैं, हर एक आगे वाले की पूँछ पकड़े, और गाते हैं 'ॐ, हम खाएँ!'" }, { id: "mimamsa", en: "Mīmāṃsā answers that the sound works whoever is hungry. A mantra's power lies in the words and the injunction, not in the motive of the one who chants it.", hi: "मीमांसा का उत्तर है कि ध्वनि काम करती है, भूखा चाहे कोई हो। मंत्र की शक्ति शब्दों और विधि में है, गाने वाले के प्रयोजन में नहीं।" }],
      figures: ["vishvamitra"]
    },
    "26": {
      iast: "Samit-pāṇi",
      schools: [{ id: "advaita", en: "Śaṅkara read this verse strictly: the Self is known from scripture heard from a teacher, not worked out alone. Even the most learned must go with fuel in hand.", hi: "शंकर ने इस मंत्र को कठोरता से पढ़ा: आत्मा गुरु से सुने शास्त्र से जानी जाती है, अकेले सोचकर नहीं। सबसे विद्वान को भी हाथ में समिधा लेकर जाना होता है।" }, { id: "nyaya", en: "Nyāya would accept the teacher but not the monopoly. Inference is a means of knowledge too, and a seeker may reason as well as listen.", hi: "न्याय गुरु को मानता पर एकाधिकार को नहीं। अनुमान भी ज्ञान का साधन है, और जिज्ञासु सुनने के साथ तर्क भी कर सकता है।" }]
    },
    "27": {
      scholar: { en: "The six asked where beings come from, which powers hold up the body, where breath comes from, what sleeps and what wakes, what meditating on Om attains, and who the person of sixteen parts is.", hi: "छहों ने पूछा: प्राणी कहाँ से आते हैं, कौन सी शक्तियाँ शरीर को धारण करती हैं, प्राण कहाँ से आता है, कौन सोता है और कौन जागता है, ॐ के ध्यान से क्या मिलता है, और सोलह कलाओं वाला पुरुष कौन है।" },
      schools: [{ id: "bauddha", en: "The Buddha refused questions too, but differently. A man with an arrow in him should not ask who shot it. Pippalāda says wait a year and then ask; the Buddha says some questions are never worth asking.", hi: "बुद्ध ने भी प्रश्न टाले, पर अलग ढंग से। जिसे तीर लगा हो उसे यह नहीं पूछना चाहिए कि किसने चलाया। पिप्पलाद कहते हैं साल भर रुको फिर पूछो; बुद्ध कहते हैं कुछ प्रश्न कभी पूछने लायक नहीं।" }, { id: "nyaya", en: "Nyāya would not make them wait at all. Doubt (saṃśaya) is where reasoning begins, and a question held back for a year is a year of inquiry lost.", hi: "न्याय उन्हें बिल्कुल न रुकवाता। संशय से ही तर्क शुरू होता है, और साल भर रोका गया प्रश्न जिज्ञासा का खोया हुआ साल है।" }],
      figures: ["buddha"]
    },
    "28": {
      iast: "Satya",
      scholar: { en: "His mother Jabālā had told him: 'I do not know your lineage. You are Satyakāma, son of Jabālā.' The teacher Gautama accepted him, saying only a true brahmin would speak so plainly.", hi: "उसकी माँ जबाला ने कहा था: 'मैं तुम्हारा गोत्र नहीं जानती। तुम सत्यकाम जाबाल हो।' गुरु गौतम ने उसे यह कहकर स्वीकार किया कि इतना सीधा सच कोई सच्चा ब्राह्मण ही बोलेगा।" },
      schools: [{ id: "nyaya", en: "Nyāya would note what Gautama actually did: he inferred birth from conduct, taking a mark (liṅga) for a fact that nobody could check.", hi: "न्याय देखता कि गौतम ने असल में क्या किया: उन्होंने आचरण से जन्म का अनुमान किया, एक लिंग को उस तथ्य का प्रमाण माना जिसे कोई जाँच नहीं सकता था।" }, { id: "mimamsa", en: "Mīmāṃsā cared about eligibility (adhikāra), and lineage was its usual test. Gautama's verdict quietly put a different test in its place.", hi: "मीमांसा अधिकार को महत्व देती थी, और गोत्र उसकी सामान्य कसौटी था। गौतम के निर्णय ने चुपचाप उसकी जगह दूसरी कसौटी रख दी।" }]
    },
    "29": {
      iast: "Ālasya",
      schools: [{ id: "bauddha", en: "For the Buddhists sloth and torpor (thīna-middha) are one of five hindrances, and the cure is not shame but effort (vīriya).", hi: "बौद्धों के लिए आलस्य और तंद्रा (थीन-मिद्ध) पाँच बाधाओं में से एक है, और उपचार लज्जा नहीं, वीर्य है।" }, { id: "carvaka", en: "A Cārvāka would ask whose enemy it is. If the body is the self, its rest is not a betrayal; it is the self getting what it wants.", hi: "चार्वाक पूछता कि यह किसका शत्रु है। यदि शरीर ही आत्मा है, तो उसका विश्राम विश्वासघात नहीं; यह आत्मा को वह मिलना है जो वह चाहती है।" }]
    },
    "30": {
      iast: "Satyaṃ vada, dharmaṃ cara",
      schools: [{ id: "jaina", en: "The Jains keep satya as a great vow and add a condition the Upaniṣad does not: a truth that will cause harm is not to be spoken.", hi: "जैन सत्य को महाव्रत मानते हैं और एक शर्त जोड़ते हैं जो उपनिषद् नहीं जोड़ता: जिस सच से हानि हो, वह नहीं बोलना चाहिए।" }, { id: "nyaya", en: "Nyāya would ask who is giving the command. An order is only as good as its speaker, and the Veda binds because a reliable speaker gave it.", hi: "न्याय पूछता कि आदेश कौन दे रहा है। आदेश उतना ही अच्छा है जितना उसका वक्ता, और वेद इसलिए बाध्य करता है कि एक विश्वसनीय वक्ता ने उसे दिया।" }]
    },
    "31": {
      schools: [{ id: "carvaka", en: "The Cārvāka reply, at full strength: would you throw away the rice because it comes in husks? Pleasure always comes mixed with pain, and that is a reason to husk carefully, not to stop eating.", hi: "चार्वाक का उत्तर, पूरी ताकत से: क्या भूसी के कारण चावल फेंक दोगे? सुख हमेशा दुःख के साथ आता है, और यह सावधानी से कूटने का कारण है, खाना छोड़ने का नहीं।" }, { id: "bauddha", en: "The Buddha agreed with Yayāti's diagnosis and refused his despair: craving can end, and the Middle Way is how.", hi: "बुद्ध ययाति के निदान से सहमत थे पर उनकी निराशा से नहीं: तृष्णा समाप्त हो सकती है, और मध्यम मार्ग उसका उपाय है।" }],
      scholar: { en: "Yayāti's verse, 'na jātu kāmaḥ kāmānām upabhogena śāmyati', is one of the most quoted lines in Sanskrit. Manu repeats it (2.94).", hi: "ययाति का श्लोक, 'न जातु कामः कामानामुपभोगेन शाम्यति', संस्कृत की सबसे अधिक उद्धृत पंक्तियों में से है। मनु इसे दोहराते हैं (२.९४)।" }
    },
    "32": {
      schools: [{ id: "advaita", en: "Advaita takes the lesson at its word: the Self pervades you as salt pervades water, everywhere and nowhere in particular.", hi: "अद्वैत इस पाठ को शब्दशः लेता है: आत्मा आपमें वैसे ही व्याप्त है जैसे जल में नमक, हर जगह और किसी एक जगह नहीं।" }, { id: "nyaya", en: "Nyāya would add: the Self is not seen either, but it can be inferred from its marks, which are desire, aversion, effort, pleasure, pain and knowing (Nyāya Sūtra 1.1.10).", hi: "न्याय जोड़ता: आत्मा भी दिखती नहीं, पर उसके लक्षणों से उसका अनुमान होता है: इच्छा, द्वेष, प्रयत्न, सुख, दुःख और ज्ञान (न्यायसूत्र १.१.१०)।" }],
      figures: ["uddalaka"]
    },
    "33": {
      schools: [{ id: "samkhya", en: "Sāṃkhya: the tree was already in the seed. An effect pre-exists in its cause (satkāryavāda); otherwise, why does oil come from sesame and never from sand?", hi: "सांख्य: वृक्ष पहले से बीज में था। कार्य कारण में पहले से रहता है (सत्कार्यवाद); नहीं तो तेल तिल से ही क्यों निकलता है, रेत से कभी क्यों नहीं?" }, { id: "vaisheshika", en: "Vaiśeṣika: no, the tree is new. Atoms combine into a whole that did not exist before (asatkāryavāda). If the tree were already there, why plant anything?", hi: "वैशेषिक: नहीं, वृक्ष नया है। परमाणु मिलकर एक ऐसा संपूर्ण बनाते हैं जो पहले नहीं था (असत्कार्यवाद)। यदि वृक्ष पहले से था, तो कुछ बोना ही क्यों?" }],
      figures: ["uddalaka", "kapila", "kanada"],
      scholar: { en: "Kaṇāda, Vaiśeṣika's founder, would say the seed's 'nothing' has structure: the smallest thing you can see, a mote in a sunbeam, still has parts, down to partless atoms (paramāṇu), paired into dyads, and dyads into triads.", hi: "वैशेषिक के प्रवर्तक कणाद कहते कि बीज के 'कुछ नहीं' की भी संरचना है: सबसे छोटी दिखने वाली चीज़, धूप में तैरता कण, उसके भी अंग हैं, नीचे निरवयव परमाणु तक, जो जुड़कर द्व्यणुक और द्व्यणुक त्र्यणुक बनाते हैं।" }
    },
    "34": {
      iast: "Śraddhā",
      scholar: { en: "It began with a hollow sacrifice: his father Vājaśravas gave away cows too old to give milk. 'To whom will you give me?' the boy asked, three times. 'To Death,' said his father, and the boy went.", hi: "यह एक खोखले यज्ञ से शुरू हुआ: उसके पिता वाजश्रवा ने ऐसी गायें दान कीं जो दूध देने लायक नहीं थीं। 'मुझे किसे दोगे?' बालक ने तीन बार पूछा। 'मृत्यु को,' पिता बोले, और बालक चला गया।" },
      schools: [{ id: "nyaya", en: "Nyāya would warn Naciketas what he is asking for. Liberation is the end of pain, not bliss, and it comes only after death, so Death is the right person to ask.", hi: "न्याय नचिकेता को चेताता कि वह क्या माँग रहा है। मुक्ति दुःख का अंत है, आनंद नहीं, और वह केवल मृत्यु के बाद मिलती है, इसलिए पूछने के लिए यम ही सही व्यक्ति हैं।" }, { id: "advaita", en: "Advaita reads it differently: Naciketas wanted the Self, not an afterlife, and waiting three days unfed is what wanting it looks like.", hi: "अद्वैत इसे अलग पढ़ता है: नचिकेता आत्मा चाहता था, परलोक नहीं, और तीन दिन भूखे प्रतीक्षा करना उसी चाह का रूप है।" }]
    },
    "35": {
      schools: [{ id: "samkhya", en: "The Katha's ladder goes on: beyond the senses the mind, beyond the mind the intellect, beyond that the unmanifest, then the Person. Sāṃkhya would later count these as its tattvas.", hi: "कठ की सीढ़ी आगे जाती है: इंद्रियों से परे मन, मन से परे बुद्धि, उससे परे अव्यक्त, फिर पुरुष। सांख्य ने आगे चलकर इन्हें अपने तत्त्वों में गिना।" }, { id: "nyaya", en: "Nyāya would take the chariot as an argument: a chariot needs a driver, and a body that acts needs a self to direct it.", hi: "न्याय रथ को एक तर्क मानता: रथ को सारथी चाहिए, और कर्म करने वाले शरीर को चलाने के लिए आत्मा।" }]
    },
    "36": {
      iast: "Tat tvam asi",
      views: [{ id: "advaita", en: "Śaṅkara: identity. 'You' minus the body and mind is the same as 'That', Brahman. Nothing is joined; an error is removed.", hi: "शंकर: अभेद। शरीर और मन हटाकर 'तुम' वही है जो 'तत्', ब्रह्म। कुछ जुड़ता नहीं; एक भूल मिटती है।" }, { id: "vishishtadvaita", en: "Rāmānuja: 'you' is a mode of Brahman, as a body is of its indweller. One reality, with real differences inside it.", hi: "रामानुज: 'तुम' ब्रह्म का एक प्रकार है, जैसे शरीर अपने अंतर्यामी का। एक सत्य, जिसके भीतर वास्तविक भेद हैं।" }, { id: "dvaita", en: "Madhva splits the sandhi differently: 'sa ātmā atat tvam asi', you are not That. The soul is like God, and forever distinct.", hi: "मध्व संधि को अलग तोड़ते हैं: 'स आत्मा अतत् त्वम् असि', तुम वह नहीं हो। जीव ईश्वर जैसा है, पर सदा भिन्न।" }],
      scholar: { en: "Uddālaka says it nine times, at the end of nine lessons. Modern translators add a fourth reading: Brereton, Olivelle and Doniger render it 'that's how you are', a description, and deny it is an identity claim at all.", hi: "उद्दालक इसे नौ बार कहते हैं, नौ पाठों के अंत में। आधुनिक अनुवादक एक चौथा पाठ जोड़ते हैं: ब्रेरेटन, ओलिवेल और डोनिगर इसे 'तुम ऐसे ही हो' अनुवाद करते हैं, एक वर्णन, और इसे अभेद का दावा मानते ही नहीं।" },
      figures: ["uddalaka", "shankara", "ramanuja", "madhva"]
    },
    "37": {
      schools: [{ id: "nyaya", en: "Nyāya counts a teacher's word as śabda, a means of knowledge in its own right, valid because the speaker is reliable (āpta).", hi: "न्याय गुरु के वचन को शब्द प्रमाण मानता है, अपने आप में ज्ञान का एक साधन, जो इसलिए मान्य है कि वक्ता विश्वसनीय (आप्त) है।" }, { id: "carvaka", en: "The Cārvāka answer: testimony is not knowledge. It is someone else's perception reported to you, and you can only check it by looking yourself.", hi: "चार्वाक का उत्तर: शब्द ज्ञान नहीं है। वह किसी और का प्रत्यक्ष है जो आपको बताया गया, और उसे जाँचने का एक ही तरीका है, खुद देखना।" }]
    },
    "38": {
      iast: "Samāvartana",
      scholar: { en: "The returning student is a snātaka, 'one who has bathed'. The bath marks the end of brahmacarya and the start of eligibility to marry.", hi: "लौटता विद्यार्थी स्नातक कहलाता है, 'जिसने स्नान किया'। यह स्नान ब्रह्मचर्य का अंत और विवाह की पात्रता का आरंभ है।" },
      schools: [{ id: "mimamsa", en: "Mīmāṃsā reads the farewell as a list of injunctions, each binding on its own, and the most useful part of the speech.", hi: "मीमांसा विदाई को विधियों की सूची पढ़ती है, हर एक अपने आप में बाध्यकारी, और भाषण का सबसे काम का हिस्सा।" }, { id: "advaita", en: "Advaita points at the last clause: the teacher admits that injunctions run out, and after that you are on your own judgement.", hi: "अद्वैत अंतिम वाक्य की ओर इशारा करता है: गुरु मानते हैं कि विधियाँ कहीं खत्म हो जाती हैं, और उसके बाद आप अपने विवेक पर हैं।" }]
    },
    "39": {
      iast: "Vidyā-mada",
      schools: [{ id: "nyaya", en: "Nyāya ranked kinds of debate: honest inquiry (vāda), arguing to win (jalpa), and pure demolition with no thesis of your own (vitaṇḍā). The three brothers had learning without vāda.", hi: "न्याय ने कथा के प्रकार गिनाए: सच्ची जिज्ञासा (वाद), जीतने के लिए तर्क (जल्प), और अपना पक्ष रखे बिना केवल खंडन (वितंडा)। तीन भाइयों के पास विद्या थी, वाद नहीं।" }, { id: "jaina", en: "The Jains would say each side had part of the truth: the lion could be made to live, and the fourth brother was right that it would kill.", hi: "जैन कहते कि हर पक्ष के पास सत्य का एक अंश था: शेर को जिलाया जा सकता था, और चौथा भाई सही था कि वह मार डालेगा।" }]
    },
    "40": {
      iast: "Svādhyāya",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā starts here. 'One's own Veda must be studied' (svādhyāyo 'dhyetavyaḥ) is the injunction its commentators take as the ground of the whole inquiry.", hi: "मीमांसा यहीं से शुरू होती है। 'स्वाध्यायोऽध्येतव्यः' (अपने वेद का अध्ययन करना चाहिए) वह विधि है जिसे इसके भाष्यकार पूरी जिज्ञासा का आधार मानते हैं।" }, { id: "advaita", en: "Śaṅkara would side with none of the three: study, truth and austerity purify the mind, but none of them is the knowledge they prepare it for.", hi: "शंकर तीनों में से किसी का पक्ष न लेते: स्वाध्याय, सत्य और तप मन को शुद्ध करते हैं, पर इनमें से कोई भी वह ज्ञान नहीं जिसके लिए वे तैयार करते हैं।" }]
    },
    "41": {
      iast: "Vivāha · saptapadī",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā debated who may sacrifice and concluded that the householder does so jointly with his wife. The fire of the wedding is the fire of their rites.", hi: "मीमांसा ने विचार किया कि यज्ञ कौन कर सकता है और निष्कर्ष निकाला कि गृहस्थ अपनी पत्नी के साथ मिलकर करता है। विवाह की अग्नि ही उनके यज्ञों की अग्नि है।" }, { id: "carvaka", en: "The Cārvāka would keep the friendship and drop the fire. A marriage needs no witness the couple cannot see.", hi: "चार्वाक मित्रता रखता और अग्नि छोड़ देता। विवाह को ऐसे साक्षी की ज़रूरत नहीं जिसे दंपति देख न सकें।" }]
    },
    "42": {
      iast: "Gṛha",
      scholar: { en: "Manu calls the householder the highest āśrama, because all the others live on what it gives. The same text's rules on caste and on women have been contested from its own time to now.", hi: "मनु गृहस्थ को सबसे श्रेष्ठ आश्रम कहते हैं, क्योंकि बाकी सब उसी के दिए पर जीते हैं। इसी ग्रंथ के जाति और स्त्रियों संबंधी नियम अपने समय से आज तक विवादित रहे हैं।" },
      schools: [{ id: "mimamsa", en: "Mīmāṃsā takes Manu's side completely: the householder's rites are dharma, and doing them well is the whole of a good life.", hi: "मीमांसा पूरी तरह मनु के पक्ष में है: गृहस्थ के कर्म धर्म हैं, और उन्हें अच्छे से करना ही अच्छे जीवन का सार है।" }, { id: "samkhya", en: "Sāṃkhya would ask whether those acts bind or free. Every act of the household is prakṛti busy with itself, and none of it touches the witness.", hi: "सांख्य पूछता कि वे कर्म बाँधते हैं या मुक्त करते हैं। घर का हर कर्म प्रकृति का अपने आप में व्यस्त होना है, और उसमें से कुछ भी साक्षी को नहीं छूता।" }]
    },
    "43": {
      schools: [{ id: "carvaka", en: "The Cārvāka verse: while you live, live happily; borrow and drink ghee. The jackal made the opposite mistake: he went hungry now to feast later.", hi: "चार्वाक का श्लोक: जब तक जियो सुख से जियो; ऋण लेकर भी घी पियो। सियार ने उल्टी भूल की: बाद में दावत के लिए अभी भूखा रहा।" }, { id: "mimamsa", en: "Mīmāṃsā would say the jackal knew the goal and not the procedure. An act works only when its parts are done in the right order, which is why the school spent centuries on the order of rites.", hi: "मीमांसा कहती कि सियार लक्ष्य जानता था, विधि नहीं। कर्म तभी फल देता है जब उसके अंग सही क्रम में हों, इसीलिए इस दर्शन ने कर्मकांड के क्रम पर सदियाँ लगाईं।" }]
    },
    "44": {
      iast: "Dāna · datta",
      schools: [{ id: "bauddha", en: "In Buddhism, generosity (dāna) is the first of the perfections. Its fruit is less in what is given than in the loosening of the hand that gives.", hi: "बौद्ध धर्म में दान पहली पारमिता है। इसका फल दी गई वस्तु में कम, देने वाले हाथ की पकड़ ढीली होने में अधिक है।" }, { id: "mimamsa", en: "Mīmāṃsā reads datta as an injunction with a fruit: give, and the gift comes back as merit. The Buddhists would say that thinking so spoils the gift.", hi: "मीमांसा दत्त को फल वाली विधि पढ़ती है: दो, और दान पुण्य बनकर लौटता है। बौद्ध कहते कि ऐसा सोचना ही दान को बिगाड़ देता है।" }],
      scholar: { en: "Prajāpati's children came for teaching and he said one syllable, 'da'. The gods heard dāmyata, be restrained; humans heard datta, give; the asuras heard dayadhvam, be compassionate. The thunder still says it: da da da.", hi: "प्रजापति की संतानें उपदेश के लिए आईं और उन्होंने एक अक्षर कहा, 'द'। देवों ने सुना दाम्यत, संयम करो; मनुष्यों ने दत्त, दान करो; असुरों ने दयध्वम्, दया करो। मेघ आज भी यही कहता है: द द द।" }
    },
    "45": {
      scholar: { en: "His teacher sent him off with four hundred thin cows and he stayed away until they were a thousand. On the way back a bull, a fire, a swan and a diver-bird each taught him a quarter of Brahman.", hi: "गुरु ने उसे चार सौ दुबली गायों के साथ भेजा और वह तब तक लौटा नहीं जब तक वे हज़ार न हो गईं। लौटते हुए एक बैल, अग्नि, हंस और जलपक्षी ने उसे ब्रह्म का एक-एक पाद सिखाया।" },
      schools: [{ id: "nyaya", en: "His face shining is a liṅga, a sign to infer from. Nyāya would say his teacher reasoned correctly: from the glow, infer the knowing.", hi: "उसका चमकता मुख एक लिंग है, अनुमान का चिह्न। न्याय कहता कि उसके गुरु ने ठीक तर्क किया: चमक से ज्ञान का अनुमान।" }, { id: "carvaka", en: "The Cārvāka would say what anyone actually saw: a young man came home with a thousand cows. A man with a thousand cows looks pleased.", hi: "चार्वाक वही कहता जो किसी ने सचमुच देखा: एक युवक हज़ार गायें लेकर घर लौटा। हज़ार गायों वाला आदमी प्रसन्न दिखता ही है।" }]
    },
    "46": {
      scholar: { en: "Kurukṣetra is also where the Bhagavad Gītā is spoken, to a man refusing to fight his own family. The board puts the war on the snake's tail; the Gītā puts it at the start of a teaching.", hi: "कुरुक्षेत्र वही स्थान है जहाँ भगवद्गीता कही गई, उस व्यक्ति से जो अपने ही परिवार से लड़ने से मना कर रहा था। बोर्ड युद्ध को साँप की पूँछ पर रखता है; गीता उसे एक उपदेश के आरंभ में।" },
      schools: [{ id: "jaina", en: "The Jain doctrine of many-sidedness (anekāntavāda) would say everyone in that war held part of the truth, and the war came from each mistaking his part for the whole.", hi: "जैन अनेकांतवाद कहता कि उस युद्ध में हर किसी के पास सत्य का एक अंश था, और युद्ध इसलिए हुआ कि हर एक ने अपने अंश को पूरा सत्य समझ लिया।" }, { id: "mimamsa", en: "Mīmāṃsā would be blunter: the duty was stated, more than once, and ignored. There is nothing many-sided about that.", hi: "मीमांसा अधिक सीधी होती: कर्तव्य बताया गया, एक से अधिक बार, और अनसुना किया गया। इसमें कुछ अनेकांत नहीं।" }]
    },
    "47": {
      iast: "Kāma",
      schools: [{ id: "bauddha", en: "The Buddha's second noble truth names it: suffering arises from craving (taṇhā), and craving is exactly the fire Yayāti kept feeding.", hi: "बुद्ध का दूसरा आर्य सत्य इसका नाम लेता है: दुःख तृष्णा से उत्पन्न होता है, और तृष्णा ठीक वही आग है जिसे ययाति खिलाते रहे।" }, { id: "carvaka", en: "The Cārvāka would say Yayāti's only mistake was giving the youth back. Desire unquenched is still desire enjoyed.", hi: "चार्वाक कहता कि ययाति की एकमात्र भूल यौवन लौटाना थी। अतृप्त इच्छा भी भोगी हुई इच्छा ही है।" }],
      scholar: { en: "Kāma is also one of the four aims of life (puruṣārtha), alongside dharma, artha and mokṣa. The snake is craving; the aim is desire kept within dharma.", hi: "काम जीवन के चार पुरुषार्थों में से भी एक है, धर्म, अर्थ और मोक्ष के साथ। साँप तृष्णा है; पुरुषार्थ धर्म की सीमा में रखी गई इच्छा है।" }
    },
    "48": {
      iast: "Uṣasti Cākrāyaṇa",
      schools: [{ id: "advaita", en: "Bādarāyaṇa's Brahma Sūtra (3.4.28) cites Uṣasti for exactly this rule: one who knows may eat any food, but only when life is at stake. Śaṅkara says the water proves it.", hi: "बादरायण का ब्रह्मसूत्र (३.४.२८) ठीक इसी नियम के लिए उषस्ति का उदाहरण देता है: ज्ञानी कोई भी अन्न खा सकता है, पर केवल प्राण संकट में हों तब। शंकर कहते हैं कि जल इसका प्रमाण है।" }, { id: "carvaka", en: "The Cārvāka would admire the beans and laugh at the water. A man who will eat leftovers to live has already conceded that the body comes first.", hi: "चार्वाक उड़द की प्रशंसा करता और जल पर हँसता। जो जीने के लिए जूठा खा ले, वह पहले ही मान चुका है कि शरीर पहले आता है।" }],
      scholar: { en: "Chāndogya 1.10–11. The Kurus' fields had been struck by hail. Next morning Uṣasti walks into the king's sacrifice and asks each priest whether he knows the deity of his chant. This square used to carry 'food is Brahman' (Taittirīya 3.7–9); Uṣasti is what that sentence looks like when there is no food.", hi: "छांदोग्य १.१०–११। कुरुओं के खेत ओलों से नष्ट हो चुके थे। अगली सुबह उषस्ति राजा के यज्ञ में पहुँचते हैं और हर पुरोहित से पूछते हैं कि क्या वह अपने गान का देवता जानता है। यह खाना पहले 'अन्नं ब्रह्म' (तैत्तिरीय ३.७–९) था; अन्न न हो तो वह वाक्य कैसा दिखता है, उषस्ति वही है।" },
      figures: ["ushasti", "badarayana"]
    },
    "49": {
      iast: "Pañca mahāyajña",
      schools: [{ id: "mimamsa", en: "For Mīmāṃsā these are nitya karma, obligatory daily rites. You do them because they are enjoined; skipping them is a fault, and doing them earns no special reward.", hi: "मीमांसा के लिए ये नित्य कर्म हैं, अनिवार्य दैनिक कर्तव्य। आप इन्हें इसलिए करते हैं क्योंकि इनकी विधि है; छोड़ना दोष है, और करने से कोई विशेष फल नहीं मिलता।" }, { id: "advaita", en: "Śaṅkara keeps the daily rites for those not yet ready to renounce. They purify the mind, but they cannot free anyone.", hi: "शंकर नित्य कर्म उनके लिए रखते हैं जो अभी संन्यास के लिए तैयार नहीं। वे मन को शुद्ध करते हैं, पर किसी को मुक्त नहीं कर सकते।" }]
    },
    "50": {
      schools: [{ id: "nyaya", en: "Nyāya would call blood on the mouth a reason without an invariable rule (vyāpti). Blood does not always go with killing, so her inference had failed before she raised her hand.", hi: "न्याय मुँह पर खून को ऐसा हेतु कहता जिसकी व्याप्ति नहीं। खून हमेशा हत्या के साथ नहीं होता, इसलिए हाथ उठाने से पहले ही उसका अनुमान विफल हो चुका था।" }, { id: "yoga", en: "Yoga puts the fault further upstream, in a mind already racing. The strands had decided before she did, and the remedy of square 59 has to come earlier than anger does.", hi: "योग दोष को और पहले रखता है, एक ऐसे मन में जो पहले से दौड़ रहा था। उसके निर्णय से पहले गुण निर्णय कर चुके थे, और खाना ५९ का उपाय क्रोध से पहले आना चाहिए।" }]
    },
    "51": {
      iast: "Dayā · dayadhvam",
      schools: [{ id: "jaina", en: "For the Jains compassion reaches every living thing, down to the beings in water and air. Monks sweep the ground before they step so as not to crush what lives there.", hi: "जैनों के लिए दया हर प्राणी तक जाती है, जल और वायु के जीवों तक भी। मुनि कदम रखने से पहले ज़मीन बुहारते हैं ताकि वहाँ रहने वाले जीव न कुचलें।" }, { id: "mimamsa", en: "Mīmāṃsā would note that the asuras heard a command, and commands are what bind. Compassion here is a duty before it is a feeling.", hi: "मीमांसा ध्यान दिलाती कि असुरों ने एक आदेश सुना, और आदेश ही बाँधते हैं। यहाँ दया भावना से पहले कर्तव्य है।" }]
    },
    "52": {
      scholar: { en: "Dice were an old danger. Ṛg Veda 10.34 is a gambler's lament: his wife has left, his mother-in-law hates him, and still the brown dice call him back to the board.", hi: "जुआ पुराना खतरा था। ऋग्वेद १०.३४ एक जुआरी का विलाप है: पत्नी छोड़ गई, सास घृणा करती है, फिर भी भूरे पासे उसे बार-बार बिसात पर बुलाते हैं।" },
      schools: [{ id: "yoga", en: "Yoga would call envy a kleśa, an affliction rooted in mistaking yourself for what you own and what others have.", hi: "योग ईर्ष्या को क्लेश कहता, एक पीड़ा जिसकी जड़ है स्वयं को अपनी चीज़ों और दूसरों के पास जो है उससे जोड़ लेना।" }, { id: "nyaya", en: "Nyāya would call the dice game a bad inference about his own prospects. Duryodhana reasoned from what he wanted, not from what he knew.", hi: "न्याय द्यूत को अपने भविष्य के बारे में गलत अनुमान कहता। दुर्योधन ने उससे तर्क किया जो वह चाहता था, उससे नहीं जो वह जानता था।" }]
    },
    "53": {
      schools: [{ id: "advaita", en: "Yama's verse, 'it is not born, it does not die' (Katha 1.2.18), returns in the Gītā (2.20). For Advaita it is the plainest statement that the Self was never in danger.", hi: "यम का मंत्र, 'न जायते म्रियते वा' (कठ १.२.१८), गीता (२.२०) में लौटता है। अद्वैत के लिए यह सबसे सीधा कथन है कि आत्मा कभी संकट में थी ही नहीं।" }, { id: "nyaya", en: "Nyāya agrees the self is not born and does not die, and insists it is still one among many: Naciketas's self, not everyone's.", hi: "न्याय सहमत है कि आत्मा न जन्मती है न मरती है, पर ज़ोर देता है कि वह फिर भी अनेकों में एक है: नचिकेता की आत्मा, सबकी नहीं।" }],
      scholar: { en: "Death offered him every pleasure first: chariots, music, long life. 'Keep them,' said Naciketas. 'They wear out the senses.' Only then did Yama teach.", hi: "मृत्यु ने पहले उसे हर सुख दिया: रथ, संगीत, लंबी आयु। 'इन्हें रखिए,' नचिकेता ने कहा। 'ये इंद्रियों को घिसते हैं।' तभी यम ने उपदेश दिया।" }
    },
    "54": {
      scholar: { en: "King Jānaśruti brought cows, a necklace and a chariot. Raikva, scratching his sores under his cart, sent him back with 'keep them, śūdra'. He taught the doctrine of absorption (saṃvarga): wind takes in all things, and breath takes in all the senses.", hi: "राजा जानश्रुति गायें, हार और रथ लेकर आए। अपनी गाड़ी के नीचे खुजली खुजाते रैक्व ने उन्हें 'हे शूद्र, इन्हें रखो' कहकर लौटा दिया। उन्होंने संवर्ग विद्या सिखाई: वायु सब कुछ अपने में समेटता है, और प्राण सब इंद्रियों को।" },
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would side with the king: he had the rites, the gifts and the entitlement. That is what the Veda asks for.", hi: "मीमांसा राजा का पक्ष लेती: उसके पास कर्मकांड थे, दान थे और अधिकार था। वेद यही माँगता है।" }, { id: "advaita", en: "Advaita notices whom the text makes the brahmin. The man with sores under the cart had the knowledge, and he called the king a śūdra.", hi: "अद्वैत ध्यान देता है कि ग्रंथ ब्राह्मण किसे बनाता है। गाड़ी के नीचे फोड़ों वाले व्यक्ति के पास ज्ञान था, और उसने राजा को शूद्र कहा।" }]
    },
    "55": {
      iast: "Lobha",
      schools: [{ id: "jaina", en: "The fifth Jain vow, aparigraha, non-possession, is the cure the jackal never tried: own as little as you can, and hold even that loosely.", hi: "जैनों का पाँचवाँ व्रत, अपरिग्रह, वह इलाज है जो सियार ने कभी नहीं आज़माया: जितना कम हो सके उतना रखो, और उसे भी ढीले हाथ से।" }, { id: "carvaka", en: "The Cārvāka would agree that greed ends badly and blame the plan, not the appetite: eat the meat now.", hi: "चार्वाक सहमत होता कि लोभ का अंत बुरा होता है, और दोष योजना को देता, भूख को नहीं: मांस अभी खाओ।" }]
    },
    "56": {
      iast: "Atithi devo bhava",
      scholar: { en: "A-tithi means one without a date: the guest who arrives unannounced. Feeding the guest is one of the five daily offerings of square 49.", hi: "अ-तिथि का अर्थ है जिसकी कोई तिथि न हो: बिना बताए आने वाला। अतिथि को खिलाना खाना ४९ के पंच महायज्ञों में से एक है।" },
      schools: [{ id: "mimamsa", en: "For Mīmāṃsā hospitality is one of the five daily debts of square 49. You feed the guest because it is owed, whatever you feel.", hi: "मीमांसा के लिए आतिथ्य खाना ४९ के पाँच दैनिक ऋणों में से एक है। आप अतिथि को इसलिए खिलाते हैं कि वह देय है, आप जो भी अनुभव करें।" }, { id: "carvaka", en: "The Cārvāka would feed him too, and for a better reason: company at dinner is pleasant. A kindness done as a debt is a kindness half spoiled.", hi: "चार्वाक भी उसे खिलाता, और बेहतर कारण से: भोजन पर साथ अच्छा लगता है। ऋण समझकर की गई भलाई आधी बिगड़ी हुई भलाई है।" }]
    },
    "57": {
      iast: "Dharma",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would hold Janaka up as the model: keep doing your duties, and the duties themselves are the good.", hi: "मीमांसा जनक को आदर्श मानती: अपने कर्तव्य करते रहो, कर्तव्य ही स्वयं श्रेय हैं।" }, { id: "advaita", en: "Śaṅkara would answer that Janaka acted because he was already free, not in order to become free. Action can purify the mind; only knowledge liberates.", hi: "शंकर उत्तर देते कि जनक कर्म इसलिए करते थे क्योंकि वे पहले से मुक्त थे, मुक्त होने के लिए नहीं। कर्म मन को शुद्ध कर सकता है; मुक्ति केवल ज्ञान से है।" }],
      scholar: { en: "The Gītā (3.20) cites Janaka as one who reached perfection through action itself. Whether action and knowledge can be combined was one of the long quarrels of Vedānta.", hi: "गीता (३.२०) जनक का उदाहरण देती है जिन्होंने कर्म से ही सिद्धि पाई। कर्म और ज्ञान मिलाए जा सकते हैं या नहीं, यह वेदांत के लंबे विवादों में से एक था।" },
      figures: ["yajnavalkya"]
    },
    "58": {
      schools: [{ id: "nyaya", en: "Nyāya would read the blade of grass as evidence: a world this ordered needs a maker, and that maker can be inferred the way a pot implies a potter.", hi: "न्याय तिनके को प्रमाण की तरह पढ़ता: इतने व्यवस्थित जगत को एक कर्ता चाहिए, और उसका अनुमान वैसे ही होता है जैसे घड़े से कुम्हार का।" }, { id: "mimamsa", en: "Mīmāṃsā would refuse: no creator is needed at all. The world has always been as it is, and the Veda's rites work on their own.", hi: "मीमांसा इनकार करती: किसी सृष्टिकर्ता की आवश्यकता ही नहीं। जगत सदा से ऐसा ही है, और वेद के कर्म अपने आप फल देते हैं।" }],
      scholar: { en: "The Yakṣa vanished and in its place stood Umā Haimavatī, who told the gods that the victory had been Brahman's. In the Kena she is the first teacher of Brahman.", hi: "यक्ष अंतर्धान हो गया और उसकी जगह उमा हैमवती खड़ी थीं, जिन्होंने देवताओं को बताया कि विजय ब्रह्म की थी। केन में वे ब्रह्म की पहली उपदेशिका हैं।" }
    },
    "59": {
      iast: "Krodha",
      schools: [{ id: "yoga", en: "Yoga Sūtra 2.33 gives the method the brahmin's wife needed: when a harmful thought rises, cultivate its opposite (pratipakṣa-bhāvanā) before you act on it.", hi: "योगसूत्र २.३३ वह विधि देता है जो ब्राह्मणी को चाहिए थी: जब कोई हिंसक विचार उठे, तो उस पर कर्म करने से पहले उसके विपरीत भाव (प्रतिपक्ष-भावना) को साधो।" }, { id: "bauddha", en: "Buddhaghosa's simile: anger is a burning coal picked up to throw at someone else, and it burns the hand that holds it first.", hi: "बुद्धघोष की उपमा: क्रोध किसी और पर फेंकने के लिए उठाया गया जलता अंगारा है, और वह पहले पकड़ने वाले हाथ को जलाता है।" }]
    },
    "60": {
      schools: [{ id: "mimamsa", en: "Read the way Mīmāṃsā reads the Veda, the stages are injunctions. Leaving is not a mood but a duty with conditions, and these are the conditions.", hi: "जैसे मीमांसा वेद पढ़ती है, वैसे पढ़ें तो आश्रम विधियाँ हैं। जाना कोई मनोदशा नहीं, शर्तों वाला कर्तव्य है, और ये रही शर्तें।" }, { id: "advaita", en: "Śaṅkara held that one who knows need not wait for grey hair, and one who does not will not be helped by it. He renounced as a boy.", hi: "शंकर का मत था कि जो जानता है उसे सफ़ेद बालों की प्रतीक्षा नहीं करनी, और जो नहीं जानता उसे उनसे कोई सहायता नहीं मिलेगी। उन्होंने बालपन में संन्यास लिया।" }],
      figures: ["shankara"]
    },
    "61": {
      scholar: { en: "Prajāpati taught Indra in stages: first that the Self is the body, then the dreaming self, then the self in deep sleep, and at last the Self that is none of these. Indra rejected each answer until the last, which took 101 years in all.", hi: "प्रजापति ने इंद्र को क्रम से सिखाया: पहले कि आत्मा शरीर है, फिर स्वप्न का आत्मा, फिर सुषुप्ति का, और अंत में वह आत्मा जो इनमें से कोई नहीं। इंद्र ने अंतिम से पहले हर उत्तर को अस्वीकार किया, जिसमें कुल १०१ वर्ष लगे।" },
      schools: [{ id: "advaita", en: "Advaita reads Indra's 101 years as the text telling you something: the first answer about the Self is always wrong, and so are the next two.", hi: "अद्वैत इंद्र के १०१ वर्षों को ग्रंथ का संदेश पढ़ता है: आत्मा के बारे में पहला उत्तर सदा गलत होता है, और अगले दो भी।" }, { id: "nyaya", en: "Nyāya would say Indra was doing it correctly: test each claim, reject what fails, and come back. That is successive approximation, and it is how inquiry works.", hi: "न्याय कहता कि इंद्र ठीक कर रहे थे: हर दावे को परखो, जो विफल हो उसे छोड़ो, और फिर लौटो। यही क्रमिक निकटता है, और जिज्ञासा ऐसे ही चलती है।" }]
    },
    "62": {
      iast: "Moha",
      schools: [{ id: "yoga", en: "Yoga names attachment (rāga) as the affliction that follows pleasure (Yoga Sūtra 2.7). Dhṛtarāṣṭra's love for his son was real; it was the clinging that blinded him twice.", hi: "योग राग को वह क्लेश कहता है जो सुख के पीछे आता है (योगसूत्र २.७)। धृतराष्ट्र का पुत्र-प्रेम सच्चा था; उस पकड़ ने उन्हें दोबारा अंधा कर दिया।" }, { id: "mimamsa", en: "Mīmāṃsā would say the king's duty was stated plainly and love was no excuse. A king who cannot refuse his son has failed his office, not his heart.", hi: "मीमांसा कहती कि राजा का कर्तव्य साफ़ बताया गया था और प्रेम कोई बहाना नहीं। जो राजा पुत्र को मना नहीं कर सकता, वह अपने पद में चूका है, हृदय में नहीं।" }]
    },
    "63": {
      iast: "Tena tyaktena bhuñjīthāḥ",
      scholar: { en: "The verse can be read two ways. Śaṅkara takes 'tyaktena' as renunciation: protect the Self by giving everything up. Others read it as 'with what has been left to you': enjoy what the Lord has allotted, and want nothing more.", hi: "इस मंत्र को दो तरह पढ़ा जा सकता है। शंकर 'त्यक्तेन' को त्याग के रूप में लेते हैं: सब छोड़कर आत्मा की रक्षा करो। दूसरे इसे 'जो तुम्हें छोड़ा गया है उससे' पढ़ते हैं: ईश्वर ने जो दिया उसका भोग करो, और अधिक की इच्छा मत करो।" },
      figures: ["shankara"],
      schools: [{ id: "mimamsa", en: "Mīmāṃsā would read 'enjoy' as enjoy. The Veda does not forbid what it allots, and a householder who will not enjoy is failing a duty.", hi: "मीमांसा 'भोगो' को भोगो ही पढ़ती। वेद जो देता है उसे वर्जित नहीं करता, और जो गृहस्थ भोग नहीं करता वह एक कर्तव्य में चूक रहा है।" }, { id: "advaita", en: "For Advaita 'enjoy by letting go' is the whole instruction in five words. What you give up is the only thing that was ever yours to enjoy.", hi: "अद्वैत के लिए 'त्यागपूर्वक भोगो' पूरा उपदेश है। जो आप छोड़ते हैं, वही एकमात्र चीज़ है जो कभी भोगने को आपकी थी।" }]
    },
    "64": {
      schools: [{ id: "carvaka", en: "The Cārvāka verse: 'once the body is ash, how can it ever return?' There was no Bharata left to become a deer; only a story that needs someone to be reborn.", hi: "चार्वाक का श्लोक: 'भस्मीभूतस्य देहस्य पुनरागमनं कुतः', राख हो चुका शरीर फिर कैसे लौटेगा? हिरण बनने को कोई भरत बचा ही नहीं था; बस एक कथा है जिसे पुनर्जन्म के लिए कोई चाहिए।" }, { id: "nyaya", en: "Nyāya would answer with the fawn itself: why would a newborn fear what it has never met unless it remembers? The board's first question, back again.", hi: "न्याय स्वयं शावक से उत्तर देता: नवजात उससे क्यों डरता जिससे वह कभी मिला नहीं, यदि उसे याद न हो? बोर्ड का पहला प्रश्न, फिर लौटकर।" }],
      scholar: { en: "Bharata was reborn as a deer and then as a brahmin who pretended to be simple-minded so that no one would attach him to anything again. That is why he is called Jaḍa Bharata, 'Bharata the dull'.", hi: "भरत हिरण बने और फिर एक ब्राह्मण, जो जड़ होने का ढोंग करते थे ताकि कोई उन्हें फिर किसी बंधन में न बाँधे। इसीलिए वे जड़ भरत कहलाते हैं।" }
    },
    "65": {
      iast: "Vairāgya",
      schools: [{ id: "yoga", en: "Yoga Sūtra 1.12 pairs it with practice: the mind is stilled by abhyāsa and vairāgya together. Detachment without practice drifts; practice without detachment grasps.", hi: "योगसूत्र १.१२ इसे अभ्यास के साथ जोड़ता है: चित्त का निरोध अभ्यास और वैराग्य दोनों से होता है। अभ्यास के बिना वैराग्य भटकता है; वैराग्य के बिना अभ्यास पकड़ता है।" }, { id: "advaita", en: "Śaṅkara puts detachment second in the seeker's list, right after discernment: you let go of what you have already seen does not last.", hi: "शंकर साधक की सूची में वैराग्य को दूसरे स्थान पर रखते हैं, विवेक के ठीक बाद: आप उसे छोड़ते हैं जिसे पहले ही अस्थायी देख चुके हैं।" }],
      figures: ["yajnavalkya"]
    },
    "66": {
      iast: "Vānaprastha",
      schools: [{ id: "advaita", en: "For Advaita, renunciation is only the outward form of knowing that the house was never yours.", hi: "अद्वैत के लिए संन्यास इस बात को जान लेने का बाहरी रूप भर है कि घर कभी आपका था ही नहीं।" }, { id: "vishishtadvaita", en: "Rāmānuja kept the house and the world real, as God's own body. Leaving them is a discipline, not the correction of an error.", hi: "रामानुज ने घर और संसार को वास्तविक माना, ईश्वर का ही शरीर। उन्हें छोड़ना एक साधना है, किसी भूल का सुधार नहीं।" }],
      figures: ["yajnavalkya"]
    },
    "67": {
      schools: [{ id: "vishishtadvaita", en: "Rāmānuja gives this verse a body: every being is part of the body of God. To hate any one of them is to wound God's own body.", hi: "रामानुज इस मंत्र को एक शरीर देते हैं: हर प्राणी ईश्वर के शरीर का अंग है। किसी एक से घृणा करना ईश्वर के अपने शरीर को घायल करना है।" }, { id: "advaita", en: "Advaita reads the verse as identity: there is no hatred because there is no other left to hate.", hi: "अद्वैत इस मंत्र को अभेद पढ़ता है: घृणा नहीं है क्योंकि घृणा करने को कोई दूसरा बचा ही नहीं।" }]
    },
    "68": {
      schools: [{ id: "advaita", en: "Śaṅkara holds that words can liberate, but only the right sentence, heard from a teacher, by a mind ready for it. Nārada had all the words and none of the hearing.", hi: "शंकर मानते हैं कि शब्द मुक्त कर सकते हैं, पर केवल सही वाक्य, गुरु से सुना हुआ, तैयार मन से। नारद के पास सब शब्द थे, सुनना नहीं।" }, { id: "mimamsa", en: "Mīmāṃsā would say Nārada knew the words but not their use. The Veda is for doing, and no amount of reciting replaces the rite.", hi: "मीमांसा कहती कि नारद शब्द जानते थे पर उनका प्रयोग नहीं। वेद करने के लिए है, और कितना भी पाठ कर्म का स्थान नहीं ले सकता।" }],
      scholar: { en: "Sanatkumāra led Nārada up a ladder of fifteen things, each 'greater' than the last: name, speech, mind, will, and so on up to breath, and then to bhūman, the boundless, where alone there is joy.", hi: "सनत्कुमार नारद को पंद्रह सीढ़ियों पर ले गए, हर एक पिछली से 'बड़ी': नाम, वाणी, मन, संकल्प, और इसी तरह प्राण तक, फिर भूमा तक, असीम, जहाँ अकेले सुख है।" }
    },
    "69": {
      iast: "Mātsarya",
      schools: [{ id: "bauddha", en: "The Buddhists name the antidote: muditā, sympathetic joy, being glad at someone else's good fortune. It is one of the four boundless states, and the hardest.", hi: "बौद्ध इसकी औषधि बताते हैं: मुदिता, दूसरे के सौभाग्य पर प्रसन्न होना। यह चार अपरिमित भावों में से एक है, और सबसे कठिन।" }, { id: "carvaka", en: "The Cārvāka would ask why envy is a vice if it drives a man to build a better hall. It ruined Duryodhana only because he chose dice instead.", hi: "चार्वाक पूछता कि ईर्ष्या दोष क्यों है अगर वह आदमी को बेहतर सभाभवन बनाने को प्रेरित करे। दुर्योधन का नाश इसलिए हुआ कि उसने उसकी जगह जुआ चुना।" }],
      scholar: { en: "In the hall built by the asura architect Maya, Duryodhana mistook a crystal floor for water and a pool for a floor, and fell in. The laughter of those who saw it is remembered as the spark.", hi: "असुर शिल्पी मय के बनाए सभाभवन में दुर्योधन ने स्फटिक के फर्श को पानी और तालाब को फर्श समझा, और गिर पड़ा। देखने वालों की हँसी को चिंगारी के रूप में याद किया जाता है।" }
    },
    "70": {
      iast: "Pañca-kośa",
      schools: [{ id: "advaita", en: "Advaita uses the sheaths as a method: look at each one, see that you are its witness, and set it aside. What cannot be set aside is the Self.", hi: "अद्वैत कोशों को एक विधि की तरह बरतता है: हर एक को देखो, जानो कि तुम उसके साक्षी हो, और उसे अलग रखो। जो अलग न किया जा सके, वही आत्मा है।" }, { id: "carvaka", en: "The Cārvāka accepts the first sheath and stops there: the self is the body made of food, and the other four are a story told on top of it.", hi: "चार्वाक पहला कोश मानता है और वहीं रुक जाता है: आत्मा अन्न से बना शरीर है, और बाकी चार उसके ऊपर कही गई कहानी।" }]
    },
    "71": {
      schools: [{ id: "carvaka", en: "The Cārvākas said much religion was a livelihood for those who perform it, and they would have recognised this cat. The charge is old, and it is not always wrong.", hi: "चार्वाकों ने कहा कि बहुत सा धर्म उसे करवाने वालों की आजीविका है, और वे इस बिल्ली को पहचान लेते। यह आरोप पुराना है, और हमेशा गलत भी नहीं।" }, { id: "jaina", en: "The Jains, who fast hardest of all, would side with the cat's victims: austerity that waits for prey is not tapas but its counterfeit.", hi: "जैन, जो सबसे कठोर उपवास करते हैं, बिल्ली के शिकारों का पक्ष लेते: जो तप शिकार की प्रतीक्षा करे, वह तप नहीं, उसकी नकल है।" }]
    },
    "72": {
      iast: "Tapas",
      schools: [{ id: "jaina", en: "For the Jains tapas is central: fasting and austerity burn off karmic matter already stuck to the soul, the way heat burns off impurities from gold.", hi: "जैनों के लिए तप केंद्रीय है: उपवास और तप जीव पर पहले से चिपके कर्म-पुद्गल को जला देते हैं, जैसे आग सोने का मैल।" }, { id: "advaita", en: "Śaṅkara says Varuṇa's tapas is not fasting at all but the gathering of mind and senses on one point, which is what sends Bhṛgu back to the question each time.", hi: "शंकर कहते हैं कि वरुण का तप उपवास नहीं, मन और इंद्रियों की एकाग्रता है, जो हर बार भृगु को प्रश्न पर लौटा देती है।" }],
      scholar: { en: "Varuṇa never gave Bhṛgu an answer. He gave him a method: 'Seek it by tapas.' Bhṛgu came back four times with food, breath, mind and understanding, and was sent away again each time.", hi: "वरुण ने भृगु को कभी उत्तर नहीं दिया। उन्होंने विधि दी: 'तप से जानो।' भृगु चार बार अन्न, प्राण, मन और विज्ञान लेकर लौटे, और हर बार फिर भेजे गए।" }
    },
    "73": {
      iast: "Prāṇa",
      schools: [{ id: "yoga", en: "Yoga makes breath the fourth limb: prāṇāyāma, the regulation of in-breath and out-breath (Yoga Sūtra 2.49), the hinge between body and mind.", hi: "योग प्राण को चौथा अंग बनाता है: प्राणायाम, श्वास और प्रश्वास का नियमन (योगसूत्र २.४९), शरीर और मन के बीच का कब्ज़ा।" }, { id: "advaita", en: "Advaita would say the parable stops one step short: breath outranks the senses, and the Self outranks breath.", hi: "अद्वैत कहता कि यह कथा एक कदम पहले रुक जाती है: प्राण इंद्रियों से बड़ा है, और आत्मा प्राण से।" }]
    },
    "74": {
      iast: "Dahara",
      scholar: { en: "This is the dahara-vidyā, the meditation on the small space within. The Brahma Sūtra (1.3.14) argues that the space meant here is Brahman, not the physical ether.", hi: "यह दहर-विद्या है, भीतर के छोटे आकाश का ध्यान। ब्रह्मसूत्र (१.३.१४) तर्क देता है कि यहाँ अभिप्रेत आकाश ब्रह्म है, भौतिक आकाश नहीं।" },
      schools: [{ id: "vaisheshika", en: "Vaiśeṣika counts space (ākāśa) as one of nine substances: one, everywhere, and not inside anybody's heart more than anywhere else.", hi: "वैशेषिक आकाश को नौ द्रव्यों में से एक गिनता है: एक, सर्वत्र, और किसी के हृदय में कहीं और से अधिक नहीं।" }, { id: "advaita", en: "Advaita answers that the space in the heart is not the space outside it. The Brahma Sūtra (1.3.14) says this small space is Brahman itself.", hi: "अद्वैत का उत्तर है कि हृदय का आकाश बाहर का आकाश नहीं है। ब्रह्मसूत्र (१.३.१४) कहता है कि यह छोटा आकाश स्वयं ब्रह्म है।" }]
    },
    "75": {
      schools: [{ id: "samkhya", en: "Sāṃkhya would agree with Janaka's grammar exactly: puruṣa owns nothing and does nothing. Whatever burns was prakṛti all along.", hi: "सांख्य जनक के वाक्य से पूरी तरह सहमत होता: पुरुष का कुछ नहीं और वह कुछ नहीं करता। जो जल रहा है वह सदा से प्रकृति था।" }, { id: "mimamsa", en: "Mīmāṃsā would remind Janaka that a king is still bound to put the fire out. Knowing nothing is yours does not cancel your duty to a city that is burning.", hi: "मीमांसा जनक को याद दिलाती कि राजा अब भी आग बुझाने को बाध्य है। यह जानना कि कुछ आपका नहीं, जलते नगर के प्रति कर्तव्य को रद्द नहीं करता।" }]
    },
    "76": {
      iast: "Sandhyā",
      schools: [{ id: "mimamsa", en: "The daily rites are nitya karma: obligatory and fruitless. You do them because they are enjoined, and asking what you get from them is the wrong question.", hi: "नित्य कर्म अनिवार्य हैं और उनका कोई फल नहीं। आप उन्हें इसलिए करते हैं कि उनका विधान है, और यह पूछना कि उनसे क्या मिलेगा, गलत प्रश्न है।" }, { id: "yoga", en: "Yoga answers that the repetition is the point. Practice kept up long, without a break, is the only thing that reshapes a mind (Yoga Sūtra 1.14).", hi: "योग का उत्तर है कि दोहराव ही उद्देश्य है। लंबे समय तक, बिना रुके किया गया अभ्यास ही मन को नया आकार देता है (योगसूत्र १.१४)।" }]
    },
    "77": {
      iast: "Mada",
      scholar: { en: "Agni went first and could not burn the grass, then Vāyu could not move it. When Indra approached, the Yakṣa vanished altogether, which is why Indra is said to have come nearest.", hi: "पहले अग्नि गए और तिनका न जला सके, फिर वायु उसे हिला न सके। जब इंद्र पास गए तो यक्ष पूरी तरह अंतर्धान हो गया, इसीलिए कहा जाता है कि इंद्र सबसे निकट पहुँचे।" },
      schools: [{ id: "advaita", en: "Advaita reads the Yakṣa as Brahman appearing so that the gods could fail in front of it. The power they boasted of was never theirs.", hi: "अद्वैत यक्ष को ब्रह्म का प्रकट होना पढ़ता है ताकि देवता उसके सामने विफल हो सकें। जिस शक्ति पर वे इतराए, वह कभी उनकी थी ही नहीं।" }, { id: "carvaka", en: "The Cārvāka would say the gods lost a bet with a stranger, and the moral is about gods. It tells you nothing about yourself.", hi: "चार्वाक कहता कि देवता एक अजनबी से शर्त हार गए, और सीख देवताओं के बारे में है। आपके बारे में यह कुछ नहीं बताती।" }]
    },
    "78": {
      schools: [{ id: "nyaya", en: "Nyāya agrees that it is the self who loves, but insists that selves are many, one to each body. Yājñavalkya's 'Self' would be Maitreyī's own, not one shared by both.", hi: "न्याय सहमत है कि प्रेम करने वाला आत्मा है, पर ज़ोर देता है कि आत्माएँ अनेक हैं, हर शरीर में एक। याज्ञवल्क्य का 'आत्मा' मैत्रेयी का अपना होगा, दोनों में एक नहीं।" }, { id: "advaita", en: "Advaita hears one Self loving itself in every beloved, which is why Yājñavalkya can say it without being selfish.", hi: "अद्वैत हर प्रिय में एक ही आत्मा को स्वयं से प्रेम करते सुनता है, इसीलिए याज्ञवल्क्य स्वार्थी हुए बिना यह कह सकते हैं।" }],
      figures: ["yajnavalkya"]
    },
    "79": {
      schools: [{ id: "advaita", en: "Śaṅkara's gloss on the warning: Gārgī was asking by inference about what can only be known from scripture. The head that falls is reasoning run past its proper means of knowledge.", hi: "चेतावनी पर शंकर की टीका: गार्गी अनुमान से उसके बारे में पूछ रही थीं जो केवल श्रुति से जाना जा सकता है। जो सिर गिरता है वह अपने उचित प्रमाण से आगे दौड़ाया गया तर्क है।" }, { id: "nyaya", en: "Nyāya would take Gārgī's side. Inquiry by reason (ānvīkṣikī) has no point at which it is told to stop, and a regress is a reason to look harder, not to fall silent.", hi: "न्याय गार्गी का पक्ष लेता। तर्क से जिज्ञासा (आन्वीक्षिकी) का कोई बिंदु नहीं जहाँ उसे रुकने को कहा जाए, और अनवस्था और ध्यान से देखने का कारण है, चुप होने का नहीं।" }],
      scholar: { en: "She comes back in 3.8 for a second round, with two questions she calls arrows, and gets an answer: the imperishable (akṣara), on which space itself is woven. Then she tells the assembly that none of them will beat him. This square used to carry the Muṇḍaka's bow (2.2.4): Om is the bow, the self the arrow, Brahman the target.", hi: "वे ३.८ में दूसरी बार लौटती हैं, दो प्रश्नों के साथ जिन्हें वे बाण कहती हैं, और उत्तर पाती हैं: अक्षर, जिस पर स्वयं आकाश बुना है। फिर वे सभा से कहती हैं कि आप में से कोई उन्हें नहीं हरा पाएगा। यह खाना पहले मुंडक का धनुष (२.२.४) था: प्रणव धनुष है, आत्मा बाण, ब्रह्म लक्ष्य।" },
      iast: "Gārgī Vācaknavī",
      figures: ["gargi", "yajnavalkya", "shankara"]
    },
    "80": {
      iast: "Sannyāsa",
      schools: [{ id: "mimamsa", en: "Mīmāṃsā was suspicious of all this. If dharma is ritual action, the man who gives up his fires has given up dharma. The householder's life was the whole of it.", hi: "मीमांसा इस सबको संदेह से देखती थी। यदि धर्म यज्ञ-कर्म है, तो अपनी अग्नि त्यागने वाले ने धर्म त्याग दिया। गृहस्थ का जीवन ही सब कुछ था।" }, { id: "advaita", en: "Advaita answered with monasteries. Śaṅkara's tradition made renunciation the natural life of one who has seen that action cannot free anyone.", hi: "अद्वैत ने मठों से उत्तर दिया। शंकर की परंपरा ने संन्यास को उसका स्वाभाविक जीवन बनाया जिसने देख लिया कि कर्म किसी को मुक्त नहीं कर सकता।" }]
    },
    "81": {
      iast: "Neti neti",
      schools: [{ id: "advaita", en: "Advaita reads 'not this, not this' as the most exact description there is: the Self is reached by subtracting everything it is not.", hi: "अद्वैत 'नेति नेति' को सबसे सटीक वर्णन मानता है: आत्मा तक वह सब घटाकर पहुँचा जाता है जो वह नहीं है।" }, { id: "bauddha", en: "A Buddhist would keep going: apply 'not this' to the Self as well. There is no remainder; that is anattā.", hi: "एक बौद्ध आगे बढ़ता: 'नेति' को आत्मा पर भी लागू करो। कुछ शेष नहीं बचता; यही अनात्म है।" }],
      figures: ["yajnavalkya"]
    },
    "82": {
      iast: "Turīya",
      schools: [{ id: "advaita", en: "Gauḍapāda's verses on this Upaniṣad began Advaita. He argued that waking and dreaming are alike, both appearances to a fourth that never comes or goes.", hi: "इस उपनिषद् पर गौड़पाद की कारिका से अद्वैत आरंभ हुआ। उन्होंने तर्क दिया कि जाग्रत और स्वप्न एक जैसे हैं, दोनों एक चौथे के सामने प्रतीतियाँ, जो न आता है न जाता है।" }, { id: "nyaya", en: "Nyāya would find a fourth state unnecessary: the self is one substance, and waking, dream and sleep only say whether its knowing is switched on.", hi: "न्याय को चौथी अवस्था अनावश्यक लगती: आत्मा एक द्रव्य है, और जाग्रत, स्वप्न और सुषुप्ति बस यह बताते हैं कि उसका ज्ञान चालू है या नहीं।" }],
      figures: ["gaudapada"]
    },
    "83": {
      iast: "Amṛtatva",
      schools: [{ id: "nyaya", en: "Yājñavalkya told Maitreyī that after death there is no awareness. Nyāya agreed that liberation is without pleasure or awareness; its critics joked that it turns you into a stone.", hi: "याज्ञवल्क्य ने मैत्रेयी से कहा कि मृत्यु के बाद संज्ञा नहीं रहती। न्याय सहमत था कि मुक्ति में न सुख है न चेतना; उसके आलोचक हँसते थे कि यह आपको पत्थर बना देती है।" }, { id: "advaita", en: "Advaita answers the stone joke: liberation is not unawareness but awareness with no object, which only sounds like nothing.", hi: "अद्वैत पत्थर वाले मज़ाक का उत्तर देता है: मुक्ति अचेतना नहीं, विषयहीन चेतना है, जो केवल सुनने में शून्य लगती है।" }],
      figures: ["yajnavalkya"]
    },
    "84": {
      iast: "Bhikṣā",
      schools: [{ id: "jaina", en: "Jain monks take alms by strict rules: food not cooked for them, taken from many houses so as to burden none, and, for Digambara monks, eaten once a day, standing.", hi: "जैन मुनि कठोर नियमों से भिक्षा लेते हैं: ऐसा भोजन जो उनके लिए न पकाया गया हो, कई घरों से थोड़ा-थोड़ा ताकि किसी पर भार न पड़े, और दिगंबर मुनियों के लिए, दिन में एक बार, खड़े होकर।" }, { id: "advaita", en: "Advaita answers the Mīmāṃsā objection: the man who has nothing left to sacrifice has made himself the sacrifice.", hi: "अद्वैत मीमांसा की आपत्ति का उत्तर देता है: जिसके पास अर्पित करने को कुछ नहीं बचा, उसने स्वयं को ही आहुति बना दिया।" }]
    },
    "85": {
      iast: "Viveka",
      schools: [{ id: "samkhya", en: "Sāṃkhya-Yoga's whole goal is this discernment (viveka-khyāti): seeing that the watcher is not the eater, that puruṣa is not prakṛti.", hi: "सांख्य-योग का पूरा लक्ष्य यही विवेक (विवेकख्याति) है: यह देखना कि देखने वाला खाने वाला नहीं, कि पुरुष प्रकृति नहीं।" }, { id: "dvaita", en: "Madhva cites this verse as proof of difference: two birds, the soul and God, side by side forever and never one.", hi: "मध्व इस मंत्र को भेद के प्रमाण के रूप में उद्धृत करते हैं: दो पक्षी, जीव और ईश्वर, सदा साथ, पर कभी एक नहीं।" }]
    },
    "86": {
      iast: "Kena",
      schools: [{ id: "trika", en: "Kashmir Śaivism would say the one asking 'by whom?' is already the answer: consciousness is not only light but self-aware (vimarśa). It knows itself in the very act of asking.", hi: "काश्मीर शैव कहता कि 'किसके द्वारा?' पूछने वाला ही उत्तर है: चेतना केवल प्रकाश नहीं, विमर्श भी है। पूछने की क्रिया में ही वह स्वयं को जानती है।" }, { id: "advaita", en: "Advaita would stop at light: consciousness simply shines and does not need to know itself to be what it is. The Śaivas called that a mirror with no one in it.", hi: "अद्वैत प्रकाश पर रुक जाता: चेतना बस प्रकाशित होती है, और जो वह है वह होने के लिए उसे स्वयं को जानने की ज़रूरत नहीं। शैवों ने इसे ऐसा दर्पण कहा जिसमें कोई नहीं।" }]
    },
    "87": {
      scholar: { en: "Verses 15–18 of the Īśa are a prayer recited at death: to Pūṣan to uncover truth's face, then to fire to lead the departing by a good path. They are still recited at Hindu funerals.", hi: "ईश के मंत्र १५–१८ मृत्यु के समय की प्रार्थना हैं: पूषन् से सत्य का मुख खोलने की, फिर अग्नि से जाने वाले को शुभ मार्ग से ले जाने की। ये आज भी हिंदू अंत्येष्टि में पढ़े जाते हैं।" },
      schools: [{ id: "yoga", en: "For Yoga the golden lid is the mind's own activity. Still the turnings of the mind (Yoga Sūtra 1.2) and there is nothing to uncover.", hi: "योग के लिए स्वर्ण पात्र मन की अपनी हलचल है। चित्त की वृत्तियाँ रोको (योगसूत्र १.२) और हटाने को कुछ बचता ही नहीं।" }, { id: "nyaya", en: "Nyāya would say the lid is simply that some things are not perceptible. You do not uncover them; you infer them.", hi: "न्याय कहता कि ढक्कन बस इतना है कि कुछ चीज़ें प्रत्यक्ष नहीं होतीं। आप उन्हें उघाड़ते नहीं; उनका अनुमान करते हैं।" }]
    },
    "88": {
      iast: "Dambha",
      scholar: { en: "From the Panchatantra's third book, 'Crows and owls'. The cat, Dadhikarṇa, quotes scripture on non-violence while it waits for the hare and the partridge to come closer.", hi: "पंचतंत्र की तीसरी पुस्तक, 'काकोलूकीय', से। बिल्ली, दधिकर्ण, अहिंसा पर शास्त्र उद्धृत करती है जबकि वह खरगोश और तीतर के पास आने की प्रतीक्षा करती है।" },
      schools: [{ id: "jaina", en: "For the Jains outward austerity without inward restraint is one of the ways karma binds harder. The cat's fasting was adding weight.", hi: "जैनों के लिए भीतरी संयम के बिना बाहरी तप उन तरीकों में से है जिनसे कर्म और कसकर बाँधता है। बिल्ली का उपवास भार बढ़ा रहा था।" }, { id: "mimamsa", en: "Mīmāṃsā holds that a rite works whatever the performer feels, which is exactly the problem this story is about.", hi: "मीमांसा मानती है कि कर्मकांड करने वाले के भाव कुछ भी हों, वह काम करता है, और यही वह समस्या है जिसके बारे में यह कथा है।" }]
    },
    "89": {
      iast: "Ānanda",
      schools: [{ id: "advaita", en: "Advaita takes bliss into its definition of Brahman: sat, cit, ānanda, being, consciousness and bliss.", hi: "अद्वैत आनंद को ब्रह्म की परिभाषा में लेता है: सत्, चित्, आनंद, अस्तित्व, चेतना और आनंद।" }, { id: "nyaya", en: "Nyāya would object: bliss is still an experience, and every experience binds. Liberation is the end of suffering, and nothing more is promised.", hi: "न्याय आपत्ति करता: आनंद भी एक अनुभव है, और हर अनुभव बाँधता है। मुक्ति दुःख का अंत है, और इससे अधिक कुछ वचन नहीं।" }]
    },
    "90": {
      iast: "Asato mā sad gamaya",
      scholar: { en: "These are the pavamāna verses, sung by the priest during the Soma rite. The Upaniṣad itself explains them: the unreal is death, the real is immortality.", hi: "ये पवमान मंत्र हैं, जिन्हें सोमयज्ञ में पुरोहित गाता है। उपनिषद् स्वयं इनकी व्याख्या करता है: असत् मृत्यु है, सत् अमृत।" },
      schools: [{ id: "samkhya", en: "Sāṃkhya: 'the real' is the witness, puruṣa, and the unreal is everything it watches. Reality is not one thing, though; there are as many witnesses as there are people.", hi: "सांख्य: 'सत्' साक्षी पुरुष है, और असत् वह सब जिसे वह देखता है। फिर भी सत्य एक नहीं; जितने लोग, उतने साक्षी।" }, { id: "advaita", en: "Advaita: 'the real' is one, and the unreal includes the very person praying. The prayer is answered when there is nobody left to lead.", hi: "अद्वैत: 'सत्' एक है, और असत् में प्रार्थना करने वाला भी शामिल है। प्रार्थना तब पूरी होती है जब ले जाने को कोई बचता ही नहीं।" }]
    },
    "91": {
      iast: "Prajñānaṃ brahma",
      schools: [{ id: "advaita", en: "The first of the four great sentences (mahāvākya), one from each Veda. This is the Ṛg Veda's: Brahman is consciousness itself.", hi: "चार महावाक्यों में पहला, हर वेद से एक। यह ऋग्वेद का है: ब्रह्म स्वयं चेतना है।" }, { id: "bauddha", en: "Yogācāra Buddhists also said that only consciousness is real. But for them it is a stream of moments, with no Self standing behind it.", hi: "योगाचार बौद्धों ने भी कहा कि केवल विज्ञान (चेतना) सत्य है। पर उनके लिए यह क्षणों की धारा है, जिसके पीछे कोई आत्मा खड़ी नहीं।" }]
    },
    "92": {
      iast: "Ahaṃ brahmāsmi",
      schools: [{ id: "trika", en: "Kashmir Śaivism would put it as recognition: not 'I shall become Śiva' but 'I see now that I am Śiva', the way you recognise a face you already knew.", hi: "काश्मीर शैव इसे प्रत्यभिज्ञा कहता: 'मैं शिव बनूँगा' नहीं, बल्कि 'अब देखता हूँ कि मैं शिव हूँ', जैसे कोई जाना-पहचाना चेहरा पहचान लेते हैं।" }, { id: "dvaita", en: "For Madhva this sentence cannot mean identity. It means that the soul depends on Brahman entirely, as a reflection depends on what it reflects.", hi: "मध्व के लिए इस वाक्य का अर्थ अभेद नहीं हो सकता। इसका अर्थ है कि जीव पूरी तरह ब्रह्म पर निर्भर है, जैसे प्रतिबिंब बिंब पर।" }],
      scholar: { en: "The Yajur Veda's great sentence. Its context is a creation story: in the beginning Brahman knew only itself, as 'I am Brahman', and so became all this.", hi: "यजुर्वेद का महावाक्य। इसका संदर्भ एक सृष्टि-कथा है: आरंभ में ब्रह्म ने केवल स्वयं को जाना, 'अहं ब्रह्मास्मि' के रूप में, और इसी से वह सब कुछ बन गया।" }
    },
    "93": {
      iast: "Āsakti",
      schools: [{ id: "bauddha", en: "In the Buddha's chain of dependent origination, craving gives rise to clinging (upādāna), and clinging to becoming. Bharata's fawn is the whole chain in one small life.", hi: "बुद्ध के प्रतीत्यसमुत्पाद में तृष्णा से उपादान (पकड़) उत्पन्न होता है, और उपादान से भव। भरत का शावक एक छोटे से जीवन में पूरी शृंखला है।" }, { id: "yoga", en: "Yoga would explain the fawn as saṃskāra: a habit of attention laid down daily becomes, at death, the only thought left (Yoga Sūtra 2.12).", hi: "योग शावक को संस्कार से समझाता: रोज़ बिठाई गई ध्यान की आदत मृत्यु के समय अकेला बचा विचार बन जाती है (योगसूत्र २.१२)।" }]
    },
    "94": {
      iast: "Sākṣin",
      schools: [{ id: "samkhya", en: "Sāṃkhya Kārikā 19 gives the watching bird's job description: puruṣa is witness (sākṣitva), isolated, indifferent, a seer and not a doer.", hi: "सांख्यकारिका १९ साक्षी पक्षी का काम बताती है: पुरुष साक्षी है, कैवल्य वाला, उदासीन, द्रष्टा, कर्ता नहीं।" }, { id: "advaita", en: "Advaita reads 'its own glory' as identity: the eating bird finds it was the watcher all along.", hi: "अद्वैत 'अपनी ही महिमा' को अभेद पढ़ता है: फल खाने वाला पक्षी पाता है कि वह सदा से साक्षी ही था।" }],
      figures: ["kapila"]
    },
    "95": {
      iast: "Ayam ātmā brahma",
      schools: [{ id: "advaita", en: "The Atharva Veda's great sentence. Advaita hears in it the whole teaching in three words: this, here, now, is that.", hi: "अथर्ववेद का महावाक्य। अद्वैत इसमें तीन शब्दों में पूरी शिक्षा सुनता है: यह, यहीं, अभी, वही है।" }, { id: "vishishtadvaita", en: "Rāmānuja reads it through the body: this self is Brahman the way a hand is the person, a real part and not an illusion.", hi: "रामानुज इसे शरीर के रूप में पढ़ते हैं: यह आत्मा ब्रह्म है जैसे हाथ व्यक्ति है, एक वास्तविक अंश, भ्रम नहीं।" }],
      figures: ["gaudapada"]
    },
    "96": {
      iast: "Sarvaṃ khalv idaṃ brahma",
      schools: [{ id: "advaita", en: "Advaita: all this is Brahman, but 'all this' as you see it is appearance (vivarta), the way the snake is really rope.", hi: "अद्वैत: यह सब ब्रह्म है, पर जैसा आप 'यह सब' देखते हैं वह विवर्त है, प्रतीति, जैसे साँप वास्तव में रस्सी है।" }, { id: "vishishtadvaita", en: "Rāmānuja: all this is Brahman as a body is the person. The world is real, and it is real as God's.", hi: "रामानुज: यह सब ब्रह्म है जैसे शरीर व्यक्ति है। जगत वास्तविक है, और वह ईश्वर का है।" }],
      scholar: { en: "From the meditation of Śāṇḍilya (Chāndogya 3.14). It goes on: 'As a person's resolve is in this world, so they become on departing.' It is one of the oldest statements of the idea of karma.", hi: "शाण्डिल्य-विद्या से (छांदोग्य ३.१४)। आगे कहा है: 'इस लोक में मनुष्य का जैसा संकल्प होता है, जाने पर वह वैसा ही होता है।' यह कर्म के विचार के सबसे पुराने कथनों में से एक है।" }
    },
    "97": {
      iast: "Pūrṇam adaḥ pūrṇam idam",
      scholar: { en: "The peace invocation (śānti-pāṭha) recited before the Īśa and the Bṛhadāraṇyaka. Its arithmetic, whole minus whole leaves whole, is the arithmetic of the infinite.", hi: "ईश और बृहदारण्यक से पहले पढ़ा जाने वाला शांति पाठ। इसका गणित, पूर्ण से पूर्ण घटाने पर पूर्ण शेष, अनंत का गणित है।" },
      schools: [{ id: "vaisheshika", en: "Vaiśeṣika would ask what kind of thing 'the whole' is. Its list of substances has space and time, which are infinite, but no infinite thing you could take from another.", hi: "वैशेषिक पूछता कि 'पूर्ण' किस प्रकार की वस्तु है। उसकी द्रव्य-सूची में आकाश और काल हैं, जो अनंत हैं, पर ऐसी कोई अनंत वस्तु नहीं जिसे दूसरी से निकाला जा सके।" }, { id: "advaita", en: "Advaita reads the verse as a definition: the whole is what nothing can be added to or taken from. Brahman, in one line of arithmetic.", hi: "अद्वैत इस मंत्र को परिभाषा पढ़ता है: पूर्ण वह है जिसमें न कुछ जोड़ा जा सके, न घटाया। एक पंक्ति के गणित में ब्रह्म।" }]
    },
    "98": {
      iast: "Om śāntiḥ śāntiḥ śāntiḥ",
      scholar: { en: "Said three times, one for each kind of trouble: from oneself (ādhyātmika), from other beings (ādhibhautika), and from the powers above (ādhidaivika).", hi: "तीन बार कहा जाता है, हर प्रकार के ताप के लिए एक: अपने से (आध्यात्मिक), अन्य प्राणियों से (आधिभौतिक), और ऊपर की शक्तियों से (आधिदैविक)।" },
      schools: [{ id: "yoga", en: "Yoga maps the three troubles onto its obstacles: illness and dullness from within, distraction from without, and the rest from what cannot be helped (Yoga Sūtra 1.30–31).", hi: "योग तीन कष्टों को अपने विघ्नों पर रखता है: रोग और जड़ता भीतर से, विक्षेप बाहर से, और बाकी उससे जिसका कोई उपाय नहीं (योगसूत्र १.३०–३१)।" }, { id: "nyaya", en: "Nyāya would say the third kind is why liberation cannot be had by effort alone. Some suffering only ends when the body that receives it does.", hi: "न्याय कहता कि तीसरे प्रकार के कारण ही मुक्ति केवल प्रयत्न से नहीं मिल सकती। कुछ दुःख तभी खत्म होते हैं जब उन्हें झेलने वाला शरीर खत्म होता है।" }]
    },
    "99": {
      iast: "Ahaṅkāra",
      schools: [{ id: "samkhya", en: "In Sāṃkhya, ahaṅkāra is a tattva, a piece of matter: the 'I-maker' that stamps 'mine' on whatever the intellect lights up. It is not the Self. It is the thing most often taken for it.", hi: "सांख्य में अहंकार एक तत्त्व है, प्रकृति का अंश: 'मैं' बनाने वाला, जो बुद्धि के प्रकाशित किए हर विषय पर 'मेरा' की मुहर लगाता है। यह आत्मा नहीं है। यह वह है जिसे सबसे अधिक आत्मा मान लिया जाता है।" }, { id: "carvaka", en: "The Cārvāka would say Virocana was simply right: the body is the self, and he went home content because there was nothing more to find.", hi: "चार्वाक कहता कि विरोचन बस सही थे: शरीर ही आत्मा है, और वे संतुष्ट लौटे क्योंकि खोजने को और कुछ था ही नहीं।" }],
      scholar: { en: "The Upaniṣad calls Virocana's teaching 'the doctrine of the asuras'. Later writers sometimes named it as the ancestor of the Cārvāka view that the body is the self.", hi: "उपनिषद् विरोचन के मत को 'असुरों का उपनिषद्' कहता है। बाद के लेखकों ने कभी-कभी इसे चार्वाक के देहात्मवाद का पूर्वज बताया।" }
    },
    "100": {
      schools: [{ id: "nyaya", en: "Nyāya: heaven is a reward, and rewards are finite. Merit is spent like money.", hi: "न्याय: स्वर्ग एक पुरस्कार है, और पुरस्कार सीमित होते हैं। पुण्य धन की तरह खर्च होता है।" }, { id: "mimamsa", en: "Mīmāṃsā: for centuries that was enough. Heaven was the goal, and mokṣa was not on the board.", hi: "मीमांसा: सदियों तक यही पर्याप्त था। स्वर्ग ही लक्ष्य था, और मोक्ष बोर्ड पर था ही नहीं।" }, { id: "advaita", en: "Advaita: which is exactly why everything above this line is still saṃsāra, however bright it looks.", hi: "अद्वैत: ठीक इसीलिए इस रेखा के ऊपर सब कुछ अब भी संसार है, चाहे जितना उजला दिखे।" }]
    },
    "101": {
      line2: { en: "When the merit is spent, the soul returns to earth. Heaven is a holiday, not a home.", hi: "पुण्य समाप्त होते ही जीव पृथ्वी पर लौटता है। स्वर्ग छुट्टी है, घर नहीं।" },
      schools: [{ id: "mimamsa", en: "For Mīmāṃsā this square was the goal for centuries: 'one who desires heaven should sacrifice' (svargakāmo yajeta) is its model injunction. Under its law, you would stop here.", hi: "मीमांसा के लिए सदियों तक यही खाना लक्ष्य था: 'स्वर्गकामो यजेत' (स्वर्ग चाहने वाला यज्ञ करे) इसकी आदर्श विधि है। इसके नियम में आप यहीं रुक जाते।" }, { id: "advaita", en: "Advaita: heaven is still on the board. Merit buys it, merit runs out, and the soul comes back down to earth with the rain.", hi: "अद्वैत: स्वर्ग भी बोर्ड पर ही है। पुण्य उसे खरीदता है, पुण्य चुक जाता है, और जीव वर्षा के साथ धरती पर लौट आता है।" }],
      figures: ["kumarila"]
    },
    "102": {
      line2: { en: "He is the oldest priest and the youngest flame, born anew each time the fire-sticks are rubbed.", hi: "वे सबसे पुराने पुरोहित और सबसे नई लौ हैं, अरणि मथने पर हर बार नए जन्मते हुए।" },
      schools: [{ id: "mimamsa", en: "Some Mīmāṃsakas said a god like Agni exists only as the name in the mantra: what matters is the offering and the word, not a person who receives it.", hi: "कुछ मीमांसकों ने कहा कि अग्नि जैसे देवता केवल मंत्र में नाम के रूप में हैं: महत्त्व आहुति और शब्द का है, उसे ग्रहण करने वाले किसी व्यक्ति का नहीं।" }, { id: "nyaya", en: "Nyāya would object: an offering needs someone to receive it, as testimony needs someone to speak. A god who is only a word cannot be thanked.", hi: "न्याय आपत्ति करता: आहुति को कोई ग्रहण करने वाला चाहिए, जैसे शब्द को कोई बोलने वाला। जो देवता केवल शब्द है, उसे धन्यवाद नहीं दिया जा सकता।" }]
    },
    "103": {
      line2: { en: "The Gāyatrī of square 25 is addressed to him as Savitṛ, the one who sets the world in motion each morning.", hi: "खाना २५ की गायत्री उन्हें सविता के रूप में संबोधित है, जो हर सुबह जगत को गति देते हैं।" },
      schools: [{ id: "carvaka", en: "For the Cārvāka only perception counts, and Sūrya is the one god on this row you can actually see. He warms you; nothing shows that he watches you.", hi: "चार्वाक के लिए केवल प्रत्यक्ष प्रमाण है, और सूर्य इस पंक्ति में अकेले देवता हैं जिन्हें आप सचमुच देख सकते हैं। वे आपको गर्मी देते हैं; कुछ नहीं दिखाता कि वे आपको देखते हैं।" }, { id: "nyaya", en: "Nyāya replies that most of what you know you never saw. Nobody sees the sun move, yet everyone infers it, because it is somewhere else by evening.", hi: "न्याय का उत्तर है कि आप जो जानते हैं उसका अधिकांश आपने कभी देखा नहीं। सूर्य को चलते कोई नहीं देखता, फिर भी सब अनुमान करते हैं, क्योंकि शाम तक वह कहीं और होता है।" }]
    },
    "104": {
      line2: { en: "Every beginning starts with him, so he waits here, near the end, to clear the way for the last one.", hi: "हर आरंभ उन्हीं से होता है, इसलिए वे यहाँ अंत के पास प्रतीक्षा करते हैं, अंतिम आरंभ का मार्ग खोलने के लिए।" },
      schools: [{ id: "yoga", en: "Patañjali lists nine obstacles to a settled mind, among them illness, doubt, carelessness and sheer inability to stay put (Yoga Sūtra 1.30). He offers two cures side by side, steady practice or devotion to Īśvara, and never says which is better.", hi: "पतंजलि स्थिर मन के नौ विघ्न गिनाते हैं, जिनमें रोग, संशय, प्रमाद और टिक न पाना भी हैं (योगसूत्र १.३०)। वे दो उपाय साथ-साथ देते हैं, निरंतर अभ्यास या ईश्वर-प्रणिधान, और कभी नहीं कहते कि कौन बेहतर है।" }, { id: "mimamsa", en: "Mīmāṃsā has its own idea of an obstacle: a fault in the rite. It is cured by an expiation (prāyaścitta), done correctly, and no god needs to be asked.", hi: "मीमांसा के लिए विघ्न का अर्थ है कर्मकांड में कोई दोष। उसका उपचार प्रायश्चित्त है, सही विधि से किया हुआ, और किसी देवता से माँगने की ज़रूरत नहीं।" }],
      figures: ["patanjali"]
    },
    "105": {
      iast: "Mokṣa",
      views: [{ id: "nyaya", en: "Nyāya: apavarga, the end of all suffering. Not bliss, and only after death.", hi: "न्याय: अपवर्ग, सब दुःखों का अंत। आनंद नहीं, और केवल मृत्यु के बाद।" }, { id: "samkhya", en: "Sāṃkhya and Yoga: kaivalya, the watcher alone, seeing it was never bound.", hi: "सांख्य और योग: कैवल्य, द्रष्टा अकेला, यह देखता हुआ कि वह कभी बँधा ही नहीं था।" }, { id: "mimamsa", en: "Mīmāṃsā, for centuries: there is no such square. Heaven at 101 was enough.", hi: "मीमांसा, सदियों तक: ऐसा कोई खाना नहीं। १०१ पर स्वर्ग पर्याप्त था।" }, { id: "advaita", en: "Advaita: knowing you were always Brahman. You did not arrive; you recognised.", hi: "अद्वैत: यह जानना कि आप सदा से ब्रह्म थे। आप पहुँचे नहीं; आपने पहचाना।" }, { id: "vishishtadvaita", en: "Viśiṣṭādvaita: union with Brahman in which you stay yourself. Equal to God in bliss, never one with him in number, and serving forever.", hi: "विशिष्टाद्वैत: ब्रह्म से ऐसा मिलन जिसमें आप स्वयं बने रहते हैं। आनंद में ईश्वर के समान, संख्या में कभी एक नहीं, और सदा सेवा में।" }, { id: "dvaita", en: "Dvaita: eternal service of Viṣṇu, by his grace. Even the liberated are ranked, each as blissful as its own nature allows.", hi: "द्वैत: विष्णु की कृपा से उनकी नित्य सेवा। मुक्त जीवों में भी तारतम्य है, हर एक उतना आनंदित जितना उसका स्वभाव अनुमति दे।" }],
      beyond: [{ id: "jaina", en: "Jainism: the soul, free of karmic dust, rising to the top of the universe.", hi: "जैन: कर्म की धूल से मुक्त जीव, लोक के शिखर तक उठता हुआ।" }, { id: "bauddha", en: "Buddhism: nirvāṇa, the flame blown out, with no one left who was bound.", hi: "बौद्ध: निर्वाण, लौ का बुझ जाना, बिना किसी के जो बँधा था।" }, { id: "carvaka", en: "Cārvāka: death is liberation. Live well on the way.", hi: "चार्वाक: मृत्यु ही मोक्ष है। रास्ते में अच्छे से जियो।" }],
      scholar: { en: "They all said you had arrived, and they meant six different things. Each name opens that school in the Codex.", hi: "सबने कहा कि आप पहुँच गए, और उनके छह अलग अर्थ थे। हर नाम कोश में उस दर्शन को खोलता है।" }
    },
    "106": {
      line2: { en: "She is fortune, and fortune is fickle; she is also Śrī, who never leaves Viṣṇu's side.", hi: "वे भाग्य हैं, और भाग्य चंचल है; वे श्री भी हैं, जो विष्णु का साथ कभी नहीं छोड़तीं।" },
      schools: [{ id: "vishishtadvaita", en: "In Rāmānuja's tradition Śrī is the mediator (puruṣakāra): she turns God's face toward the soul that has fallen short.", hi: "रामानुज की परंपरा में श्री पुरुषकार हैं, मध्यस्थ: वे ईश्वर का मुख उस जीव की ओर मोड़ती हैं जो चूक गया है।" }, { id: "dvaita", en: "For Madhva, Lakṣmī is the highest of all dependent beings: eternally free, and still never independent. Only Viṣṇu is.", hi: "मध्व के लिए लक्ष्मी सभी आश्रित जीवों में सर्वोच्च हैं: नित्य मुक्त, फिर भी कभी स्वतंत्र नहीं। स्वतंत्र केवल विष्णु हैं।" }]
    },
    "107": {
      line2: { en: "Telling milk from water is called nīra-kṣīra-viveka, the discernment of square 85, given wings.", hi: "दूध और पानी अलग करना नीर-क्षीर-विवेक कहलाता है, खाना ८५ का विवेक, जिसे पंख मिल गए।" },
      schools: [{ id: "nyaya", en: "Nyāya's whole project is the swan's: telling valid knowledge (pramā) from error, and showing exactly how you can tell.", hi: "न्याय का पूरा काम हंस का काम है: प्रमा को भ्रम से अलग करना, और ठीक-ठीक दिखाना कि यह कैसे पहचाना जाता है।" }, { id: "mimamsa", en: "Mīmāṃsā turns the swan round: every cognition is valid by itself (svataḥ prāmāṇya), and only error has to be shown. Telling milk from water is the exception, not the rule.", hi: "मीमांसा हंस को उलट देती है: हर ज्ञान स्वतः प्रमाण है, और केवल भ्रम को सिद्ध करना पड़ता है। दूध और पानी को अलग करना अपवाद है, नियम नहीं।" }]
    },
    "108": {
      line2: { en: "The gods came after creation, says the hymn, so who can know where it came from?", hi: "सूक्त कहता है, देवता सृष्टि के बाद आए, तो कौन जान सकता है कि यह कहाँ से आई?" },
      schools: [{ id: "vaisheshika", en: "Vaiśeṣika pictured creation as atoms combining, pairs into triads into everything, set moving by God at the start of each cycle.", hi: "वैशेषिक ने सृष्टि को परमाणुओं के जुड़ने के रूप में देखा, दो से तीन, तीन से सब कुछ, जिन्हें हर कल्प के आरंभ में ईश्वर गति देते हैं।" }, { id: "mimamsa", en: "Mīmāṃsā and the Jains both denied it: the world was never created and will never wholly end.", hi: "मीमांसा और जैन दोनों ने इसे नकारा: जगत कभी रचा नहीं गया और कभी पूरी तरह समाप्त नहीं होगा।" }],
      figures: ["kumarila"]
    },
    "109": {
      line2: { en: "He comes down whenever dharma fails: as fish, tortoise, boar, man-lion, dwarf, and the rest.", hi: "जब भी धर्म डगमगाता है वे उतरते हैं: मत्स्य, कूर्म, वराह, नरसिंह, वामन, और आगे के रूपों में।" },
      schools: [{ id: "dvaita", en: "For Madhva, Viṣṇu alone is fully independent (svatantra). Every soul and every god on this row depends on him.", hi: "मध्व के लिए केवल विष्णु पूर्णतः स्वतंत्र हैं। इस पंक्ति का हर जीव और हर देवता उन पर निर्भर है।" }, { id: "advaita", en: "Śaṅkara would accept every descent and still call each an appearance of a Brahman that never comes down, because it was never up.", hi: "शंकर हर अवतार को मानते और फिर भी हर एक को उस ब्रह्म का आभास कहते जो कभी उतरता नहीं, क्योंकि वह कभी ऊपर था ही नहीं।" }]
    },
    "110": {
      line2: { en: "He dances the world into being and out of it again; the destroyer is also the one who sets free.", hi: "वे नृत्य से जगत को रचते हैं और फिर उसे समेटते हैं; संहारक ही मुक्त करने वाले भी हैं।" },
      schools: [{ id: "trika", en: "For the Kashmir Śaivas, Śiva is not a god up here but consciousness itself, everywhere on the board, freely appearing as all of it.", hi: "काश्मीर शैवों के लिए शिव यहाँ ऊपर बैठे कोई देवता नहीं, स्वयं चेतना हैं, पूरे बोर्ड पर, स्वतंत्रता से सब कुछ बनकर प्रकट।" }, { id: "advaita", en: "Advaita agrees Śiva is consciousness and disagrees about the world: for Śaṅkara it is appearance, for the Śaivas it is Śiva's own real play.", hi: "अद्वैत सहमत है कि शिव चेतना हैं, पर संसार पर असहमत: शंकर के लिए वह आभास है, शैवों के लिए शिव की अपनी वास्तविक लीला।" }],
      figures: ["abhinavagupta"]
    }
  };

  // content/codex.json
  var codex_default = {
    schools: {
      nyaya: { name: { en: "Nyaya", hi: "न्याय" }, iast: "Nyāya", tag: { en: "Āstika · logic", hi: "आस्तिक · तर्कशास्त्र" }, url: "https://en.wikipedia.org/wiki/Nyaya", line: { en: "The school of argument: how do you know what you claim to know?", hi: "तर्क का दर्शन: जो आप जानने का दावा करते हैं, उसे आप जानते कैसे हैं?" }, body: { en: "Nyāya accepts four means of knowledge: perception, inference, comparison and testimony. Its five-step inference (the hill has fire, because it has smoke, as in a kitchen) became the grammar of Indian debate. It holds that selves are many and real, that God can be inferred as the maker of the world, and that the self is known from its marks: desire, aversion, effort, pleasure, pain and knowing.", hi: "न्याय ज्ञान के चार साधन मानता है: प्रत्यक्ष, अनुमान, उपमान और शब्द। इसका पाँच अंगों वाला अनुमान (पर्वत पर आग है, क्योंकि धुआँ है, जैसे रसोई में) भारतीय शास्त्रार्थ का व्याकरण बन गया। यह मानता है कि आत्माएँ अनेक और वास्तविक हैं, कि ईश्वर का अनुमान जगत के कर्ता के रूप में होता है, और आत्मा अपने लक्षणों से जानी जाती है: इच्छा, द्वेष, प्रयत्न, सुख, दुःख और ज्ञान।" }, moksha: { en: "Apavarga: the end of all suffering. Not bliss, and only after death.", hi: "अपवर्ग: सब दुःखों का अंत। आनंद नहीं, और केवल मृत्यु के बाद।" } },
